openapi: 3.1.0
info:
  title: Nexo Admin API
  version: "1"
  description: |
    Administration API of the Nexo object storage server, served on the console
    listener under `/api/v1`. JSON in, JSON out; failures are RFC 9457
    `application/problem+json` documents with a stable snake_case `code`
    (`unauthenticated`, `access_denied`, `invalid_csrf_token`, `invalid_argument`,
    `bucket_not_found`, `object_not_found`, `user_not_found`, `policy_not_found`,
    `conflict`, `malformed_policy`, `invalid_configuration`, `object_locked`,
    `entity_too_large`, `not_implemented`...).

    Authentication, one of:
    - the console session: the `nexo_session` cookie (HttpOnly, SameSite=Strict,
      issued by `POST /auth/login`). A state-changing request must also carry the
      `X-CSRF-Token` header with the `csrfToken` of the session (returned by login
      and `GET /auth/session`, never set in a cookie) and come from the console
      origin: `Sec-Fetch-Site: same-origin` or, from a browser that does not send it,
      an `Origin` (else `Referer`) of the console; otherwise 403
      `invalid_csrf_token`. The ports of a host are same-site, so the pages of the
      S3 listener receive the session cookie too: the origin check refuses them;
    - AWS Signature Version 4 in the `Authorization` header (CLI, SDKs), with the
      service `s3` and the region of the server in the credential scope. Presigned
      URLs are not accepted.

    Authorization: every operation lists in `x-nexo-actions` the `admin:*` and
    `s3:*` policy actions it requires, evaluated by the policy engine (docs/04
    §4.4). Operations marked `x-nexo-authorized-by: service` are authorized by the
    service object by object (resources in the body) or with the self-service rule
    (a user always manages its own access keys and share links).

    Lists answer `{items, nextCursor}` and accept `cursor` (opaque) and `limit`
    (1-1000, default 1000).

    Rate limits: every operation may answer 429 `too_many_requests` with a
    `Retry-After` header (seconds) when a rate limit of the node refuses the
    request (`ratelimit.admin_ip` per client address, `ratelimit.admin_user` per
    authenticated user; dynamic configuration, off by default).

    This document is the source of the TypeScript types of the web console
    (`web/src/services/http/schema.d.ts`, generated with `npm run gen:api`); the Go
    transport (`internal/transport/http/admin`) is the reference implementation and
    `pkg/nexoadmin` its Go client.
servers:
  - url: /api/v1

security:
  - session: []
    csrf: []
  - sigv4: []

tags:
  - name: session
  - name: server
  - name: buckets
  - name: objects
  - name: uploads
  - name: shares
  - name: users
  - name: groups
  - name: access-keys
  - name: policies
  - name: config
  - name: cluster
  - name: notify
  - name: kms
  - name: access-rules
  - name: distributions
  - name: certificates
  - name: cache
  - name: diagnostics
  - name: monitoring

paths:
  /auth/login:
    post:
      tags: [session]
      operationId: login
      summary: Open a console session
      description: >-
        Public endpoint. Sets the `nexo_session` cookie (HttpOnly); the CSRF token is in the body
        (`csrfToken`), never in a cookie. After 5 failed
        attempts of a client on an access key (or 20 of a client on any key) within 5 minutes, the
        attempts are refused for a minute (429 `too_many_requests` with Retry-After), even with the
        right secret; the client is the peer of the connection or, behind the `--trusted-proxies`,
        the address they forward. Against login CSRF the body must be `application/json` (415
        `unsupported_media_type`) and a browser request must not be cross-site (`Sec-Fetch-Site`
        `cross-site` or `same-site`: 403 `cross_site_request`). With `provider` `ldap` the user of
        the LDAP directory (`identity_ldap`) logs in with `username` and `password`: the session
        is backed by federated temporary credentials whose policies come from the Nexo groups
        named like its directory groups (401 for wrong credentials or a user mapping to no
        policy, 501 when LDAP is disabled, 503 when the directory is unreachable).
      security: []
      x-nexo-actions: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429":
          description: Too many failed attempts.
          headers:
            Retry-After:
              description: Seconds before the next attempt is verified.
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/providers:
    get:
      tags: [session]
      operationId: authProviders
      summary: The identity providers of the console login
      description: Public endpoint, read by the login page.
      security: []
      x-nexo-actions: []
      responses:
        "200":
          description: The enabled providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProviders" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/openid/start:
    get:
      tags: [session]
      operationId: openIDStart
      summary: Start the OpenID Connect login of the console
      description: >-
        Public endpoint the browser navigates to. Redirects to the authorization endpoint of the
        provider (`identity_openid`) with a state, a nonce and a PKCE S256 challenge, kept in the
        `nexo_oidc` cookie (HttpOnly, SameSite=Lax, ten minutes). When the provider is disabled or
        unreachable, redirects to `/login?error=sso_unavailable`.
      security: []
      x-nexo-actions: []
      responses:
        "302": { description: "Redirect to the provider, or back to the login page." }
  /auth/openid/callback:
    get:
      tags: [session]
      operationId: openIDCallback
      summary: Complete the OpenID Connect login of the console
      description: >-
        The redirect URI registered at the provider (`identity_openid` `redirect_uri`, else the
        public console URL or the host reached, followed by `/api/v1/auth/openid/callback`).
        Checks the state against the `nexo_oidc` cookie (single use), exchanges the code with
        the PKCE verifier, verifies the ID token and its nonce, then sets the `nexo_session`
        cookie and redirects to the console (`/`). A failure redirects to `/login?error=` with
        `sso_denied` (refused by the provider, or a user mapping to no policy),
        `sso_unavailable` or `sso_failed`.
      security: []
      x-nexo-actions: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect to the console, or back to the login page." }
  /auth/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Revoke the current session and clear the cookies
      x-nexo-actions: []
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/session:
    get:
      tags: [session]
      operationId: currentSession
      summary: Return the current console session
      description: Signed (SigV4) requests have no session and receive 401.
      x-nexo-actions: []
      responses:
        "200":
          description: The session, with the effective policies and the expiration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /me/permissions:
    get:
      tags: [session]
      operationId: myPermissions
      summary: Effective permissions of the caller (or of a user)
      description: |
        Evaluates the catalog of console actions (`admin:*` and `s3:*`) with the policy
        engine, globally or on `bucket` (object actions on `prefix*`). Naming another
        `user` requires `admin:GetUser`.
      x-nexo-actions: ["admin:GetUser"]
      parameters:
        - { name: bucket, in: query, schema: { type: string } }
        - { name: prefix, in: query, schema: { type: string } }
        - { name: user, in: query, schema: { type: string } }
      responses:
        "200":
          description: Allowed and denied actions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Permissions" }
        default: { $ref: "#/components/responses/Problem" }

  /info:
    get:
      tags: [server]
      operationId: serverInfo
      summary: Server and cluster information
      x-nexo-actions: ["admin:ServerInfo"]
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        default: { $ref: "#/components/responses/Problem" }
  /usage:
    get:
      tags: [server]
      operationId: dataUsage
      summary: Data usage, total and per bucket
      x-nexo-actions: ["admin:DataUsageInfo"]
      responses:
        "200":
          description: Data usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataUsage" }
        default: { $ref: "#/components/responses/Problem" }
  /heal:
    post:
      tags: [server]
      operationId: startHeal
      summary: Start a healing job
      description: |
        Starts a background healing job and answers at once with its initial state; poll
        `GET /heal/{id}` for the progress. Without `bucket` the job heals the format of the
        drives (new or wiped drives) and every bucket; with `bucket` that bucket; with
        `recursive` every object below the bucket(s) or `prefix` too (without `recursive`,
        `prefix` names the one object to heal). `deep` verifies the bitrot hash of every
        shard block, `dryRun` only reports, `remove` deletes the dangling objects found
        (versions on too few drives to ever be read; never implied). An identical job
        already running is returned instead of a new one; too many running jobs answer 429.
        A single-drive deployment has nothing to heal: 501.
      x-nexo-actions: ["admin:Heal"]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealRequest" }
      responses:
        "202":
          description: The healing job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealJob" }
        "429": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [server]
      operationId: listHeals
      summary: List the running and recently finished healing jobs
      description: Newest first; a finished job stays listed for an hour.
      x-nexo-actions: ["admin:Heal"]
      responses:
        "200":
          description: The healing jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealJobList" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /heal/{id}:
    get:
      tags: [server]
      operationId: healStatus
      summary: Query a healing job
      description: Any node answers, the progress of a job being persisted on the drives.
      x-nexo-actions: ["admin:Heal"]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The healing job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealJob" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /storage/metadata-log/compact:
    post:
      tags: [server]
      operationId: compactMetadataLog
      summary: Compact the metadata logs of the answering node
      description: |
        Rewrites every segment of the metadata log holding garbage, on each local drive in
        log mode of the node that answers (in a cluster, call each node). The live records
        are copied before the old segment is removed, so no metadata is ever lost. Drives in
        classic mode are skipped.
      x-nexo-actions: ["admin:Heal"]
      responses:
        "200":
          description: The compaction of each drive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataLogCompaction" }
        default: { $ref: "#/components/responses/Problem" }
  /service/restart:
    post:
      tags: [server]
      operationId: restartService
      summary: Restart the server
      description: The response is sent before the process restarts (in place, within the process; SIGHUP only reloads the TLS certificates).
      x-nexo-actions: ["admin:ServiceRestart"]
      responses:
        "202":
          description: Restart accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAction" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /service/stop:
    post:
      tags: [server]
      operationId: stopService
      summary: Stop the server
      x-nexo-actions: ["admin:ServiceStop"]
      responses:
        "202":
          description: Stop accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAction" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /service/update:
    get:
      tags: [server]
      operationId: updateStatus
      summary: The last update or coordinated restart of the deployment
      description: A job whose orchestrating node restarted is completed by the node answering, once every node is back.
      x-nexo-actions: ["admin:ServerInfo"]
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateJob" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [server]
      operationId: startUpdate
      summary: Update the server binary of every node
      description: >-
        Every node downloads the binary next to the one it runs, verifies its SHA-256 and its version; the nodes then
        restart with it one at a time (rolling, while one more node can stop without losing the write quorum) or all at
        once. The node answering restarts last. The job runs in the background (GET /service/update).
      x-nexo-actions: ["admin:ServerUpdate"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRequest" }
      responses:
        "202":
          description: The job, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateJob" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /service/cluster/restart:
    post:
      tags: [server]
      operationId: restartCluster
      summary: Restart every node of the deployment
      description: One node at a time (rolling, default) or all at once; the node answering restarts last. The job runs in the background (GET /service/update).
      x-nexo-actions: ["admin:ServiceRestart"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [rolling, all] }
      responses:
        "202":
          description: The job, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateJob" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /service/cluster/stop:
    post:
      tags: [server]
      operationId: stopCluster
      summary: Stop every node of the deployment
      description: The other nodes first, then the node answering, once the response is sent.
      x-nexo-actions: ["admin:ServiceStop"]
      responses:
        "202":
          description: Stop accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAction" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /trace:
    get:
      tags: [monitoring]
      operationId: serverTrace
      summary: Live trace of the requests (Server-Sent Events)
      description: |
        Streams one event per S3, Admin API, website or internode request served by
        the deployment, the nodes of a cluster included (`node` restricts them),
        as `text/event-stream`: `event: trace` with a TraceEvent, `event: dropped`
        with a StreamDropped when the client did not keep up (the server never
        waits for a slow stream: it drops events and counts them), a `: heartbeat`
        comment while idle. The query strings are redacted (signatures,
        credentials, tokens); headers and bodies are never part of an event.
        Without `type`, every type but `rpc`. A node serves at most 256 live
        trace streams at once (the streams the peers open for their own
        subscribers included): beyond them a new one answers 429
        `too_many_requests`.
      x-nexo-actions: ["admin:ServerTrace"]
      parameters:
        - { name: node, in: query, description: "Nodes to trace (comma-separated or repeated)", schema: { type: string } }
        - { name: type, in: query, description: "Request types: s3, admin, web, rpc (comma-separated)", schema: { type: string } }
        - { name: api, in: query, description: "API names (PutObject, GET /buckets...), comma-separated", schema: { type: string } }
        - { name: bucket, in: query, description: "Buckets (comma-separated)", schema: { type: string } }
        - { name: status, in: query, description: "Status codes (404) or classes (5xx), comma-separated", schema: { type: string } }
        - { name: errors, in: query, description: "Only the failed requests (status >= 400)", schema: { type: boolean } }
        - { name: threshold, in: query, description: "Only the requests slower than this duration (500ms, 2s)", schema: { type: string } }
      responses:
        "200":
          description: The stream of the events.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /logs:
    get:
      tags: [monitoring]
      operationId: serverLogs
      summary: Live server logs (Server-Sent Events)
      description: |
        Streams the log entries of the deployment, the nodes of a cluster included,
        as `text/event-stream`: `event: log` with a LogEntry, `event: dropped` with
        a StreamDropped, a `: heartbeat` comment while idle. `last` first replays
        up to that many recent entries of each node (at most 10000). Secrets
        (credentials, signatures, tokens, passwords) are redacted from the entries.
        A node serves at most 256 live log streams at once (the streams the peers
        open for their own subscribers included): beyond them a new one answers
        429 `too_many_requests`.
      x-nexo-actions: ["admin:ConsoleLog"]
      parameters:
        - { name: node, in: query, description: "Nodes (comma-separated or repeated)", schema: { type: string } }
        - { name: level, in: query, description: "Minimum level", schema: { type: string, enum: [debug, info, warn, error, DEBUG, INFO, WARN, ERROR] } }
        - { name: last, in: query, description: "Recent entries to replay first", schema: { type: integer, minimum: 0, maximum: 10000 } }
      responses:
        "200":
          description: The stream of the entries.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit:
    get:
      tags: [monitoring]
      operationId: searchAudit
      summary: Search the recent audit log
      description: |
        Searches the audit records kept in memory by every node (the most recent
        ones; the complete log goes to the JSON log and to the audit targets
        audit_webhook and audit_kafka), newest first. An audit record is produced
        for every authenticated S3 and Admin API request.
      x-nexo-actions: ["admin:ConsoleLog"]
      parameters:
        - { name: node, in: query, description: "Nodes (comma-separated or repeated)", schema: { type: string } }
        - { name: api, in: query, description: "API name (PutObject, GET /buckets...)", schema: { type: string } }
        - { name: bucket, in: query, schema: { type: string } }
        - { name: user, in: query, description: "Access key or parent user", schema: { type: string } }
        - { name: type, in: query, description: "Request type", schema: { type: string, enum: [s3, admin] } }
        - { name: status, in: query, description: "Status codes (404) or classes (5xx), comma-separated", schema: { type: string } }
        - { name: errors, in: query, description: "Only the failed requests (status >= 400)", schema: { type: boolean } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: requestId, in: query, schema: { type: string } }
        - { name: limit, in: query, description: "At most this many records (default 100, at most 1000)", schema: { type: integer, minimum: 0, maximum: 1000 } }
      responses:
        "200":
          description: The matching audit records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /metrics:
    get:
      tags: [monitoring]
      operationId: listMetrics
      summary: The series of the metrics of the console
      description: |
        The series kept by every node in memory (one point every 10 seconds for
        24 hours) for the charts of the console. Allowed with `admin:Prometheus`
        or `admin:ServerInfo` (either one).
      x-nexo-actions: ["admin:Prometheus", "admin:ServerInfo"]
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricList" }
        default: { $ref: "#/components/responses/Problem" }
  /metrics/query:
    get:
      tags: [monitoring]
      operationId: queryMetric
      summary: The points of a series, per node and for the cluster
      description: |
        The points of `metric` from `end - range` to `end` every `step`, for every
        node (or those of `node`) and aggregated for the cluster; a point without
        sample (node down, older than the buffer) is null. Allowed with
        `admin:Prometheus` or `admin:ServerInfo` (either one).
      x-nexo-actions: ["admin:Prometheus", "admin:ServerInfo"]
      parameters:
        - { name: metric, in: query, required: true, description: "Name of the series (GET /metrics)", schema: { type: string } }
        - { name: range, in: query, description: "Span of the points (default 1h, at most 24h)", schema: { type: string } }
        - { name: step, in: query, description: "Distance between two points (multiple of 10s; default keeps at most 360 points)", schema: { type: string } }
        - { name: end, in: query, description: "End of the range (default now)", schema: { type: string, format: date-time } }
        - { name: node, in: query, description: "Nodes (comma-separated or repeated)", schema: { type: string } }
      responses:
        "200":
          description: The points.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricSeries" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /buckets:
    get:
      tags: [buckets]
      operationId: listBuckets
      summary: List the buckets visible to the caller, with usage and public flag
      description: Every bucket with s3:ListAllMyBuckets, otherwise those the caller may list (s3:ListBucket).
      x-nexo-actions: ["s3:ListAllMyBuckets", "s3:ListBucket"]
      x-nexo-authorized-by: service
      parameters:
        - { name: prefix, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: A page of buckets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [buckets]
      operationId: createBucket
      summary: Create a bucket with its initial settings
      description: Versioning, object lock and quota need their own actions on top of s3:CreateBucket.
      x-nexo-actions: ["s3:CreateBucket", "s3:PutBucketVersioning", "s3:PutBucketObjectLockConfiguration", "admin:SetBucketQuota"]
      x-nexo-authorized-by: service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBucketRequest" }
      responses:
        "201":
          description: The bucket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bucket" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucket
      summary: Get a bucket with its usage
      description: >-
        A caller that may list only a part of the bucket (s3:ListBucket under an
        s3:prefix condition, a home directory) gets its name, creation date and
        region only (partial).
      x-nexo-actions: ["s3:ListBucket"]
      responses:
        "200":
          description: The bucket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bucket" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucket
      summary: Delete a bucket
      description: |
        With `force=true` (and s3:ForceDeleteBucket) the bucket is emptied first through the
        object layer: every version, delete marker and pending upload; object lock is
        honored, a protected version keeps the bucket (409 bucket_not_empty).
      x-nexo-actions: ["s3:DeleteBucket", "s3:ForceDeleteBucket"]
      parameters:
        - name: force
          in: query
          description: Empty the bucket before deleting it.
          schema: { type: boolean }
      responses:
        "204": { description: Deleted. }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/versioning:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketVersioning
      x-nexo-actions: ["s3:GetBucketVersioning"]
      responses:
        "200":
          description: The versioning state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketVersioning" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketVersioning
      x-nexo-actions: ["s3:PutBucketVersioning"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketVersioning" }
      responses:
        "200":
          description: The versioning state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketVersioning" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/policy:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketPolicy
      x-nexo-actions: ["s3:GetBucketPolicy"]
      responses:
        "200":
          description: The bucket policy document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyDocument" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketPolicy
      description: The body is the policy document; errors are malformed_policy problems located by line and column.
      x-nexo-actions: ["s3:PutBucketPolicy"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyDocument" }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucketPolicy
      x-nexo-actions: ["s3:DeleteBucketPolicy"]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/quota:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketQuota
      x-nexo-actions: ["admin:GetBucketQuota"]
      responses:
        "200":
          description: The quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketQuota" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketQuota
      x-nexo-actions: ["admin:SetBucketQuota"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketQuota" }
      responses:
        "200":
          description: The quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketQuota" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/tags:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketTags
      description: The tags; a bucket without tags answers an empty set.
      x-nexo-actions: ["s3:GetBucketTagging"]
      responses:
        "200":
          description: The tags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tags" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketTags
      description: Replaces the tags; an empty set removes them.
      x-nexo-actions: ["s3:PutBucketTagging"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Tags" }
      responses:
        "200":
          description: The tags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tags" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objectlock:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketObjectLock
      description: The object lock configuration; a bucket without object lock answers {"enabled":false}.
      x-nexo-actions: ["s3:GetBucketObjectLockConfiguration"]
      responses:
        "200":
          description: The object lock configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketObjectLock" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketObjectLock
      x-nexo-actions: ["s3:PutBucketObjectLockConfiguration"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketObjectLock" }
      responses:
        "200":
          description: The object lock configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketObjectLock" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/encryption:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketEncryption
      x-nexo-actions: ["s3:GetEncryptionConfiguration"]
      responses:
        "200":
          description: The default encryption.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketEncryption" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketEncryption
      x-nexo-actions: ["s3:PutEncryptionConfiguration"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketEncryption" }
      responses:
        "200":
          description: The default encryption.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketEncryption" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucketEncryption
      x-nexo-actions: ["s3:PutEncryptionConfiguration"]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/access:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketAccess
      summary: Anonymous access rules (presets per prefix) of the bucket policy
      x-nexo-actions: ["s3:GetBucketPolicy"]
      responses:
        "200":
          description: The anonymous access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketAccess" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketAccess
      summary: Apply an anonymous access preset to a prefix
      description: private removes the rule of the prefix; the other statements of the bucket policy are kept.
      x-nexo-actions: ["s3:PutBucketPolicy"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAccessRequest" }
      responses:
        "200":
          description: The anonymous access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketAccess" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: removeBucketAccess
      summary: Remove the anonymous access of a prefix (private)
      x-nexo-actions: ["s3:PutBucketPolicy"]
      parameters:
        - { name: prefix, in: query, description: The prefix; the whole bucket when absent., schema: { type: string } }
      responses:
        "200":
          description: The anonymous access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketAccess" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/lifecycle:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketLifecycle
      summary: Lifecycle rules of the bucket
      description: |
        The rules of the S3 LifecycleConfiguration of the bucket in structured form (what
        the S3 API stores and reads). A bucket without configuration answers no rule.
      x-nexo-actions: ["s3:GetLifecycleConfiguration"]
      responses:
        "200":
          description: The lifecycle rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketLifecycle
      summary: Replace the lifecycle rules of the bucket
      description: |
        Every rule is validated on its own with the rules of the S3 API: a rejected
        configuration answers 400 `invalid_configuration` with every invalid rule in
        `ruleErrors` (index, id, S3 code, message) and nothing is stored. Rules without
        id get one. No rule removes the configuration. Transitions need a remote tier
        (P2): without one they are refused (code NotImplemented).
      x-nexo-actions: ["s3:PutLifecycleConfiguration"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifecycleConfiguration" }
      responses:
        "200":
          description: The rules as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucketLifecycle
      summary: Remove the lifecycle configuration
      x-nexo-actions: ["s3:PutLifecycleConfiguration"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/lifecycle/apply:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [buckets]
      operationId: applyBucketLifecycle
      summary: Apply the lifecycle rules now
      description: |
        Applies the rules to every version and incomplete upload of the bucket at once,
        as the scanner does over its cycle: the expired versions are removed (those
        Object Lock protects only get a delete marker, counted in `locked`). A bucket
        without configuration is left as is.
      x-nexo-actions: ["s3:PutLifecycleConfiguration", "admin:ApplyLifecycle"]
      responses:
        "200":
          description: What was applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleApplyResult" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/events:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketEvents
      summary: Event subscriptions of the bucket
      description: |
        The S3 NotificationConfiguration of the bucket in structured form; a bucket
        without configuration answers no subscription.
      x-nexo-actions: ["s3:GetBucketNotification"]
      responses:
        "200":
          description: The subscriptions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketNotifications" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketEvents
      summary: Replace the event subscriptions of the bucket
      description: |
        Every subscription is validated on its own (known events, prefix/suffix filters, an
        ARN naming a configured target, see `GET /notify/targets`): a rejected
        configuration answers 400 `invalid_configuration` with every invalid subscription in
        `ruleErrors`. Subscriptions without id get one. No subscription removes them all.
      x-nexo-actions: ["s3:PutBucketNotification"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BucketNotifications" }
      responses:
        "200":
          description: The subscriptions as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketNotifications" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucketEvents
      summary: Remove every event subscription of the bucket
      x-nexo-actions: ["s3:PutBucketNotification"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/cors:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketCors
      summary: CORS rules of the bucket
      description: The rules of the S3 CORSConfiguration, evaluated in order; a bucket without configuration answers no rule.
      x-nexo-actions: ["s3:GetBucketCORS"]
      responses:
        "200":
          description: The CORS rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorsConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketCors
      summary: Replace the CORS rules of the bucket
      description: |
        1 to 100 rules, each validated on its own: a rejected configuration answers 400
        `invalid_configuration` with every invalid rule in `ruleErrors`. No rule removes
        the configuration.
      x-nexo-actions: ["s3:PutBucketCORS"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorsConfiguration" }
      responses:
        "200":
          description: The CORS rules as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorsConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucketCors
      summary: Remove the CORS configuration
      x-nexo-actions: ["s3:PutBucketCORS"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/media:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketMedia
      summary: Video rules of the bucket
      description: |
        The rules that select the videos the media worker processes and what it derives from
        them (renditions, poster, thumbnails); the first rule selecting a key applies. A bucket
        without configuration answers no rule. Streaming the source needs no rule.
      x-nexo-actions: ["admin:GetBucketMedia"]
      responses:
        "200":
          description: The media rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketMedia
      summary: Replace the video rules of the bucket
      description: |
        At most 100 rules, each validated on its own: a rejected configuration answers 400
        `invalid_configuration` with every invalid rule in `ruleErrors`. The stored rules are
        normalized (suffixes lowercased with their default, renditions tallest first). No rule
        removes the configuration.
      x-nexo-actions: ["admin:SetBucketMedia"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaConfiguration" }
      responses:
        "200":
          description: The media rules as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucketMedia
      summary: Remove the video rules
      x-nexo-actions: ["admin:SetBucketMedia"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/media/reprocess:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [buckets]
      operationId: reprocessMedia
      summary: Process a video again
      description: |
        Queues a job of the media worker deriving the outputs of a version of a video again,
        with the rule of the bucket that selects it (400 when none does). The job is delivered
        through the persistent queue of the media worker target.
      x-nexo-actions: ["admin:SetBucketMedia"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaReprocessRequest" }
      responses:
        "202": { description: Queued. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/replication:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getBucketReplication
      summary: Replication rules of a bucket (S-BKT-12)
      description: >-
        The rules of the ReplicationConfiguration of the bucket in the console form (no rule:
        none). The S3 API serves the same configuration as XML (GetBucketReplication).
      x-nexo-actions: ["s3:GetReplicationConfiguration"]
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [buckets]
      operationId: setBucketReplication
      summary: Replace the replication rules of a bucket
      description: >-
        The bucket must have versioning enabled (which then cannot be suspended) and every target
        must be a replication target of the bucket (400 otherwise). No rule removes the
        configuration. The versions written from then on are replicated asynchronously, with their
        id, time and ETag; a resync replicates those written before.
      x-nexo-actions: ["s3:PutReplicationConfiguration"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplicationConfiguration" }
      responses:
        "200":
          description: The rules stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationConfiguration" }
        "204": { description: Removed (no rule). }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: deleteBucketReplication
      summary: Remove the replication rules of a bucket
      x-nexo-actions: ["s3:PutReplicationConfiguration"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/replication/targets:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: listReplicationTargets
      summary: Replication targets of a bucket
      description: The remote buckets the rules may replicate to, without their secret.
      x-nexo-actions: ["admin:GetBucketTarget"]
      responses:
        "200":
          description: The targets, by ARN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationTargets" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [buckets]
      operationId: setReplicationTarget
      summary: Create or replace a replication target
      description: >-
        Without arn a target is created (201) and gets an ARN
        (arn:nexo:replication::<id>:<remote bucket>); with arn it is replaced (200), the stored
        secret kept when secretKey is empty. The remote bucket is checked first: reachable with the
        credentials and versioning enabled (400 otherwise). The secret is sealed in the system
        documents and never returned. The credentials need s3:ReplicateObject, s3:ReplicateDelete,
        s3:ReplicateTags and the object actions on the remote bucket.
      x-nexo-actions: ["admin:SetBucketTarget"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplicationTarget" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationTarget" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationTarget" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [buckets]
      operationId: removeReplicationTarget
      summary: Remove a replication target
      description: A target the rules still use cannot be removed (400).
      x-nexo-actions: ["admin:SetBucketTarget"]
      parameters:
        - { name: arn, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/replication/status:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [buckets]
      operationId: getReplicationStatus
      summary: State of the replication of a bucket
      description: >-
        Per target, the tasks queued and the counters of the node that answers since its start
        (each node replicates the writes it served), and the last resync.
      x-nexo-actions: ["s3:GetReplicationConfiguration"]
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/replication/resync:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [buckets]
      operationId: startReplicationResync
      summary: Replicate again every version a target does not have
      description: >-
        The leader walks every version of the bucket the rules for the target select and queues
        those the destination does not have (asked first): existing objects, a replaced target, a
        queue lost with its drive. A resync in progress is replaced.
      x-nexo-actions: ["s3:ResetBucketReplicationState"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplicationResync" }
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplicationResync" }
        default: { $ref: "#/components/responses/Problem" }

  /buckets/{bucket}/objects:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [objects]
      operationId: listObjects
      summary: Folder view of a bucket
      description: |
        Objects and common prefixes ("folders") directly under `prefix`, without the
        folder placeholder object `prefix` itself. `delimiter` defaults to "/"; an empty
        delimiter lists recursively. The object browser authorizes s3:ListBucket with the
        conditions s3:prefix, s3:delimiter (the effective one) and s3:max-keys.
      x-nexo-actions: ["s3:ListBucket"]
      x-nexo-authorized-by: service
      parameters:
        - { name: prefix, in: query, schema: { type: string } }
        - { name: delimiter, in: query, allowEmptyValue: true, description: 'Default "/"; empty lists recursively.', schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: A page of the listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectList" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [objects]
      operationId: deleteObjects
      summary: Delete objects, versions and prefixes (recursive)
      description: |
        Synchronous; every object is authorized and reported (s3:DeleteObject, s3:DeleteObjectVersion with a version).
        Every prefix needs s3:ListBucket (s3:ListBucketVersions with `allVersions`) with the `s3:prefix` condition:
        otherwise the whole request is denied before deleting anything. Object Lock is honored: a version under
        retention or legal hold fails with `object_locked`; with `bypassGovernance` the versions under a GOVERNANCE
        retention are deleted where the caller has s3:BypassGovernanceRetention (on the version, with the condition
        values of the S3 x-amz-bypass-governance-retention header).
      x-nexo-actions: ["s3:DeleteObject", "s3:DeleteObjectVersion", "s3:ListBucket", "s3:ListBucketVersions", "s3:BypassGovernanceRetention"]
      x-nexo-authorized-by: service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteObjectsRequest" }
      responses:
        "200":
          description: The result of every object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteObjectsResult" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/stat:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: statObject
      summary: Metadata, tags and first versions of an object
      description: Tags and versions are included only when the caller may read them.
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectDetails" }
