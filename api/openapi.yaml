  /buckets/{bucket}/objects/retention:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: getObjectRetention
      summary: Object Lock retention of a version
      description: A version without retention answers no mode. A bucket without Object Lock answers 400.
      x-nexo-actions: ["s3:GetObjectRetention"]
      responses:
        "200":
          description: The retention.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectRetention" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [objects]
      operationId: setObjectRetention
      summary: Set or remove the retention of a version
      description: |
        A mode with a future retain-until date, or neither to remove the retention. A
        retention can always be extended; a GOVERNANCE one is shortened or removed only with
        `bypassGovernance` (s3:BypassGovernanceRetention, asked explicitly: 403 when denied),
        a COMPLIANCE one never, not even by root (403 `object_locked`). Authorized as the S3
        PutObjectRetention (s3:versionid, x-amz-bypass-governance-retention).
      x-nexo-actions: ["s3:PutObjectRetention", "s3:BypassGovernanceRetention"]
      x-nexo-authorized-by: service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetObjectRetentionRequest" }
      responses:
        "200":
          description: The retention of the version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectRetention" }
        default: { $ref: "#/components/responses/Problem" }
