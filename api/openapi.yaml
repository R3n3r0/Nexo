      operationId: simulatePolicy
      summary: Evaluate a request with the enforcement engine
      x-nexo-actions: ["admin:SimulatePolicy"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulateRequest" }
      responses:
        "200":
          description: The decision, the deciding statement and every statement considered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
        default: { $ref: "#/components/responses/Problem" }
  /policies/validate:
    post:
      tags: [policies]
      operationId: validatePolicy
      summary: Validate an IAM policy, or a bucket policy of `bucket`, without storing it
      x-nexo-actions: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidatePolicyRequest" }
      responses:
        "200":
          description: The validation report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }
        default: { $ref: "#/components/responses/Problem" }
  /policies/{policy}:
    parameters:
      - { name: policy, in: path, required: true, schema: { type: string } }
    get:
      tags: [policies]
      operationId: getPolicy
      x-nexo-actions: ["admin:GetPolicy"]
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [policies]
      operationId: savePolicy
      x-nexo-actions: ["admin:CreatePolicy"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePolicyRequest" }
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [policies]
      operationId: deletePolicy
      x-nexo-actions: ["admin:DeletePolicy"]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /policies/{policy}/entities:
    parameters:
      - { name: policy, in: path, required: true, schema: { type: string } }
    get:
      tags: [policies]
      operationId: policyEntities
      summary: Users and groups a policy is attached to
      x-nexo-actions: ["admin:GetPolicy"]
      responses:
        "200":
          description: The entities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEntities" }
        default: { $ref: "#/components/responses/Problem" }

  /notify/targets:
    get:
      tags: [notify]
      operationId: listNotifyTargets
      summary: Notification targets with their delivery state
      description: |
        The targets of the notify_* subsystems of the configuration (disabled ones included),
        with the state the answering node sees: online (no failed delivery since the last
        success) and the events pending in its persistent queue. The ARN is what the event
        subscriptions name.
      x-nexo-actions: ["admin:ConfigUpdate"]
      responses:
        "200":
          description: The targets, sorted by id and type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyTargetList" }
        default: { $ref: "#/components/responses/Problem" }
  /notify/targets/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        description: '"<id>:<type>" of the target ("_" is the id of the default target of a subsystem) or its ARN.'
        schema: { type: string }
    post:
      tags: [notify]
      operationId: testNotifyTarget
      summary: Send a test event to a target
      description: |
        Delivers an s3:TestEvent at once, outside of the queue of the target, and reports the
        outcome (a failed delivery is a 200 with `delivered: false`), which also updates the
        state of the target. A namespace target (Redis, PostgreSQL) gets no entry.
      x-nexo-actions: ["admin:ConfigUpdate"]
      responses:
        "200":
          description: The outcome of the delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyTargetTest" }
        default: { $ref: "#/components/responses/Problem" }
  /kms/status:
    get:
      tags: [kms]
      operationId: getKmsStatus
      summary: Status of the KMS of the server-side encryption
      description: >-
        The KMS that seals the keys of the SSE-S3 and SSE-KMS objects: the builtin KMS (master key
        NEXO_KMS_SECRET_KEY) or the external KES servers (NEXO_KMS_ENDPOINT). Without KMS configured
        is false and SSE-S3/SSE-KMS are refused (SSE-C still works).
      x-nexo-actions: ["admin:KMSKeyStatus"]
      responses:
        "200":
          description: The status of the KMS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KmsStatus" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /kms/keys:
    get:
      tags: [kms]
      operationId: listKmsKeys
      summary: Keys of the KMS
      x-nexo-actions: ["admin:KMSKeyStatus"]
      parameters:
        - name: prefix
          in: query
          required: false
          description: Only the keys whose name starts with the prefix.
          schema: { type: string }
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KmsKeyList" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [kms]
      operationId: createKmsKey
      summary: Create a KMS key (SSE-KMS)
      description: >-
        Creates a key usable as SSE-KMS key id (x-amz-server-side-encryption-aws-kms-key-id) and
        as default key of a bucket encryption; 409 when it exists, 501 without KMS.
      x-nexo-actions: ["admin:KMSCreateKey"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKmsKeyRequest" }
      responses:
        "201":
          description: The key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KmsKey" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /kms/reseal:
    post:
      tags: [kms]
      operationId: resealKmsKeys
      summary: Re-seal the data keys of the objects under the current master key
      description: >-
        After a rotation of the master key of the KMS (the previous key in
        NEXO_KMS_SECRET_KEY_PREVIOUS), re-seals the data key of every SSE-S3 and SSE-KMS version of
        the bucket (every bucket without one) under the current master key; the data is not
        rewritten. Once every bucket is re-sealed the previous master keys can be removed. The
        versions that cannot be re-sealed are counted. 501 without KMS.
      x-nexo-actions: ["admin:KMSCreateKey"]
      parameters:
        - name: bucket
          in: query
          required: false
          description: Only the objects of this bucket.
          schema: { type: string }
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KmsResealResult" }
        "404": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /config:
    get:
      tags: [config]
      operationId: listConfig
      summary: Every known subsystem with its settings (sensitive values masked)
      x-nexo-actions: ["admin:ConfigUpdate"]
      responses:
        "200":
          description: The subsystems.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigSubsystem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [config]
      operationId: mergeConfig
      summary: Merge the settings of several subsystems (validated first)
      x-nexo-actions: ["admin:ConfigUpdate"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocument" }
      responses:
        "204": { description: Merged. }
        default: { $ref: "#/components/responses/Problem" }
  /config/schema:
    get:
      tags: [config]
      operationId: configSchema
      summary: Known subsystems and keys
      x-nexo-actions: ["admin:ConfigUpdate"]
      responses:
        "200":
          description: The schema.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConfigSubsystemSchema" }
        default: { $ref: "#/components/responses/Problem" }
  /config/export:
    get:
      tags: [config]
      operationId: exportConfig
      summary: Export the whole configuration (secrets included)
      x-nexo-actions: ["admin:ConfigUpdate"]
      responses:
        "200":
          description: The configuration document (attachment).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigDocument" }
        default: { $ref: "#/components/responses/Problem" }
  /config/import:
    post:
      tags: [config]
      operationId: importConfig
      summary: Replace the whole configuration (validated first)
      x-nexo-actions: ["admin:ConfigUpdate"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocument" }
      responses:
        "204": { description: Imported. }
        default: { $ref: "#/components/responses/Problem" }
  /cluster/export:
    get:
      tags: [cluster]
      operationId: exportCluster
      summary: Export the state of the deployment besides its objects
      description: >-
        A versioned zip archive (manifest.json, iam.bin, policies.json, config.json,
        buckets/<name>.json) holding the IAM state (users, groups, access keys, STS credentials and
        their policy attachments, encrypted with a key derived from the root secret key), the named
        policies, the dynamic configuration (secrets included) and the settings of every bucket
        (versioning, object lock, policy, lifecycle, encryption, quota, tags, CORS, notifications).
        With `nexoctl mirror` for the objects it migrates a deployment to another mode.
      x-nexo-actions: ["admin:ExportCluster"]
      responses:
        "200":
          description: The archive (attachment).
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /cluster/import:
    post:
      tags: [cluster]
      operationId: importCluster
      summary: Import an archive of GET /cluster/export
      description: >-
        The whole archive is validated first (format, version, policies, configuration, bucket
        names); with `dryRun` the import stops there and reports what it would do. It then applies
        the configuration, the named policies, the IAM state (the target must share the root
        credentials of the source) and the bucket settings, creating the missing buckets. `merge`
        (default) keeps what the archive does not hold; `replace` also replaces the whole
        configuration and removes the users, groups and named policies the archive does not hold and
        the settings of the archived buckets it does not set (buckets are never removed).
      x-nexo-actions: ["admin:ImportCluster"]
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [merge, replace] }
        - name: dryRun
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What the import did (or would do).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterImportResult" }
        default: { $ref: "#/components/responses/Problem" }
  /locks:
    get:
      tags: [cluster]
      operationId: listLocks
      summary: List the namespace locks held across the lock servers
      x-nexo-actions: ["admin:TopLocksInfo"]
      responses:
        "200":
          description: The locks, sorted by resource.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lock" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cluster]
      operationId: forceUnlock
      summary: Release namespace locks on every lock server, whoever holds them
      description: >-
        Diagnostics of stuck locks (admin lock clear). An operation holding a released lock loses
        it at its next lease renewal and stops before its commit.
      x-nexo-actions: ["admin:ForceUnlock"]
      parameters:
        - name: resource
          in: query
          required: true
          description: A resource to release ("bucket/key"); repeatable.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        "204": { description: Released. }
        default: { $ref: "#/components/responses/Problem" }
  /pools:
    get:
      tags: [cluster]
      operationId: listPools
      summary: The server pools, their capacity and their decommission, and the rebalance
      description: 501 in single-drive mode.
      x-nexo-actions: ["admin:ServerInfo"]
      responses:
        "200":
          description: The pools.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pools" }
        default: { $ref: "#/components/responses/Problem" }
  /pools/plan:
    post:
      tags: [cluster]
      operationId: planPools
      summary: Plan a change of the pools (expansion, removal of decommissioned pools)
      description: >-
        Checks the pools appended after the existing ones and the pools removed once their decommission is complete
        the way every node parses its command line at startup (erasure sets, parity, nodes), and returns the new
        endpoint arguments of every node (NEXO_ENDPOINTS). Nothing changes: the nodes run the new topology once all
        of them are restarted with it. Every existing pool must be written as one argument with ellipses. 501 in
        single-drive mode.
      x-nexo-actions: ["admin:ServerInfo"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolPlanInput" }
      responses:
        "200":
          description: The planned topology.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /pools/{pool}/decommission:
    parameters:
      - name: pool
        in: path
        required: true
        description: 1-based position of the pool in the command line.
        schema: { type: integer, minimum: 1 }
    post:
      tags: [cluster]
      operationId: decommissionPool
      summary: Start the decommission of a pool
      description: >-
        The pool takes no new object, version or multipart upload; the leader moves every version
        of its objects to the other pools (copied, read back and compared before the source is
        removed), pass after pass until a pass finds nothing left and no upload is in progress
        there. The job resumes after a restart. The pool can then be removed from the command
        line. The first pool (system documents), the last pool left, or a pool during a rebalance
        are refused (400).
      x-nexo-actions: ["admin:Decommission"]
      responses:
        "202": { description: Started (see GET /pools). }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cluster]
      operationId: cancelDecommission
      summary: Cancel the decommission of a pool
      description: The pool takes new objects again; the objects already moved stay where they are.
      x-nexo-actions: ["admin:Decommission"]
      responses:
        "204": { description: Canceled. }
        default: { $ref: "#/components/responses/Problem" }
  /rebalance:
    post:
      tags: [cluster]
      operationId: startRebalance
      summary: Start the rebalance between the pools
      description: >-
        The pools fuller than the average by more than 5 points give objects to the emptier ones
        until they are near the average. Refused with a single pool or during a decommission.
      x-nexo-actions: ["admin:Rebalance"]
      responses:
        "202": { description: Started (see GET /pools). }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cluster]
      operationId: stopRebalance
      summary: Stop the rebalance
      x-nexo-actions: ["admin:Rebalance"]
      responses:
        "204": { description: Stopped. }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication:
    get:
      tags: [cluster]
      operationId: getSiteReplication
      summary: Site replication of this deployment
      description: >-
        The group of sites this deployment is in (S-STO-11) and, per other site, the last round of
        synchronization as the leader recorded it. Disabled when in no group.
      x-nexo-actions: ["admin:SiteReplicationInfo"]
      responses:
        "200":
          description: The site replication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteReplicationInfo" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [cluster]
      operationId: addSiteReplication
      summary: Group sites
      description: >-
        Groups the sites, this one among them: their users, groups, access keys, named policies and
        buckets are kept in sync, and every bucket replicates to the same bucket of every other site.
        Every site must accept the root credentials of this one at its Admin API and be in no group.
      x-nexo-actions: ["admin:SiteReplicationAdd"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteReplicationSites" }
      responses:
        "200":
          description: The group, saved on every site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteReplicationInfo" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cluster]
      operationId: removeSiteReplication
      summary: Dissolve the group
      description: >-
        Every site reached forgets the group and the replication rules it added; what was replicated
        stays. 409 when some sites were not reached (the group is removed here).
      x-nexo-actions: ["admin:SiteReplicationRemove"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication/sync:
    post:
      tags: [cluster]
      operationId: syncSiteReplication
      summary: Run a round of synchronization now
      x-nexo-actions: ["admin:SiteReplicationAdd"]
      responses:
        "202": { description: Asked. }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication/peer:
    get:
      tags: [cluster]
      operationId: siteReplicationPeerInfo
      summary: Describe this site to another one (internal)
      description: Calls between the sites of a group, reserved to the root credentials.
      x-nexo-actions: ["admin:SiteReplicationOperation"]
      responses:
        "200":
          description: This site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteReplicationPeer" }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication/peer/join:
    post:
      tags: [cluster]
      operationId: joinSiteReplication
      summary: Save the group of sites (internal)
      x-nexo-actions: ["admin:SiteReplicationOperation"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteReplicationSites" }
      responses:
        "204": { description: Joined. }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication/peer/leave:
    post:
      tags: [cluster]
      operationId: leaveSiteReplication
      summary: Forget the group (internal)
      x-nexo-actions: ["admin:SiteReplicationOperation"]
      responses:
        "204": { description: Left. }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication/peer/state:
    get:
      tags: [cluster]
      operationId: siteReplicationState
      summary: Hashes of the replicated entries of this site (internal)
      x-nexo-actions: ["admin:SiteReplicationOperation"]
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteReplicationState" }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication/peer/items:
    post:
      tags: [cluster]
      operationId: siteReplicationItems
      summary: Sealed values of entries (internal)
      x-nexo-actions: ["admin:SiteReplicationOperation"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys: { type: array, items: { type: string } }
      responses:
        "200":
          description: The sealed entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteReplicationSealed" }
        default: { $ref: "#/components/responses/Problem" }
  /site-replication/peer/apply:
    post:
      tags: [cluster]
      operationId: siteReplicationApply
      summary: Apply sealed changes (internal)
      x-nexo-actions: ["admin:SiteReplicationOperation"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteReplicationSealed" }
      responses:
        "200":
          description: The outcome of each change.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [key]
                      properties:
                        key: { type: string }
                        error: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /tiers:
    get:
      tags: [cluster]
      operationId: listTiers
      summary: List the remote tiers of the lifecycle transitions
      x-nexo-actions: ["admin:ListTier"]
      responses:
        "200":
          description: The tiers, without their secret.
          content:
            application/json:
              schema:
                type: object
                required: [tiers]
                properties:
                  tiers:
                    type: array
                    items: { $ref: "#/components/schemas/Tier" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [cluster]
      operationId: addTier
      summary: Add a remote tier (its bucket is checked with the credentials)
      x-nexo-actions: ["admin:SetTier"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TierInput" }
      responses:
        "201":
          description: The tier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tier" }
        default: { $ref: "#/components/responses/Problem" }
  /tiers/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [cluster]
      operationId: editTier
      summary: Replace the credentials (and the region, the storage class) of a tier
      x-nexo-actions: ["admin:SetTier"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TierInput" }
      responses:
        "200":
          description: The tier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tier" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cluster]
      operationId: removeTier
      summary: Remove a tier that holds no data of this deployment
      x-nexo-actions: ["admin:SetTier"]
      responses:
        "204": { description: Removed. }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /config/{subsys}:
    parameters:
      - name: subsys
        in: path
        required: true
        description: A subsystem of GET /config/schema (api, browser, logger, notify_webhook, region, scanner).
        schema: { type: string }
    get:
      tags: [config]
      operationId: getConfigSubsystem
      x-nexo-actions: ["admin:ConfigUpdate"]
      responses:
        "200":
          description: The subsystem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSubsystem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [config]
      operationId: setConfigSubsystem
      description: Merges the settings; a masked sensitive value keeps the stored secret.
      x-nexo-actions: ["admin:ConfigUpdate"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigSubsystemRequest" }
      responses:
        "200":
          description: The subsystem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigSubsystem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [config]
      operationId: deleteConfigSubsystem
      x-nexo-actions: ["admin:ConfigUpdate"]
      parameters:
        - name: keys
          in: query
          description: Comma separated keys to remove; absent removes the whole subsystem.
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /buckets/{bucket}/access-rules:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [access-rules]
      operationId: getAccessRules
      summary: Access rules of the bucket
      description: |
        The access rules of the bucket (docs/10 §10.1): prefix, glob and RE2 regex patterns
        of the keys, principals, actions, conditions and priorities, evaluated by the
        policy engine next to the bucket policy. The `ETag` header (and `etag`) identify
        the version of the rules for the `If-Match` of PUT. A bucket without rules
        answers an empty list.
      x-nexo-actions: ["admin:ManageAccessRules"]
      responses:
        "200":
          description: The rules.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRules" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [access-rules]
      operationId: setAccessRules
      summary: Replace the access rules of the bucket atomically
      description: |
        Validates every rule (pattern compiled at once, at most `--access-rules-max`
        rules per bucket, 200 by default) and replaces the rules of the bucket in one
        change, propagated to every node. With `If-Match` the change applies only to the
        version of the rules with that ETag (412 `precondition_failed` otherwise). An
        invalid rule answers 400 `invalid_access_rule` (too many: `too_many_access_rules`)
        with the rule, the field and the position of the problem in the pattern in
        `accessRuleErrors`; an allow rule for everyone while the block public access is
        on in the reject mode answers 403 `public_access_blocked`. Every change is audited.
      x-nexo-actions: ["admin:ManageAccessRules"]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutAccessRulesRequest" }
      responses:
        "200":
          description: The rules as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRules" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/access-rules/test:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [access-rules]
      operationId: testAccessRules
      summary: Test the access rules on keys (pattern tester, simulator)
      description: |
        Evaluates the requests of a principal on keys of the bucket with every source of
        the policy engine (IAM, bucket policy, access rules), without performing them: for
        each key the rules that match, the outcome of the rules alone, the final decision
        and the rule that determined it (docs/10 D-ACC-02, `nexoctl access test`). The
        keys are matched after their normalization (`normalizedKey`). Authorized by the
        service: admin:ManageAccessRules on the bucket and, to test the requests of
        another identity than the caller's, admin:SimulatePolicy.
      x-nexo-actions: ["admin:ManageAccessRules", "admin:SimulatePolicy"]
      x-nexo-authorized-by: service
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestAccessRulesRequest" }
      responses:
        "200":
          description: The outcome of every key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRulesTestResult" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/access-rules/public:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [access-rules]
      operationId: getAccessRulesPublic
      summary: Public status of the bucket through its access rules
      x-nexo-actions: ["admin:ManageAccessRules"]
      responses:
        "200":
          description: The public status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRulesPublicStatus" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [access-rules]
      operationId: setAccessRulesPreset
      summary: Apply a public access preset
      description: |
        Replaces the rules generated by the presets (ids starting with `preset-`) with those
        of the preset: `private` (also removes every allow rule for everyone),
        `public-read`, `public-read-list`, `public-prefix` (with `match`) and
        `public-write` (with `confirm`: 400 `confirmation_required` otherwise). The other
        rules are kept. `If-Match` as for PUT /buckets/{bucket}/access-rules.
      x-nexo-actions: ["admin:ManageAccessRules"]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessPresetRequest" }
      responses:
        "200":
          description: The rules as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRules" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/block-public:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    get:
      tags: [access-rules]
      operationId: getBucketBlockPublic
      summary: Block public access of the bucket
      x-nexo-actions: ["admin:ManageAccessRules"]
      responses:
        "200":
          description: The setting of the bucket and the one in effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockPublic" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [access-rules]
      operationId: setBucketBlockPublic
      summary: Turn the block public access of the bucket on or off
      description: The mode is a setting of the cluster (PUT /access/block-public); a mode here is 400.
      x-nexo-actions: ["admin:ManageAccessRules"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockPublicRequest" }
      responses:
        "200":
          description: The setting of the bucket and the one in effect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockPublic" }
        default: { $ref: "#/components/responses/Problem" }
  /access/block-public:
    get:
      tags: [access-rules]
      operationId: getBlockPublic
      summary: Block public access of the cluster
      x-nexo-actions: ["admin:ManageAccessRules"]
      responses:
        "200":
          description: The cluster setting and its mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockPublic" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [access-rules]
      operationId: setBlockPublic
      summary: Turn the block public access of the cluster on or off
      description: |
        While on, the principal `*` of the allow rules of every bucket is ignored and, in
        the `reject` mode, such a rule is refused when saved (the stored ones are
        ignored); in the `ignore` mode they are accepted and ignored. Deny rules for
        everyone are never affected. Stored in the dynamic configuration (subsystem
        `access`), it applies to every node without restart.
      x-nexo-actions: ["admin:ManageAccessRules"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockPublicRequest" }
      responses:
        "200":
          description: The cluster setting and its mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockPublic" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions:
    get:
      tags: [distributions]
      operationId: listDistributions
      summary: Distributions (custom domains of the buckets)
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "200":
          description: Every distribution, sorted by id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [distributions]
      operationId: createDistribution
      summary: Create a distribution
      description: |
        Validates and stores the distribution (docs/10 §10.2); the routing table of every
        node is updated without restart. An alias used by another distribution (or the S3
        and console domains) answers 409 `alias_conflict`, an invalid distribution 400
        `invalid_distribution`. admin:ManageDistributions is also evaluated on the origin
        bucket: an explicit Deny on a bucket keeps it from being exposed. Origin secrets
        given in clear are stored hashed.
      x-nexo-actions: ["admin:ManageDistributions"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Distribution" }
      responses:
        "201":
          description: The distribution as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    get:
      tags: [distributions]
      operationId: getDistribution
      summary: A distribution
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "200":
          description: The distribution.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [distributions]
      operationId: updateDistribution
      summary: Replace a distribution
      description: |
        Replaces the whole document (its id is the one of the path). With `If-Match` the
        change applies only to the version with that ETag (412 otherwise).
        admin:ManageDistributions is also evaluated on the current and the new origin
        buckets.
      x-nexo-actions: ["admin:ManageDistributions"]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Distribution" }
      responses:
        "200":
          description: The distribution as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [distributions]
      operationId: deleteDistribution
      summary: Remove a distribution
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/test:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    post:
      tags: [distributions]
      operationId: testDistribution
      summary: How the distribution serves a URL
      description: |
        Without reading the object: the route of the host, the behavior that matches the
        path (`-1` for the default one) with its inherited fields resolved (access,
        methods, cache), the object of the path, the redirection or the refusal, and the
        headers of the response (docs/10 D-DST-03, `nexoctl dist test`). A path is
        completed with https and the first exact alias; a URL whose host is not an alias
        of the distribution is 400.
      x-nexo-actions: ["admin:ManageDistributions"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionTestRequest" }
      responses:
        "200":
          description: How the URL is served.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionTestResult" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/origin-secret/rotate:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    post:
      tags: [distributions]
      operationId: rotateDistributionOriginSecret
      summary: Rotate the origin secret of the proxies
      description: |
        Generates a new origin secret, returned in clear once (stored hashed), and keeps
        the most recent previous ones active (`keep`, default 1) so that the proxies are
        updated without downtime; the requests without one of the active secrets in the
        header are refused.
      x-nexo-actions: ["admin:ManageDistributions"]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotateOriginSecretRequest" }
      responses:
        "200":
          description: The new secret and the distribution.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RotateOriginSecretResult" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/sign:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    post:
      tags: [distributions]
      operationId: signDistributionURL
      summary: Sign a URL, or cookies, of a signed behavior
      description: |
        CloudFront-style signed URL (`?Expires=&Signature=&Key-Pair-Id=`, or `?Policy=`
        for a custom policy with `resource`, `notBefore` or `ipRange`) or signed cookies
        (`cookies: true`) for the URL, which a signed behavior of the distribution must
        serve. The server never stores the private keys: the caller sends the private key
        of a key of the key group of the behavior (its key pair id is found from the key
        when not given). Exactly one of `expiresIn` and `expiresAt`.
      x-nexo-actions: ["admin:SignDistributionURL"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignDistributionRequest" }
      responses:
        "200":
          description: The signed URL or cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignDistributionResult" }
        default: { $ref: "#/components/responses/Problem" }
  /keygroups:
    get:
      tags: [distributions]
      operationId: listKeyGroups
      summary: Key groups of the signed behaviors
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "200":
          description: Every key group, sorted by id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyGroupList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [distributions]
      operationId: createKeyGroup
      summary: Create a key group
      description: |
        With `generateKey`, its first key pair is generated: the private key is in the
        answer once and never stored (docs/10: "downloadable only once").
      x-nexo-actions: ["admin:ManageDistributions"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyGroupRequest" }
      responses:
        "201":
          description: The key group and its generated key pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateKeyGroupResult" }
        default: { $ref: "#/components/responses/Problem" }
  /keygroups/{id}:
    parameters:
      - { $ref: "#/components/parameters/keyGroupId" }
    get:
      tags: [distributions]
      operationId: getKeyGroup
      summary: A key group
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "200":
          description: The key group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyGroup" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [distributions]
      operationId: deleteKeyGroup
      summary: Remove a key group no distribution references (409 otherwise)
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /keygroups/{id}/keys:
    parameters:
      - { $ref: "#/components/parameters/keyGroupId" }
    get:
      tags: [distributions]
      operationId: listKeyGroupKeys
      summary: Public keys of a key group
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "200":
          description: The keys, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicKeyList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [distributions]
      operationId: addKeyGroupKey
      summary: Add a key to a key group
      description: |
        A public key provided by the user (`publicKeyPem`, PKIX, Ed25519 or RSA of 2048 to
        4096 bits), or a key pair generated by the server whose private key is in the
        answer once. Several keys sign at once: a new key is added before the old one is
        removed (rotation without downtime).
      x-nexo-actions: ["admin:ManageDistributions"]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddKeyRequest" }
      responses:
        "201":
          description: The added key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddKeyResult" }
        default: { $ref: "#/components/responses/Problem" }
  /keygroups/{id}/keys/{key}:
    parameters:
      - { $ref: "#/components/parameters/keyGroupId" }
      - name: key
        in: path
        required: true
        description: Key pair id (Key-Pair-Id of the signed URLs).
        schema: { type: string }
    delete:
      tags: [distributions]
      operationId: deleteKeyGroupKey
      summary: Remove a key from its key group
      x-nexo-actions: ["admin:ManageDistributions"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /routing/resolve:
    get:
      tags: [distributions]
      operationId: resolveHost
      summary: What serves a host (routing diagnostics)
      description: |
        The resolution of the routing table of the answering node: an exact alias, then
        the most specific wildcard alias of a distribution, `<bucket>.<domain>`
        (virtual-host), the S3 and console domains (main), otherwise the path-style S3 API
        (or 421, misdirected, when the deployment asks for it).
      x-nexo-actions: ["admin:ManageDistributions"]
      parameters:
        - name: host
          in: query
          required: true
          description: The host, with or without port.
          schema: { type: string }
      responses:
        "200":
          description: The route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        default: { $ref: "#/components/responses/Problem" }
  /certificates:
    get:
      tags: [certificates]
      operationId: listCertificates
      summary: TLS certificates of the domains of the distributions
      description: |
        The uploaded and ACME certificates (never their keys) with their status (`expiring`
        within 21 days), the distributions using them, and the ACME certificates of the
        distributions with `tls.certificate: auto`, obtained or pending (the leader orders
        and renews them).
      x-nexo-actions: ["admin:ManageCertificates"]
      responses:
        "200":
          description: The certificates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [certificates]
      operationId: uploadCertificate
      summary: Upload a PEM certificate
      description: |
        The leaf certificate followed by its intermediates and its private key, validated
        (chain linkage, key matching the leaf, DNS names, validity: 400
        `invalid_certificate`), stored sealed and served by SNI on every node. A
        certificate of the same id is replaced. Distributions use it with
        `tls.certificate: upload:<id>`.
      x-nexo-actions: ["admin:ManageCertificates"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadCertificateRequest" }
      responses:
        "201":
          description: The certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        default: { $ref: "#/components/responses/Problem" }
  /certificates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [certificates]
      operationId: getCertificate
      summary: A certificate
      x-nexo-actions: ["admin:ManageCertificates"]
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [certificates]
      operationId: deleteCertificate
      summary: Remove a certificate no distribution names (409 otherwise)
      x-nexo-actions: ["admin:ManageCertificates"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /dns-providers:
    get:
      tags: [certificates]
      operationId: listDnsProviders
      summary: DNS providers of the ACME DNS-01 challenge
      description: |
        The DNS providers (Cloudflare, AWS Route 53, RFC 2136) that publish the TXT records
        of the DNS-01 challenge, required by the wildcard aliases. Their credentials are
        sealed in the system store and never returned (`hasCredentials` reports them).
      x-nexo-actions: ["admin:ManageCertificates"]
      responses:
        "200":
          description: The DNS providers, by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsProviderList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [certificates]
      operationId: createDnsProvider
      summary: Create a DNS provider
      description: |
        Validated (400 `invalid_dns_provider`; 409 `dns_provider_exists` for a name taken).
        Only the settings and credentials of its `type` are kept.
      x-nexo-actions: ["admin:ManageCertificates"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DnsProviderRequest" }
      responses:
        "201":
          description: The DNS provider (without its credentials).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsProvider" }
        default: { $ref: "#/components/responses/Problem" }
  /dns-providers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [certificates]
      operationId: getDnsProvider
      summary: A DNS provider (404 `dns_provider_not_found`)
      x-nexo-actions: ["admin:ManageCertificates"]
      responses:
        "200":
          description: The DNS provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsProvider" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [certificates]
      operationId: updateDnsProvider
      summary: Replace the settings of a DNS provider
      description: |
        The empty credentials keep the stored ones when the type does not change (a Route 53
        provider without `accessKeyId` drops them: ambient credentials). The leader retries
        at once the pending certificates of the distributions using the provider.
      x-nexo-actions: ["admin:ManageCertificates"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DnsProviderRequest" }
      responses:
        "200":
          description: The DNS provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsProvider" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [certificates]
      operationId: deleteDnsProvider
      summary: Remove a DNS provider no distribution names (409 `dns_provider_in_use` otherwise)
      x-nexo-actions: ["admin:ManageCertificates"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /dns-providers/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [certificates]
      operationId: testDnsProvider
      summary: Test a DNS provider
      description: |
        Publishes a TXT record `_acme-challenge.<domain>` with a random value, waits for it on
        the authoritative nameservers of the zone (up to the propagation timeout of the
        provider) and removes it. A failure of the provider is a result (`ok: false`, the
        failed `step`), not an error.
      x-nexo-actions: ["admin:ManageCertificates"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, description: "Domain of the test record (a wildcard counts as its domain)." }
      responses:
        "200":
          description: The outcome of the test.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsProviderTestResult" }
        default: { $ref: "#/components/responses/Problem" }

  /cache/policies:
    get:
      tags: [cache]
      operationId: listCachePolicies
      summary: Cache policies (built-in and defined)
      description: |
        The reusable cache policies (docs/11 §11.2), by name: the built-in ones
        (`disabled`, `standard`, `aggressive`, `immutable-assets`, `respect-origin`,
        read-only, `builtin: true`) and those defined by the administrators. Every
        policy is complete: its unset fields take the values of `standard`.
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "200":
          description: The policies, by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CachePolicyList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [cache]
      operationId: createCachePolicy
      summary: Define a cache policy
      description: |
        Validates (TTL `min` ≤ `default` ≤ `max`, durations, sizes, media types...) and
        stores the policy; every node applies it at once. A name already taken answers
        409 `already_exists`, a built-in name 409 `builtin_cache_policy`, an invalid
        policy 400 `invalid_cache_request`.
      x-nexo-actions: ["admin:ManageCache"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CachePolicy" }
      responses:
        "201":
          description: The policy as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CachePolicy" }
        default: { $ref: "#/components/responses/Problem" }
  /cache/policies/{name}:
    parameters:
      - { $ref: "#/components/parameters/cachePolicyName" }
    get:
      tags: [cache]
      operationId: getCachePolicy
      summary: A cache policy
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "200":
          description: The policy.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CachePolicy" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [cache]
      operationId: updateCachePolicy
      summary: Replace a defined cache policy
      description: |
        Replaces the whole policy (its name is the one of the path); with `If-Match`
        only the version with that ETag (412 otherwise). The entries cached under the
        policy are dropped. A built-in policy answers 409 `builtin_cache_policy`.
      x-nexo-actions: ["admin:ManageCache"]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CachePolicy" }
      responses:
        "200":
          description: The policy as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CachePolicy" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cache]
      operationId: deleteCachePolicy
      summary: Remove a defined cache policy
      description: A policy named by the settings of the cluster or of a distribution answers 409 `cache_policy_in_use`.
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /cache/preview:
    post:
      tags: [cache]
      operationId: previewCachePolicy
      summary: Validate a policy and preview its Cache-Control
      description: |
        Without storing it: the policy completed with the defaults, the `Cache-Control`
        it sends to the clients (`inherited` when it is the one of the objects) and a
        one-line summary (the editor of the console, D-CCH-03). An invalid policy
        answers 400 `invalid_cache_request` with the field at fault in `detail`.
      x-nexo-actions: ["admin:ManageCache"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CachePolicy" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CachePolicyPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /cache/settings:
    get:
      tags: [cache]
      operationId: getCacheSettings
      summary: Cache settings of the cluster
      description: The global level of the inheritance (docs/11 §11.1); the debug secret is masked.
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheGlobalSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [cache]
      operationId: updateCacheSettings
      summary: Replace the cache settings of the cluster
      description: |
        No quota (the size of the cache is `--cache-size`) nor webhooks at this level. A
        masked debug secret keeps the stored one.
      x-nexo-actions: ["admin:ManageCache"]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheGlobalSettings" }
      responses:
        "200":
          description: The settings as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheGlobalSettings" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /cache/inspect:
    get:
      tags: [cache]
      operationId: inspectCache
      summary: How the cache serves a URL
      description: |
        The cache key computed for the URL, the effective policy with the level each
        setting comes from (`fields`), why the cache would be bypassed, and the entry of
        the key on every node: tier, age, freshness, size, compressed variants
        (docs/11 §11.7, D-CCH-05). Nothing is read from the origin.
      x-nexo-actions: ["admin:ManageCache"]
      parameters:
        - name: url
          in: query
          required: true
          description: An absolute http(s) URL on a domain of a distribution, or a path of `distribution`.
          schema: { type: string }
        - name: distribution
          in: query
          description: The distribution the URL must be served by (a path is completed with https and its first exact alias).
          schema: { type: string }
        - name: header
          in: query
          description: 'A request header of the key ("Accept-Encoding: br"), repeatable.'
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: The inspection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInspection" }
        default: { $ref: "#/components/responses/Problem" }
  /cache/stats:
    get:
      tags: [cache]
      operationId: getCacheStats
      summary: Statistics of the cache
      description: |
        The answers by `X-Cache` value, the bytes served from the cache and from the
        origin, the hit ratio, the entries and the sizes per tier, of the cluster (summed)
        and of every node, per domain, with the most requested objects and those missed
        the most (docs/11 §11.8). `distribution` and `host` narrow them; a host alone
        selects the distribution serving it.
      x-nexo-actions: ["admin:ManageCache"]
      parameters:
        - name: distribution
          in: query
          schema: { type: string }
        - name: host
          in: query
          schema: { type: string }
        - name: top
          in: query
          description: Size of the lists of top objects (default 10, at most 100).
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheStats" }
        default: { $ref: "#/components/responses/Problem" }
  /cache/invalidations:
    get:
      tags: [cache]
      operationId: listGlobalCacheInvalidations
      summary: History of the global purges
      x-nexo-actions: ["admin:InvalidateCache"]
      responses:
        "200":
          description: The global purges, the newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInvalidationList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [cache]
      operationId: purgeAllCaches
      summary: Purge the cache of every distribution
      description: The global purge (`all` is required; `soft` marks the entries expired instead of dropping them).
      x-nexo-actions: ["admin:InvalidateCache"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheInvalidationRequest" }
      responses:
        "201":
          description: The invalidation with its state on every node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInvalidation" }
        default: { $ref: "#/components/responses/Problem" }
  /cache/invalidations/{inv}:
    parameters:
      - { $ref: "#/components/parameters/invalidationId" }
    get:
      tags: [cache]
      operationId: findCacheInvalidation
      summary: An invalidation, by its id alone
      description: A global purge or an invalidation of any distribution (`nexoctl cache purge status`).
      x-nexo-actions: ["admin:InvalidateCache"]
      responses:
        "200":
          description: The invalidation with its state on every node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInvalidation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/cache:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    get:
      tags: [cache]
      operationId: getDistributionCache
      summary: Cache settings of a distribution
      description: |
        The defaults of the distribution, the overrides of its domains (an alias, exact or
        wildcard, or a host a wildcard alias matches) and of its paths (behaviors, the
        first match wins), its purge webhooks (secrets masked) and the objects warmed on
        write (docs/11 §11.1). A distribution without settings answers an empty document
        without ETag.
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionCache" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [cache]
      operationId: updateDistributionCache
      summary: Replace the cache settings of a distribution
      description: |
        Replaces the whole document (`distribution` is the id of the path); with
        `If-Match` only the version with that ETag (412 otherwise). Every node applies the
        settings at once and drops the entries whose settings changed. The webhooks sent
        with masked secrets keep the stored ones.
      x-nexo-actions: ["admin:ManageCache"]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionCache" }
      responses:
        "200":
          description: The settings as stored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionCache" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/cache/effective:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    get:
      tags: [cache]
      operationId: getEffectiveCachePolicy
      summary: Effective cache policy of a path of a domain
      description: The policy that applies after the inheritance global → distribution → domain → behavior, with the level of each setting (TCC-01).
      x-nexo-actions: ["admin:ManageCache"]
      parameters:
        - name: host
          in: query
          description: A domain of the distribution (none for the level of the distribution).
          schema: { type: string }
        - name: path
          in: query
          description: A path of the distribution (default /).
          schema: { type: string }
      responses:
        "200":
          description: The effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheEffectivePolicy" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/cache/warm:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    post:
      tags: [cache]
      operationId: warmDistributionCache
      summary: Warm the cache of a domain
      description: |
        Caches objects before they are requested (docs/11 §11.6): paths, absolute URLs of
        the domain, every object below a prefix or matching a pattern, with bounded
        concurrency and bandwidth. In the local mode every node warms its own cache.
        Returns at once; `GET .../warm/{job}` follows the progress.
      x-nexo-actions: ["admin:InvalidateCache"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheWarmRequest" }
      responses:
        "202":
          description: The warm-up, started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheWarmJob" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/cache/warm/{job}:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
      - name: job
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [cache]
      operationId: getCacheWarmJob
      summary: Progress of a warm-up
      x-nexo-actions: ["admin:InvalidateCache"]
      responses:
        "200":
          description: The warm-up with its progress on every node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheWarmJob" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/cache/webhooks:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    get:
      tags: [cache]
      operationId: listCacheWebhooks
      summary: Purge webhooks of a distribution
      description: The CDNs and proxies in front of the cluster purged on the invalidations of the distribution, automatic and manual (secrets masked).
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "200":
          description: The webhooks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheWebhookList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [cache]
      operationId: addCacheWebhook
      summary: Add a purge webhook
      description: An id already used answers 409 `already_exists`.
      x-nexo-actions: ["admin:ManageCache"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheWebhook" }
      responses:
        "201":
          description: The webhook as stored (secrets masked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheWebhook" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/cache/webhooks/{webhook}:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
      - { $ref: "#/components/parameters/cacheWebhookId" }
    delete:
      tags: [cache]
      operationId: deleteCacheWebhook
      summary: Remove a purge webhook
      description: The domains bound to it are unbound.
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/cache/webhooks/{webhook}/test:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
      - { $ref: "#/components/parameters/cacheWebhookId" }
    post:
      tags: [cache]
      operationId: testCacheWebhook
      summary: Call a purge webhook once
      description: A test purge, outside of the queue (the connection test of D-CCH-07); a failed call is reported in the body, not as an error.
      x-nexo-actions: ["admin:ManageCache"]
      responses:
        "200":
          description: The outcome of the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheWebhookTestResult" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/invalidations:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
    get:
      tags: [cache]
      operationId: listCacheInvalidations
      summary: History of the invalidations of a distribution
      x-nexo-actions: ["admin:InvalidateCache"]
      responses:
        "200":
          description: The invalidations, the newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInvalidationList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [cache]
      operationId: invalidateDistributionCache
      summary: Invalidate cached content of a distribution
      description: |
        Exact paths (or absolute URLs of a domain, which set the domain), prefix, glob or
        regex patterns of paths, cache tags (surrogate keys), a whole domain (`domain`
        alone) or everything (`all`); `soft` marks the entries expired (served stale while
        revalidated) instead of dropping them (docs/11 §11.5). Applied on every node and
        sent to the purge webhooks of the domains; a node not reached is retried and the
        state stays `in-progress` until it applies it.
      x-nexo-actions: ["admin:InvalidateCache"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheInvalidationRequest" }
      responses:
        "201":
          description: The invalidation with its state on every node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInvalidation" }
        default: { $ref: "#/components/responses/Problem" }
  /distributions/{id}/invalidations/{inv}:
    parameters:
      - { $ref: "#/components/parameters/distributionId" }
      - { $ref: "#/components/parameters/invalidationId" }
    get:
      tags: [cache]
      operationId: getCacheInvalidation
      summary: An invalidation of a distribution
      x-nexo-actions: ["admin:InvalidateCache"]
      responses:
        "200":
          description: The invalidation with its state on every node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheInvalidation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /profile:
    post:
      tags: [diagnostics]
      operationId: collectProfile
      summary: Runtime profile of the node (pprof)
      description: |
        Collects a profile of the node that serves the request, in the pprof format
        (gzipped protocol buffer, `go tool pprof`): `cpu`, `mutex` and `block` sample
        for `seconds` (1-120, default 10), `heap` and `goroutine` are snapshots. One
        profile at a time per node (409 `conflict`). Allowed to root and to the
        identities with `admin:Profiling` (the `diagnostics` policy). A POST: with the
        console session it needs the CSRF token, like every request with side effects
        (sampling, sampling rates, the profile slot of the node).
      x-nexo-actions: ["admin:Profiling"]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [cpu, heap, goroutine, mutex, block], default: cpu }
        - name: seconds
          in: query
          schema: { type: integer, minimum: 1, maximum: 120 }
      responses:
        "200":
          description: The profile, as an attachment named nexo-<node>-<type>.pb.gz.
          headers:
            X-Nexo-Node: { schema: { type: string }, description: The node that collected the profile. }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /speedtest/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [drive, object, net] }
    post:
      tags: [diagnostics]
      operationId: runSpeedtest
      summary: Speed test of the drives, of the object layer or of the network
      description: |
        Runs on the node that serves the request and removes what it wrote: `drive`
        writes then reads files on every local drive; `object` uploads then downloads
        objects through the object layer in a temporary bucket (`nexo-speedtest-*`);
        `net` uploads files to a drive of every other node of a cluster over the
        internode RPC then reads one back (501 out of a cluster). Each phase lasts
        `durationSeconds` (at most 60) and writes at most 1 GiB per target; objects
        and files are at most 64 MiB, the concurrency at most 64. One test at a time
        per node (409 `conflict`).
      x-nexo-actions: ["admin:Speedtest"]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpeedtestRequest" }
      responses:
        "200":
          description: The measures of every target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeedtestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nexo_session
      description: Console session cookie issued by POST /auth/login.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token of the session (csrfToken), required on state-changing requests.
    sigv4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4 (service s3, region of the server).

  parameters:
    bucket:
      name: bucket
      in: path
      required: true
      schema: { type: string }
    key:
      name: key
      in: query
      required: true
      description: Object key.
      schema: { type: string }
    subtitleLang:
      name: lang
      in: query
      required: true
      description: BCP 47 language tag of the track (it, en, pt-BR...).
      schema: { type: string }
    versionId:
      name: versionId
      in: query
      description: |
        Version of the object; the policies see it as s3:versionid, as for the
        S3 request with the same versionId.
      schema: { type: string }
    tagging:
      name: x-amz-tagging
      in: header
      description: |
        Tags of the new object, URL-encoded (k1=v1&k2=v2) as the S3 header of the
        same name; authorized with s3:RequestObjectTag/<key>.
      schema: { type: string }
    sse:
      name: x-amz-server-side-encryption
      in: header
      description: |
        Server-side encryption of the new object, as the S3 header of the same name:
        AES256 (SSE-S3) or aws:kms (SSE-KMS). Without it the default encryption of the
        bucket applies. Authorized with s3:x-amz-server-side-encryption; without a KMS
        configured the upload is refused (501 not_implemented).
      schema:
        type: string
        enum: [AES256, "aws:kms"]
    sseKmsKeyId:
      name: x-amz-server-side-encryption-aws-kms-key-id
      in: header
      description: |
        The KMS key of an SSE-KMS upload (the default key of the KMS when absent);
        authorized with s3:x-amz-server-side-encryption-aws-kms-key-id.
      schema: { type: string }
    uploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      description: Opaque cursor of the next page (nextCursor of the previous one).
      schema: { type: string }
    limit:
      name: limit
      in: query
      description: Page size, 1 to 1000 (default 1000).
      schema: { type: integer, minimum: 1, maximum: 1000 }
    ifMatch:
      name: If-Match
      in: header
      description: |
        The ETag of the version the change applies to (quoted or not); a different
        current version answers 412 `precondition_failed`. Absent or `*`, the change
        applies unconditionally.
      schema: { type: string }
    distributionId:
      name: id
      in: path
      required: true
      description: Id of the distribution.
      schema: { type: string }
    keyGroupId:
      name: id
      in: path
      required: true
      description: Id of the key group.
      schema: { type: string }
    cachePolicyName:
      name: name
      in: path
      required: true
      description: Name of the cache policy.
      schema: { type: string }
    cacheWebhookId:
      name: webhook
      in: path
      required: true
      description: Id of the purge webhook.
      schema: { type: string }
    invalidationId:
      name: inv
      in: path
      required: true
      description: Id of the invalidation.
      schema: { type: string }

  headers:
    ETag:
      description: The version of the document, quoted.
      schema: { type: string }

  responses:
    Problem:
      description: An error, as an RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code (snake_case).
        requestId: { type: string }
        errors:
          type: array
          description: Located errors of a malformed policy (code malformed_policy).
          items: { $ref: "#/components/schemas/PolicyError" }
        ruleErrors:
          type: array
          description: Invalid rules of a bucket configuration (code invalid_configuration).
          items: { $ref: "#/components/schemas/RuleError" }
        accessRuleErrors:
          type: array
          description: The invalid access rule (codes invalid_access_rule, too_many_access_rules, public_access_blocked).
          items: { $ref: "#/components/schemas/AccessRuleError" }
    RuleError:
      type: object
      required: [rule, code, message]
      properties:
        rule:
          type: integer
          description: 1-based index of the rule (subscription), 0 for the whole configuration.
        id: { type: string }
        code:
          type: string
          description: S3 error code (InvalidArgument, InvalidRequest, MalformedXML, NotImplemented...).
        message: { type: string }
    PolicyError:
      type: object
      required: [statement, line, column, message]
      properties:
        statement:
          type: integer
          description: 1-based statement index, 0 for document-level errors.
        sid: { type: string }
        element: { type: string }
        line: { type: integer, description: "1-based, 0 when unknown." }
        column: { type: integer, description: "1-based, 0 when unknown." }
        message: { type: string }

    DeploymentMode:
      type: string
      enum: [snsd, snmd, distributed, unknown]
    ResourceState:
      type: string
      enum: [online, offline, healing, unknown]
    CredentialStatus:
      type: string
      enum: [enabled, disabled]
    VersioningState:
      type: string
      enum: ["off", enabled, suspended]
    AccessPreset:
      type: string
      enum: [private, download, upload, public, custom]
    SharePermission:
      type: string
      enum: [download, upload]

    LoginRequest:
      type: object
      description: An access key and its secret, or with `provider` `ldap` a username and password.
      properties:
        accessKey: { type: string }
        secretKey: { type: string }
        provider: { type: string, enum: [ldap] }
        username: { type: string }
        password: { type: string }
    AuthProviders:
      type: object
      required: [openid, ldap]
      properties:
        openid: { type: boolean, description: Login with OpenID Connect (GET /auth/openid/start). }
        openidName: { type: string, description: Label of the OpenID login button. }
        ldap: { type: boolean, description: Login with the LDAP username and password. }
    SessionIdentity:
      type: object
      required: [accessKey, isRoot, groups, policyNames]
      properties:
        accessKey: { type: string }
        isRoot: { type: boolean }
        provider:
          type: string
          description: Identity provider of a federated session (openid, ldap).
        username: { type: string, description: User at the identity provider. }
        groups:
          type: array
          description: Enabled groups of the user.
          items: { type: string }
        policyNames:
          type: array
          description: Effective policies, attached to the user and to its enabled groups.
          items: { type: string }
    Session:
      type: object
      required: [id, accessKey, identity, issuedAt, expiresAt, csrfToken]
      properties:
        id: { type: string }
        accessKey: { type: string }
        identity: { $ref: "#/components/schemas/SessionIdentity" }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        csrfToken:
          type: string
          description: Token the browser echoes in the X-CSRF-Token header on mutating requests.
    Permissions:
      type: object
      required: [user, isRoot, allowed, denied]
      properties:
        user: { type: string }
        isRoot: { type: boolean }
        bucket: { type: string }
        prefix: { type: string }
        allowed:
          type: array
          items: { type: string }
        denied:
          type: array
          items: { type: string }

    DiskInfo:
      type: object
      required: [endpoint, path, id, poolIdx, setIdx, diskIdx, state, total, free, used, healing]
      properties:
        endpoint: { type: string }
        path: { type: string }
        id: { type: string }
        poolIdx: { type: integer }
        setIdx: { type: integer }
        diskIdx: { type: integer }
        state: { $ref: "#/components/schemas/ResourceState" }
        total: { type: integer, format: int64 }
        free: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
        healing: { type: boolean }
        healingProgress: { $ref: "#/components/schemas/HealingProgress" }
        metadataLog: { $ref: "#/components/schemas/MetadataLog" }
        error: { type: string }
    MetadataLog:
      type: object
      description: |
        The metadata log of a drive in log mode (absent in classic mode). `bytes` is the size
        of the segments, `liveBytes` the part still holding current metadata (the rest is
        garbage the compaction reclaims). The counters run since the drive opened.
      required: [segments, bytes, liveBytes, objects, indexBytes, indexBudget, segmentSize, flushes, records, flushSeconds, compactions, compactedBytes, damagedAreas]
      properties:
        segments: { type: integer }
        bytes: { type: integer, format: int64 }
        liveBytes: { type: integer, format: int64 }
        objects: { type: integer, format: int64 }
        indexBytes: { type: integer, format: int64 }
        indexBudget: { type: integer, format: int64 }
        segmentSize: { type: integer, format: int64 }
        flushes: { type: integer, format: int64 }
        records: { type: integer, format: int64 }
        flushSeconds: { type: number }
        compactions: { type: integer, format: int64 }
        compactedBytes: { type: integer, format: int64 }
        damagedAreas: { type: integer, format: int64, description: Damaged areas skipped while replaying the log. }
    MetadataLogCompaction:
      type: object
      required: [drives]
      properties:
        drives:
          type: array
          items:
            type: object
            required: [endpoint, segments, reclaimedBytes]
            properties:
              endpoint: { type: string }
              segments: { type: integer, description: Segments rewritten. }
              reclaimedBytes: { type: integer, format: int64 }
              error: { type: string }
    ClusterImportResult:
      type: object
      required: [mode, dryRun, users, groups, policies, configSubsystems, buckets, bucketsCreated, removed]
      properties:
        mode: { type: string, enum: [merge, replace] }
        dryRun: { type: boolean }
        users: { type: integer, description: Users of the archive. }
        groups: { type: integer }
        policies: { type: integer, description: Named policies of the archive. }
        configSubsystems: { type: integer }
        buckets: { type: integer, description: Buckets of the archive. }
        bucketsCreated:
          type: array
          description: Archived buckets this deployment did not have (created by the import).
          items: { type: string }
        removed:
          type: array
          description: Entries a replace import removes ("user:<name>", "group:<name>", "policy:<name>").
          items: { type: string }
    ReplicationRule:
      type: object
      required: [id, priority, enabled, target, deleteMarkers, deletes, existing]
      properties:
        id: { type: string }
        priority: { type: integer, description: "Among the rules of the same target, the highest wins." }
        enabled: { type: boolean }
        prefix: { type: string, description: Key prefix the rule selects. }
        tags:
          type: object
          additionalProperties: { type: string }
          description: Tags the versions must have.
        target: { type: string, description: ARN of a replication target of the bucket. }
        deleteMarkers: { type: boolean, description: Replicate the delete markers. }
        deletes: { type: boolean, description: Replicate the permanent deletions of versions. }
        existing: { type: boolean, description: A resync replicates the versions written before the rule. }
    ReplicationConfiguration:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/ReplicationRule" }
    ReplicationTarget:
      type: object
      required: [endpoint, bucket, accessKey]
      properties:
        arn: { type: string, description: Empty to create a target. }
        endpoint: { type: string, description: "URL of the remote S3 API: http(s)://host[:port]." }
        bucket: { type: string, description: The remote bucket (versioning enabled). }
        region: { type: string }
        accessKey: { type: string }
        secretKey: { type: string, writeOnly: true, description: "Sent on creation (empty keeps the stored one on a replacement), never returned." }
        label: { type: string }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    ReplicationTargets:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items: { $ref: "#/components/schemas/ReplicationTarget" }
    ReplicationResync:
      type: object
      required: [target]
      properties:
        id: { type: string }
        target: { type: string, description: ARN of the target. }
        state: { type: string, enum: [running, complete, failed] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        scanned: { type: integer, format: int64, description: Versions walked. }
        queued: { type: integer, format: int64, description: Versions queued for the target. }
        error: { type: string }
    ReplicationTargetStatus:
      type: object
      required: [arn, online, queued, replicated, bytes, deletes, failed]
      properties:
        arn: { type: string }
        online: { type: boolean, description: The last attempt succeeded. }
        queued: { type: integer, description: Tasks queued on the node that answers. }
        replicated: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        deletes: { type: integer, format: int64 }
        failed: { type: integer, format: int64, description: Failed attempts (retried). }
        lastError: { type: string }
        lastFailed: { type: string, format: date-time }
        lastOk: { type: string, format: date-time }
    ReplicationStatus:
      type: object
      required: [targets, queued]
      properties:
        targets:
          type: array
          items: { $ref: "#/components/schemas/ReplicationTargetStatus" }
        queued: { type: integer }
        resync: { $ref: "#/components/schemas/ReplicationResync" }
    SiteReplicationSite:
      type: object
      required: [name, endpoint, adminEndpoint]
      properties:
        name: { type: string, description: "1-63 letters, digits, '.', '_' or '-'." }
        deploymentId: { type: string, description: Filled by the server. }
        endpoint: { type: string, description: "URL of the S3 API of the site." }
        adminEndpoint: { type: string, description: "URL of the Admin API (console listener) of the site." }
    TierInput:
      type: object
      required: [accessKey, secretKey]
      properties:
        name: { type: string, description: "Storage class the transitions name (A-Z, 0-9, '-', '_'); POST only." }
        endpoint: { type: string, description: "URL of the S3 API (http(s)://host[:port]); POST only." }
        bucket: { type: string, description: Remote bucket; POST only. }
        prefix: { type: string, description: "Prefix of the objects in the bucket, ending with '/'; POST only." }
        region: { type: string }
        storageClass: { type: string, description: Storage class of the remote objects (readable at once). }
        accessKey: { type: string }
        secretKey: { type: string, format: password }
    UpdateRequest:
      type: object
      required: [url, sha256]
      properties:
        url: { type: string, description: "http(s) URL of the server binary for the platform of the nodes" }
        sha256: { type: string, description: Hex SHA-256 of the binary }
        mode: { type: string, enum: [rolling, all] }
    UpdateJob:
      type: object
      required: [id, kind, mode, state, node, started, nodes]
      properties:
        id: { type: string }
        kind: { type: string, enum: [update, restart] }
        mode: { type: string, enum: [rolling, all] }
        state: { type: string, enum: [running, completed, failed] }
        url: { type: string }
        sha256: { type: string }
        version: { type: string, description: Version of the new binary }
        node: { type: string, description: The node orchestrating the job (it restarts last) }
        boot: { type: string }
        started: { type: string, format: date-time }
        finished: { type: string, format: date-time }
        error: { type: string }
        nodes:
          type: array
          items:
            type: object
            required: [node, phase]
            properties:
              node: { type: string }
              phase: { type: string, enum: [pending, staged, restarting, done, failed] }
              version: { type: string }
              boot: { type: string }
              error: { type: string }
    Tier:
      type: object
      required: [name, endpoint, bucket, accessKey, created, updated]
      properties:
        name: { type: string }
        endpoint: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        region: { type: string }
        storageClass: { type: string }
        accessKey: { type: string }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    SiteReplicationSites:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items: { $ref: "#/components/schemas/SiteReplicationSite" }
    SiteReplicationPeerStatus:
      type: object
      required: [name, deploymentId, pushed, pulled, pending]
      properties:
        name: { type: string }
        deploymentId: { type: string }
        lastSync: { type: string, format: date-time }
        lastError: { type: string }
        lastErrorAt: { type: string, format: date-time }
        pushed: { type: integer, format: int64, description: Entries sent to the site. }
        pulled: { type: integer, format: int64, description: Entries taken from the site. }
        pending: { type: integer, description: Changes not applied at the last round (retried). }
    SiteReplicationInfo:
      type: object
      required: [enabled, deploymentId, sites, peers, entries]
      properties:
        enabled: { type: boolean }
        name: { type: string, description: Name of this site in the group. }
        deploymentId: { type: string }
        sites:
          type: array
          items: { $ref: "#/components/schemas/SiteReplicationSite" }
        peers:
          type: array
          items: { $ref: "#/components/schemas/SiteReplicationPeerStatus" }
        entries: { type: integer, description: Replicated entries at the last round. }
    SiteReplicationPeer:
      type: object
      required: [deploymentId, enabled]
      properties:
        deploymentId: { type: string }
        enabled: { type: boolean }
        sites:
          type: array
          items: { $ref: "#/components/schemas/SiteReplicationSite" }
    SiteReplicationState:
      type: object
      required: [deploymentId, entries]
      properties:
        deploymentId: { type: string }
        entries:
          type: object
          additionalProperties:
            type: object
            required: [hash]
            properties:
              hash: { type: string }
              modTime: { type: string, format: date-time }
    SiteReplicationSealed:
      type: object
      required: [data]
      properties:
        data: { type: string, format: byte, description: Entries sealed with a key derived from the root credentials. }
    PoolJob:
      type: object
      required: [state, startedAt, pass, objects, versions, bytes, failed, pendingUploads]
      properties:
        state: { type: string, enum: [running, complete, canceled, failed] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        pass: { type: integer, description: Walks over the objects so far. }
        pool: { type: integer, description: Source pool of a rebalance (1-based). }
        bucket: { type: string, description: Where the job stands. }
        object: { type: string }
        objects: { type: integer, format: int64, description: Objects moved. }
        versions: { type: integer, format: int64 }
        bytes: { type: integer, format: int64, description: Stored bytes moved. }
        failed: { type: integer, format: int64, description: Objects not moved in this pass (retried). }
        pendingUploads: { type: integer, description: Multipart uploads the decommission waits for. }
        error: { type: string }
    PoolStatus:
      type: object
      required: [index, id, total, free, draining]
      properties:
        index: { type: integer, description: 1-based position in the command line. }
        id: { type: string, description: The command-line arguments of the pool. }
        total: { type: integer, format: int64 }
        free: { type: integer, format: int64 }
        draining: { type: boolean, description: The pool takes no new objects. }
        decommission: { $ref: "#/components/schemas/PoolJob" }
    Pools:
      type: object
      required: [pools]
      properties:
        pools:
          type: array
          items: { $ref: "#/components/schemas/PoolStatus" }
        rebalance: { $ref: "#/components/schemas/PoolJob" }
    PoolPlanInput:
      type: object
      properties:
        add:
          type: array
          description: Arguments of the new pools, one with ellipses per pool ("http://nexo{5...8}:9000/mnt/disk{1...4}").
          items: { type: string }
        remove:
          type: array
          description: Decommissioned pools to remove (1-based).
          items: { type: integer, minimum: 1 }
    PlannedPool:
      type: object
      required: [index, arg, nodes, drives, sets, drivesPerSet, parity]
      properties:
        index: { type: integer, description: 1-based position in the planned command line. }
        current: { type: integer, description: 1-based position today (absent for a new pool). }
        arg: { type: string }
        nodes:
          type: array
          description: Nodes of the pool ("host:port", "local" for the drives of a single node).
          items: { type: string }
        drives: { type: integer }
        sets: { type: integer }
        drivesPerSet: { type: integer }
        parity: { type: integer }
    PoolPlan:
      type: object
      required: [mode, args, pools, removed, nodes, newNodes]
      properties:
        mode: { type: string }
        args:
          type: array
          description: Endpoint arguments of every node, in order (NEXO_ENDPOINTS, or the arguments of nexo server).
          items: { type: string }
        pools:
          type: array
          items: { $ref: "#/components/schemas/PlannedPool" }
        removed:
          type: array
          items: { type: string }
        nodes:
          type: array
          items: { type: string }
        newNodes:
          type: array
          description: Nodes that are not part of the deployment today.
          items: { type: string }
    Lock:
      type: object
      required: [resource, uid, owner, type, quorum, since, refreshed, servers, total]
      properties:
        resource: { type: string, description: The locked resource ("bucket/key"). }
        uid: { type: string, description: The acquisition. }
        owner: { type: string, description: The node holding the lock. }
        source: { type: string }
        type: { type: string, enum: [write, read] }
        quorum: { type: integer }
        since: { type: string, format: date-time }
        refreshed: { type: string, format: date-time }
        servers: { type: integer, description: Lock servers holding the lock. }
        total: { type: integer, description: Lock servers queried. }
    HealingProgress:
      type: object
      description: Progress of the healing of a replaced or wiped drive (present while it heals).
      required: [started, lastUpdate, healedBuckets, objectsHealed, objectsFailed, bytesDone, bytesFailed]
      properties:
        started: { type: string, format: date-time }
        lastUpdate: { type: string, format: date-time }
        bucket: { type: string, description: Bucket of the last object healed. }
        object: { type: string, description: Last object healed. }
        healedBuckets: { type: integer, description: Buckets completely healed. }
        objectsHealed: { type: integer, format: int64 }
        objectsFailed: { type: integer, format: int64, description: Objects that failed to heal in the current pass. }
        bytesDone: { type: integer, format: int64 }
        bytesFailed: { type: integer, format: int64 }
        retryAttempts:
          type: integer
          description: Passes started over because objects failed to heal in the previous one (at most the configured retries).
    NodeInfo:
      type: object
      required: [endpoint, state, version, commit, uptimeSeconds, disks, local]
      properties:
        endpoint: { type: string }
        state: { $ref: "#/components/schemas/ResourceState" }
        version: { type: string }
        commit: { type: string }
        uptimeSeconds: { type: integer, format: int64 }
        disks:
          type: array
          items: { $ref: "#/components/schemas/DiskInfo" }
        local: { type: boolean, description: The node that answered (listed first). }
        clockSkew: { $ref: "#/components/schemas/ClockSkew" }
        healQueue: { $ref: "#/components/schemas/HealQueueStats" }
    ClockSkew:
      type: object
      description: >-
        Clock offset of a node measured by the node that answered (absent for that node and for
        the unreachable ones). An offset above 2 s is reported (docs/03 §3.11).
      required: [offsetMs, rttMs, exceeded]
      properties:
        offsetMs:
          type: integer
          format: int64
          description: Clock of the node minus the clock of the node that answered, corrected by half the round trip.
        rttMs: { type: integer, format: int64 }
        exceeded: { type: boolean, description: The offset is above the warning threshold. }
    HealQueueStats:
      type: object
      description: >-
        Background healing (MRF) of a node: the objects written or read without every drive,
        repaired in the background. Absent on a single drive and for the unreachable nodes.
      required: [pending, healed, retried, dropped]
      properties:
        pending: { type: integer, description: Objects waiting to be healed or being healed. }
        healed: { type: integer, format: int64 }
        retried: { type: integer, format: int64, description: "Failed attempts, rescheduled." }
        dropped:
          type: integer
          format: int64
          description: Objects refused (queue full) or abandoned (too many attempts).
    ErasureSetState:
      type: string
      description: >-
        ok: every drive online; degraded: drives offline or healing, the write quorum is kept;
        readonly: only the read quorum is kept; unavailable: below the read quorum.
      enum: [ok, degraded, readonly, unavailable]
    ErasureSetInfo:
      type: object
      required: [index, drives, online, offline, healing, state]
      properties:
        index: { type: integer }
        drives: { type: integer }
        online: { type: integer, description: Drives that answer (the healing ones included). }
        offline: { type: integer }
        healing: { type: integer }
        state: { $ref: "#/components/schemas/ErasureSetState" }
    PoolInfo:
      type: object
      required: [index, sets, drivesPerSet, parity, readQuorum, writeQuorum, erasureSets]
      properties:
        index: { type: integer }
        sets: { type: integer }
        drivesPerSet: { type: integer }
        parity: { type: integer }
        readQuorum: { type: integer, description: Drives of a set needed to read. }
        writeQuorum: { type: integer, description: Drives of a set needed to write. }
        erasureSets:
          type: array
          items: { $ref: "#/components/schemas/ErasureSetInfo" }
    ServerInfo:
      type: object
      required:
        [version, commit, buildDate, mode, region, deploymentId, startedAt, uptimeSeconds, buckets, objects, usage, pools, nodes]
      properties:
        version: { type: string }
        commit: { type: string }
        buildDate: { type: string }
        mode: { $ref: "#/components/schemas/DeploymentMode" }
        region: { type: string }
        deploymentId: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, format: int64 }
        buckets: { type: integer, format: int64 }
        objects: { type: integer, format: int64 }
        usage:
          type: integer
          format: int64
          description: Logical size in bytes of all stored versions.
        pools:
          type: array
          items: { $ref: "#/components/schemas/PoolInfo" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/NodeInfo" }
        kms: { $ref: "#/components/schemas/KmsInfo" }
        tls: { $ref: "#/components/schemas/TlsInfo" }
        telemetry: { $ref: "#/components/schemas/TelemetryInfo" }
    TlsInfo:
      type: object
      description: >-
        TLS of the listeners of the node that answers (docs/07 §7.3): the
        certificates of its certificates directory, reloaded without restart.
      required: [enabled, internodeVerify, certificates]
      properties:
        enabled: { type: boolean, description: "False when the listeners serve plain HTTP." }
        minVersion: { type: string, enum: ["1.2", "1.3"], description: "Oldest TLS version accepted." }
        internodeVerify: { type: boolean, description: "Mutual TLS between the nodes." }
        certificates:
          type: array
          description: The default certificate first, then those selected by SNI; never their keys.
          items: { $ref: "#/components/schemas/TlsCertificate" }
    TlsCertificate:
      type: object
      required: [name, subject, issuer, notBefore, notAfter, fingerprint]
      properties:
        name: { type: string, description: "Empty for the default certificate, the sub-directory of one selected by SNI." }
        domains: { type: array, items: { type: string } }
        ips: { type: array, items: { type: string } }
        subject: { type: string }
        issuer: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        fingerprint: { type: string, description: "SHA-256 of the leaf certificate." }
    TelemetryInfo:
      type: object
      description: Distributed tracing (OpenTelemetry) of the node that answers (docs/07 §7.4).
      required: [enabled, sampleRatio]
      properties:
        enabled: { type: boolean, description: "The spans are exported to an OTLP collector." }
        endpoint: { type: string, description: "URL of the collector, without user info nor query." }
        protocol: { type: string, enum: [http/protobuf, grpc] }
        sampleRatio: { type: number, minimum: 0, maximum: 1 }
    BucketUsage:
      type: object
      required: [size, objectsCount, versionsCount, deleteMarkers]
      properties:
        size: { type: integer, format: int64 }
        objectsCount: { type: integer, format: int64 }
        versionsCount:
          type: integer
          format: int64
          description: Noncurrent versions.
        deleteMarkers: { type: integer, format: int64 }
        prefixes:
          type: object
          description: >-
            Usage by top-level prefix ("photos/"; "" for the objects at the root), when computed
            by the scanner (at most 1000 prefixes per bucket).
          additionalProperties: { $ref: "#/components/schemas/PrefixUsage" }
    PrefixUsage:
      type: object
      required: [size, objectsCount, versionsCount, deleteMarkers]
      properties:
        size: { type: integer, format: int64 }
        objectsCount: { type: integer, format: int64 }
        versionsCount: { type: integer, format: int64 }
        deleteMarkers: { type: integer, format: int64 }
    DataUsage:
      type: object
      description: >-
        Usage computed by the background scanner (lastUpdate is the end of its last cycle);
        the buckets created since are computed on demand.
      required: [lastUpdate, objectsCount, versionsCount, totalSize, bucketsCount, buckets]
      properties:
        lastUpdate: { type: string, format: date-time }
        objectsCount: { type: integer, format: int64 }
        versionsCount: { type: integer, format: int64 }
        totalSize: { type: integer, format: int64 }
        bucketsCount: { type: integer, format: int64 }
        buckets:
          type: object
          additionalProperties: { $ref: "#/components/schemas/BucketUsage" }
    HealRequest:
      type: object
      properties:
        bucket: { type: string }
        prefix: { type: string }
        recursive: { type: boolean }
        dryRun: { type: boolean }
        deep: { type: boolean, description: Verify the bitrot hash of every shard block. }
        remove: { type: boolean, description: Delete the dangling objects found. }
    HealDriveState:
      type: string
      enum: [ok, missing, corrupt, offline]
    HealJobState:
      type: string
      enum: [running, done, failed, canceled]
    HealJob:
      type: object
      required: [id, state, request, finished, startedAt, updatedAt, scanned, healed, failed, dangling, removed, bytes, drives, items]
      properties:
        id: { type: string }
        state: { $ref: "#/components/schemas/HealJobState" }
        request: { $ref: "#/components/schemas/HealRequest" }
        finished: { type: boolean, description: The job is no longer running. }
        node: { type: string, description: Node running the job. }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        current: { type: string, description: Item being healed (bucket/object). }
        scanned: { type: integer, format: int64, description: "Items examined (format, buckets, objects)." }
        healed:
          type: integer
          format: int64
          description: Items repaired on at least one drive (or that would be, with dryRun).
        failed: { type: integer, format: int64 }
        dangling: { type: integer, format: int64 }
        removed: { type: integer, format: int64 }
        bytes: { type: integer, format: int64, description: Logical size of the objects examined. }
        drives:
          type: array
          items: { $ref: "#/components/schemas/HealJobDrive" }
        items:
          type: array
          description: Items that needed healing, were dangling or failed (at most 1000).
          items: { $ref: "#/components/schemas/HealItem" }
        itemsTruncated: { type: boolean }
        error: { type: string }
    HealJobDrive:
      type: object
      required: [endpoint, pool, set, disk, state, missing, corrupt, offline, healed]
      properties:
        endpoint: { type: string }
        pool: { type: integer }
        set: { type: integer }
        disk: { type: integer }
        state: { type: string, enum: [online, offline] }
        missing: { type: integer, format: int64, description: Items found missing on the drive. }
        corrupt: { type: integer, format: int64, description: Items found corrupt on the drive. }
        offline: { type: integer, format: int64, description: Items met while the drive was offline. }
        healed: { type: integer, format: int64, description: Copies rebuilt on the drive. }
    HealItem:
      type: object
      required: [kind, healed, drives]
      properties:
        kind: { type: string, enum: [format, bucket, object] }
        bucket: { type: string }
        object: { type: string }
        healed: { type: integer, description: Drive copies rebuilt. }
        dangling: { type: boolean }
        removed: { type: boolean }
        error: { type: string }
        drives:
          type: array
          items: { $ref: "#/components/schemas/HealItemDrive" }
    HealItemDrive:
      type: object
      required: [endpoint, pool, set, disk, before, after]
      properties:
        endpoint: { type: string }
        pool: { type: integer }
        set: { type: integer }
        disk: { type: integer }
        before: { $ref: "#/components/schemas/HealDriveState" }
        after: { $ref: "#/components/schemas/HealDriveState" }
    HealJobList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HealJob" }
        nextCursor: { type: string }
    ServiceAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [restart, stop]

    TraceEvent:
      type: object
      description: A request of the live trace (SSE event `trace`).
      required: [time, node, type, method, path, status, durationMs, inputBytes, outputBytes]
      properties:
        time: { type: string, format: date-time }
        node: { type: string }
        type: { type: string, enum: [s3, admin, web, rpc] }
        api: { type: string }
        method: { type: string }
        path: { type: string }
        query: { type: string, description: "The query string, signatures, credentials and tokens redacted." }
        status: { type: integer }
        durationMs: { type: number }
        inputBytes: { type: integer, format: int64 }
        outputBytes: { type: integer, format: int64 }
        requestId: { type: string }
        clientIp: { type: string }
        user: { type: string }
        bucket: { type: string }
        error: { type: string }
    LogEntry:
      type: object
      description: A log entry (SSE event `log`).
      required: [time, node, level, message]
      properties:
        time: { type: string, format: date-time }
        node: { type: string }
        level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
        message: { type: string }
        attrs:
          type: object
          additionalProperties: { type: string }
    StreamDropped:
      type: object
      description: The events a stream lost so far (SSE event `dropped`).
      required: [dropped]
      properties:
        dropped: { type: integer, format: int64 }
    AuditEntry:
      type: object
      required: [time, api, statusCode, durationMs, rx, tx]
      properties:
        time: { type: string, format: date-time }
        node: { type: string }
        type: { type: string, enum: [s3, admin] }
        requestId: { type: string }
        api: { type: string }
        method: { type: string }
        path: { type: string }
        bucket: { type: string }
        object: { type: string }
        statusCode: { type: integer }
        durationMs: { type: number }
        rx: { type: integer, format: int64, description: "Bytes received." }
        tx: { type: integer, format: int64, description: "Bytes sent." }
        remoteHost: { type: string }
        userAgent: { type: string }
        accessKey: { type: string }
        parentUser: { type: string }
        query:
          type: object
          description: The query parameters, the sensitive ones redacted.
          additionalProperties: { type: string }
        error: { type: string }
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
    MetricInfo:
      type: object
      required: [name, description, unit, aggregation]
      properties:
        name: { type: string }
        description: { type: string }
        unit: { type: string }
        aggregation:
          type: string
          description: How the nodes combine into the cluster series.
          enum: [sum, avg, max]
    MetricList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MetricInfo" }
    MetricPoint:
      type: object
      required: [t, v]
      properties:
        t: { type: integer, format: int64, description: "Unix time in seconds." }
        v: { type: number, nullable: true, description: "The value, null without sample." }
    MetricNodeSeries:
      type: object
      required: [node, points]
      properties:
        node: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }
        error: { type: string, description: "Why the points of the node could not be read." }
    MetricSeries:
      type: object
      required: [metric, start, end, stepSeconds, nodes, cluster]
      properties:
        metric: { $ref: "#/components/schemas/MetricInfo" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        stepSeconds: { type: integer, format: int64 }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/MetricNodeSeries" }
        cluster:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }

    Bucket:
      type: object
      required: [name, created, region, versioning, objectLockEnabled, objects, versions, deleteMarkers, size, quotaBytes, public, tags]
      properties:
        name: { type: string }
        created: { type: string, format: date-time }
        region: { type: string }
        versioning: { $ref: "#/components/schemas/VersioningState" }
        objectLockEnabled: { type: boolean }
        objects: { type: integer, format: int64 }
        versions: { type: integer, format: int64 }
        deleteMarkers: { type: integer, format: int64 }
        size: { type: integer, format: int64 }
        quotaBytes:
          type: integer
          format: int64
          description: Hard quota in bytes, 0 when unset.
        public:
          type: boolean
          description: The bucket policy grants access to everyone.
        tags:
          type: object
          additionalProperties: { type: string }
        partial:
          type: boolean
          description: >-
            The caller may list only a part of the bucket (a home directory): the
            summary is restricted to the name, creation date and region, every
            other member is zero or empty.
    BucketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Bucket" }
        nextCursor: { type: string }
    CreateBucketRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        region: { type: string }
        versioning:
          type: boolean
          description: Enable versioning (implied by objectLock).
        objectLock: { type: boolean }
        quotaBytes:
          type: integer
          format: int64
          description: Hard quota in bytes (0 none).
        hls:
          type: boolean
          description: >-
            Set the media rule "hls": the media worker derives every rendition (up to the height of each
            video), a poster and timeline thumbnails from every video of the bucket. Needs the
            admin:SetBucketMedia permission and a notify_media_worker target.
        images:
          type: boolean
          description: >-
            Set the media rule "images": the media worker derives every format (AVIF, WebP, JPEG, PNG)
            at every default width (up to the width of each image) from every image of the bucket. With
            hls, the bucket gets both rules. Needs the admin:SetBucketMedia permission and a
            notify_media_worker target.
    BucketVersioning:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/VersioningState" }
    BucketQuota:
      type: object
      required: [type, size]
      properties:
        type:
          type: string
          description: Enforcement type ("hard"); empty when no quota is set.
        size:
          type: integer
          format: int64
          description: Limit in bytes; 0 disables the quota.
    Tags:
      type: object
      required: [tags]
      properties:
        tags:
          type: object
          additionalProperties: { type: string }
    BucketObjectLock:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        mode:
          type: string
          enum: [GOVERNANCE, COMPLIANCE]
        days: { type: integer }
        years: { type: integer }
    BucketEncryption:
      type: object
      required: [algorithm]
      properties:
        algorithm:
          type: string
          description: '"AES256" (SSE-S3) or "aws:kms" (SSE-KMS).'
        kmsKeyId: { type: string }
    AccessRule:
      type: object
      required: [prefix, preset]
      properties:
        prefix:
          type: string
          description: The prefix, "" for the whole bucket.
        preset: { $ref: "#/components/schemas/AccessPreset" }
    BucketAccess:
      type: object
      required: [bucket, rules, public, hasPolicy]
      properties:
        bucket: { type: string }
        rules:
          type: array
          items: { $ref: "#/components/schemas/AccessRule" }
        public: { type: boolean }
        hasPolicy: { type: boolean }
    SetAccessRequest:
      type: object
      required: [preset]
      properties:
        prefix: { type: string }
        preset:
          type: string
          enum: [private, download, upload, public]

    ObjectEntry:
      type: object
      required: [key, size, etag, lastModified, isDeleteMarker, isLatest]
      properties:
        key: { type: string }
        versionId: { type: string }
        size: { type: integer, format: int64 }
        etag: { type: string }
        lastModified: { type: string, format: date-time }
        contentType: { type: string }
        isDeleteMarker: { type: boolean }
        isLatest: { type: boolean }
        storageClass: { type: string }
    ObjectList:
      type: object
      required: [objects, prefixes, isTruncated]
      properties:
        objects:
          type: array
          items: { $ref: "#/components/schemas/ObjectEntry" }
        prefixes:
          type: array
          items: { type: string }
        isTruncated: { type: boolean }
        nextCursor:
          type: string
          description: Resumes a truncated listing through the cursor query parameter.
    ObjectDetails:
      allOf:
        - $ref: "#/components/schemas/ObjectEntry"
        - type: object
          required: [userMetadata]
          properties:
            contentEncoding: { type: string }
            contentDisposition: { type: string }
            contentLanguage: { type: string }
            cacheControl: { type: string }
            expires: { type: string, format: date-time }
            userMetadata:
              type: object
              additionalProperties: { type: string }
            parts: { type: integer }
            checksumAlgorithm: { type: string }
            checksum: { type: string }
            encryption: { $ref: "#/components/schemas/ObjectEncryption" }
            tags:
              type: object
              description: Absent when the caller may not read the tags.
              additionalProperties: { type: string }
            versions:
              type: array
              description: First versions of the key; absent when the caller may not list them.
              items: { $ref: "#/components/schemas/ObjectEntry" }
            versionsTruncated: { type: boolean }
    ObjectEncryption:
      type: object
      description: Server-side encryption of a version; absent from an unencrypted one.
      required: [type]
      properties:
        type:
          type: string
          enum: [SSE-S3, SSE-KMS, SSE-C]
        kmsKeyId: { type: string, description: The KMS key of SSE-S3 and SSE-KMS. }
    VersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ObjectEntry" }
        nextCursor: { type: string }
    FolderRequest:
      type: object
      required: [prefix]
      properties:
        prefix:
          type: string
          description: The folder key; a trailing "/" is added when missing.
    ObjectRef:
      type: object
      required: [key]
      properties:
        key: { type: string }
        versionId: { type: string }
    DeleteObjectsRequest:
      type: object
      properties:
        objects:
          type: array
          items: { $ref: "#/components/schemas/ObjectRef" }
        prefixes:
          type: array
          description: >-
            Folders deleted recursively ("" is the whole bucket). A prefix without a trailing slash
            names the folder of that name, as in the CLI: "photos" is "photos/", never "photos2/" nor
            "photosx.txt".
          items: { type: string }
        allVersions:
          type: boolean
          description: Delete every version under the prefixes permanently.
        bypassGovernance:
          type: boolean
          description: |
            Delete the versions a GOVERNANCE retention protects, where the caller has
            s3:BypassGovernanceRetention.
    DeletedObject:
      type: object
      required: [key, deleteMarker]
      properties:
        key: { type: string }
        versionId: { type: string }
        deleteMarker: { type: boolean }
        deleteMarkerVersionId: { type: string }
    ObjectError:
      type: object
      required: [key, code, message]
      properties:
        key: { type: string }
        versionId: { type: string }
        code: { type: string }
        message: { type: string }
    DeleteObjectsResult:
      type: object
      required: [deleted, errors]
      properties:
        deleted:
          type: array
          items: { $ref: "#/components/schemas/DeletedObject" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ObjectError" }
    RenameRequest:
      type: object
      required: [source, destination]
      properties:
        source: { type: string }
        destination: { type: string }
        prefix:
          type: boolean
          description: >-
            Move every object of the folder source to the folder destination (which may not lie under
            it). Both name folders: a missing trailing slash is added ("photos" is "photos/", never
            "photos2/").
        overwrite:
          type: boolean
          description: Replace existing destination objects (otherwise conflict).
    RenamedObject:
      type: object
      required: [source, destination]
      properties:
        source: { type: string }
        destination: { type: string }
    RenameError:
      type: object
      required: [source, destination, code, message]
      properties:
        source: { type: string }
        destination: { type: string }
        code: { type: string }
        message: { type: string }
    RenameResult:
      type: object
      required: [renamed, errors]
      properties:
        renamed:
          type: array
          items: { $ref: "#/components/schemas/RenamedObject" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/RenameError" }
    ZipRequest:
      type: object
      properties:
        keys:
          type: array
          items: { type: string }
        prefixes:
          type: array
          description: >-
            Folders archived recursively. A prefix without a trailing slash names the folder of that
            name ("photos" is "photos/", never "photos2/").
          items: { type: string }
        base:
          type: string
          description: Folder the archive names are relative to ("photos" is "photos/").

    CreateUploadRequest:
      type: object
      properties:
        contentType: { type: string }
        userMetadata:
          type: object
          additionalProperties: { type: string }
    Upload:
      type: object
      required: [bucket, key, uploadId, initiated, partSize, minPartSize, maxPartSize, maxParts]
      properties:
        bucket: { type: string }
        key: { type: string }
        uploadId: { type: string }
        initiated: { type: string, format: date-time }
        partSize:
          type: integer
          format: int64
          description: Recommended part size.
        minPartSize:
          type: integer
          format: int64
          description: Minimum size of every part but the last.
        maxPartSize: { type: integer, format: int64 }
        maxParts: { type: integer }
    PendingUpload:
      type: object
      required: [key, uploadId, initiated]
      properties:
        key: { type: string }
        uploadId: { type: string }
        initiated: { type: string, format: date-time }
    UploadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PendingUpload" }
        nextCursor: { type: string }
    Part:
      type: object
      required: [partNumber, etag, size]
      properties:
        partNumber: { type: integer }
        etag: { type: string }
        size: { type: integer, format: int64 }
        lastModified: { type: string, format: date-time }
    PartList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Part" }
        nextCursor: { type: string }
    CompleteUploadRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            type: object
            required: [partNumber, etag]
            properties:
              partNumber: { type: integer }
              etag: { type: string }

    Share:
      type: object
      required: [id, owner, bucket, key, prefix, permission, expiresAt, createdAt, accessKey]
      properties:
        id: { type: string }
        owner: { type: string }
        bucket: { type: string }
        key:
          type: string
          description: The object key, or the prefix of a prefix share.
        prefix: { type: boolean }
        permission: { $ref: "#/components/schemas/SharePermission" }
        versionId: { type: string }
        contentType: { type: string }
        contentDisposition: { type: string }
        stream:
          type: boolean
          description: An HLS stream share of a video; the URL is its master playlist.
        image:
          type: boolean
          description: An image share; the URL is the image route of the object on the S3 listener.
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        url:
          type: string
          description: |
            GET/PUT URL of the object (the HLS master playlist of a stream share); for a prefix download share the
            ListObjectsV2 URL of the prefix (an XML listing: the objects are
            handed out by GET /shares/{id}/links); absent for prefix upload shares.
        accessKey:
          type: string
          description: Service account signing the link (share-<id>).
    ShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Share" }
        nextCursor: { type: string }
    ShareLink:
      type: object
      required: [key, size, url]
      properties:
        key: { type: string }
        size: { type: integer, format: int64 }
        url:
          type: string
          description: Download URL signed by the share, revoked with it.
    ShareLinkList:
      type: object
      required: [share, items]
      properties:
        share: { $ref: "#/components/schemas/Share" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ShareLink" }
        nextCursor: { type: string }
    CreateShareRequest:
      type: object
      required: [key]
      properties:
        bucket:
          type: string
          description: Required by POST /shares; taken from the path by POST /buckets/{bucket}/objects/share.
        key: { type: string }
        prefix: { type: boolean }
        permission: { $ref: "#/components/schemas/SharePermission" }
        expiresIn:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          description: Validity in seconds (default and maximum 7 days).
        contentType: { type: string }
        contentDisposition: { type: string }
        versionId: { type: string }
        stream:
          type: boolean
          description: |
            Share a video (MP4, H.264 or H.265 with AAC) as an HLS stream: the URL of the share
            is the master playlist on the S3 listener (/nexo/media/v1/{bucket}/master.m3u8), whose
            playlists are signed by the share until it expires. Object download shares only, without
            contentType and contentDisposition.
        image:
          type: boolean
          description: |
            Share an image through the variants the media worker derived from it (an image rule): the
            URL of the share is the image route on the S3 listener (/nexo/media/v1/{bucket}/image/{key}),
            which serves the image at its own size in the most compact format the client accepts
            (Accept header). Object download shares only, without stream, contentType and
            contentDisposition.
    RevokeAllResult:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer }
    PresignRequest:
      type: object
      required: [bucket, key]
      properties:
        method:
          type: string
          enum: [GET, PUT, HEAD, DELETE]
        bucket: { type: string }
        key: { type: string }
        versionId: { type: string }
        expiresIn:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          description: Validity in seconds (default and maximum 7 days), capped at the expiration of the credentials.
        contentType:
          type: string
          description: Signed Content-Type of PUT URLs, response-content-type of GET URLs.
        contentDisposition:
          type: string
          description: response-content-disposition of GET URLs.
        headers:
          type: object
          description: Additional signed headers (x-amz-meta-*...).
          additionalProperties: { type: string }
    PresignedURL:
      type: object
      required: [url, method, expiresAt, headers]
      properties:
        url: { type: string }
        method: { type: string }
        expiresAt: { type: string, format: date-time }
        headers:
          type: object
          description: Signed headers the client must send unchanged.
          additionalProperties: { type: string }
    PostPolicyRequest:
      type: object
      required: [bucket]
      properties:
        bucket: { type: string }
        key:
          type: string
          description: Exact key ("${filename}" is replaced by the file name).
        keyPrefix:
          type: string
          description: Any key under this prefix.
        expiresIn:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          description: Validity in seconds (default 1 hour).
        minSize: { type: integer, format: int64 }
        maxSize:
          type: integer
          format: int64
          description: content-length-range upper bound when positive.
        contentType: { type: string }
        contentTypePrefix: { type: string }
        successActionStatus:
          type: integer
          enum: [200, 201, 204]
        successActionRedirect: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
    PostCondition:
      type: object
      required: [operator]
      properties:
        operator:
          type: string
          enum: [eq, starts-with, content-length-range]
        key: { type: string }
        value: { type: string }
        min: { type: integer, format: int64 }
        max: { type: integer, format: int64 }
    PostPolicy:
      type: object
      required: [url, fields, expiresAt, conditions]
      properties:
        url:
          type: string
          description: Where the multipart/form-data is posted (the bucket URL).
        fields:
          type: object
          description: Form fields to send before the "file" field.
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/PostCondition" }

    User:
      type: object
      required: [accessKey, status, policyNames, groups, createdAt, updatedAt]
      properties:
        accessKey: { type: string }
        status: { $ref: "#/components/schemas/CredentialStatus" }
        policyNames:
          type: array
          items: { type: string }
        groups:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        nextCursor: { type: string }
    CreateUserRequest:
      type: object
      required: [accessKey, secretKey]
      properties:
        accessKey: { type: string }
        secretKey: { type: string }
        policyNames:
          type: array
          items: { type: string }
        groups:
          type: array
          description: Existing groups the user joins.
          items: { type: string }
        status: { $ref: "#/components/schemas/CredentialStatus" }
    UpdateUserRequest:
      type: object
      properties:
        secretKey: { type: string }
        status: { $ref: "#/components/schemas/CredentialStatus" }
        policyNames:
          type: array
          items: { type: string }
        groups:
          type: array
          description: Replaces the group memberships.
          items: { type: string }

    Group:
      type: object
      required: [name, status, members, policyNames, createdAt, updatedAt]
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/CredentialStatus" }
        members:
          type: array
          items: { type: string }
        policyNames:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        nextCursor: { type: string }
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        members:
          type: array
          items: { type: string }
        policyNames:
          type: array
          items: { type: string }
    UpdateGroupRequest:
      type: object
      properties:
        status: { $ref: "#/components/schemas/CredentialStatus" }
        policyNames:
          type: array
          items: { type: string }
        addMembers:
          type: array
          items: { type: string }
        removeMembers:
          type: array
          items: { type: string }

    AccessKey:
      type: object
      required: [accessKey, parentUser, name, description, status, createdAt, updatedAt]
      properties:
        accessKey: { type: string }
        parentUser: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/CredentialStatus" }
        expiration:
          type: string
          format: date-time
          description: Absent for non-expiring keys.
        policy: { $ref: "#/components/schemas/PolicyDocument" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccessKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AccessKey" }
        nextCursor: { type: string }
    CreatedAccessKey:
      description: The access key just created; the only time the secret is visible.
      allOf:
        - $ref: "#/components/schemas/AccessKey"
        - type: object
          required: [secretKey]
          properties:
            secretKey: { type: string }
    CreateAccessKeyRequest:
      type: object
      properties:
        parentUser:
          type: string
          description: Owner of the key; defaults to the caller. Naming another user requires admin:CreateServiceAccount.
        accessKey: { type: string, description: Generated when empty. }
        secretKey: { type: string, description: Generated when empty. }
        name: { type: string }
        description: { type: string }
        expiration: { type: string, format: date-time }
        policy: { $ref: "#/components/schemas/PolicyDocument" }
    UpdateAccessKeyRequest:
      type: object
      properties:
        secretKey: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/CredentialStatus" }
        expiration: { type: string, format: date-time }
        clearExpiration:
          type: boolean
          description: Remove the expiration.
        policy: { $ref: "#/components/schemas/PolicyDocument" }
        clearPolicy:
          type: boolean
          description: Remove the inline policy.

    StringOrStrings:
      description: AWS policy element that may be a single string or an array.
      oneOf:
        - type: string
        - type: array
          items: { type: string }
    PolicyPrincipal:
      description: '"*" or an object naming the principals.'
      oneOf:
        - type: string
        - type: object
          properties:
            AWS: { $ref: "#/components/schemas/StringOrStrings" }
            Service: { $ref: "#/components/schemas/StringOrStrings" }
            Federated: { $ref: "#/components/schemas/StringOrStrings" }
    PolicyStatement:
      type: object
      required: [Effect]
      properties:
        Sid: { type: string }
        Effect:
          type: string
          enum: [Allow, Deny]
        Principal: { $ref: "#/components/schemas/PolicyPrincipal" }
        NotPrincipal: { $ref: "#/components/schemas/PolicyPrincipal" }
        Action: { $ref: "#/components/schemas/StringOrStrings" }
        NotAction: { $ref: "#/components/schemas/StringOrStrings" }
        Resource: { $ref: "#/components/schemas/StringOrStrings" }
        NotResource: { $ref: "#/components/schemas/StringOrStrings" }
        Condition:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { $ref: "#/components/schemas/StringOrStrings" }
    PolicyDocument:
      type: object
      description: An IAM or bucket policy in the AWS JSON format.
      required: [Version, Statement]
      properties:
        Id: { type: string }
        Version: { type: string }
        Statement:
          type: array
          items: { $ref: "#/components/schemas/PolicyStatement" }
    PolicyDocumentOrText:
      description: A policy document, or its JSON text (errors are then located in that text).
      oneOf:
        - $ref: "#/components/schemas/PolicyDocument"
        - type: string
    Policy:
      type: object
      required: [name, document, builtIn, updatedAt]
      properties:
        name: { type: string }
        document: { $ref: "#/components/schemas/PolicyDocument" }
        builtIn:
          type: boolean
          description: Shipped with Nexo; read-only.
        updatedAt: { type: string, format: date-time }
    PolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
        nextCursor: { type: string }
    CreatePolicyRequest:
      type: object
      required: [name, document]
      properties:
        name: { type: string }
        document: { $ref: "#/components/schemas/PolicyDocumentOrText" }
    SavePolicyRequest:
      type: object
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/PolicyDocumentOrText" }
    AttachRequest:
      type: object
      description: Exactly one of user and group is set.
      required: [policyNames]
      properties:
        policyNames:
          type: array
          items: { type: string }
        user: { type: string }
        group: { type: string }
    PolicyEntities:
      type: object
      required: [policy, users, groups]
      properties:
        policy: { type: string }
        users:
          type: array
          items: { type: string }
        groups:
          type: array
          items: { type: string }
    ValidatePolicyRequest:
      type: object
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/PolicyDocumentOrText" }
        bucket:
          type: string
          description: Validate a bucket policy of this bucket.
    ValidationReport:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/PolicyError" }
    SimulateRequest:
      type: object
      required: [action]
      properties:
        user:
          type: string
          description: Access key to simulate (user or service account); the caller by default.
        action: { type: string }
        bucket: { type: string }
        object: { type: string }
        sourceIp: { type: string }
        secureTransport: { type: boolean }
        time: { type: string, format: date-time }
        conditions:
          type: object
          description: Other condition values (aws:Referer, s3:prefix...).
          additionalProperties:
            type: array
            items: { type: string }
    EvaluatedStatement:
      type: object
      required: [source, index, effect, matched]
      properties:
        source:
          type: string
          enum: [root, iam, group, inline, bucket]
        policyName: { type: string }
        group: { type: string }
        index:
          type: integer
          description: 0-based position of the statement in its document.
        sid: { type: string }
        effect:
          type: string
          enum: [Allow, Deny]
        matched: { type: boolean }
        mismatch:
          type: string
          enum: [principal, action, resource, condition]
        statement: { $ref: "#/components/schemas/PolicyStatement" }
    Simulation:
      type: object
      required: [user, action, allowed, decision, reason, evaluated]
      properties:
        user: { type: string }
        action: { type: string }
        bucket: { type: string }
        object: { type: string }
        allowed: { type: boolean }
        decision:
          type: string
          enum: [allow, deny]
        reason: { type: string }
        source:
          type: string
          enum: [root, iam, group, inline, bucket]
        policyName: { type: string }
        group: { type: string }
        statement: { $ref: "#/components/schemas/EvaluatedStatement" }
        evaluated:
          type: array
          items: { $ref: "#/components/schemas/EvaluatedStatement" }

    ConfigSettings:
      type: object
      additionalProperties: { type: string }
    ConfigSubsystem:
      type: object
      required: [name, settings]
      properties:
        name: { type: string }
        settings: { $ref: "#/components/schemas/ConfigSettings" }
    ConfigSubsystemRequest:
      type: object
      required: [settings]
      properties:
        settings: { $ref: "#/components/schemas/ConfigSettings" }
    ConfigDocument:
      type: object
      description: The whole configuration, keyed by subsystem.
      additionalProperties: { $ref: "#/components/schemas/ConfigSettings" }
    ConfigKey:
      type: object
      required: [name, type, description, sensitive, applied]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [string, bool, int, duration, url, enum, list]
        description: { type: string }
        default: { type: string }
        values:
          type: array
          items: { type: string }
        sensitive: { type: boolean }
        applied:
          type: boolean
          description: |
            The server applies the key, on the next request (hot reload). The
            other keys are validated and stored but have no effect yet.
    ConfigSubsystemSchema:
      type: object
      required: [name, description, keys]
      properties:
        name: { type: string }
        description: { type: string }
        keys:
          type: array
          items: { $ref: "#/components/schemas/ConfigKey" }
    LifecycleConfiguration:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LifecycleRule" }
    LifecycleRule:
      type: object
      description: |
        One lifecycle rule (S3 Rule). A number sent as 0 is validated as such (S3 rejects a
        zero `days`), never taken for an absent one.
      properties:
        id:
          type: string
          maxLength: 255
          description: Generated from the content of the rule when empty.
        enabled:
          type: boolean
          description: Status of the rule; true when absent.
        filter: { $ref: "#/components/schemas/LifecycleFilter" }
        expiration: { $ref: "#/components/schemas/LifecycleExpiration" }
        noncurrentExpiration: { $ref: "#/components/schemas/LifecycleNoncurrentExpiration" }
        abortIncompleteUpload: { $ref: "#/components/schemas/LifecycleAbortUpload" }
        transitions:
          type: array
          items: { $ref: "#/components/schemas/LifecycleTransition" }
        noncurrentTransitions:
          type: array
          items: { $ref: "#/components/schemas/LifecycleNoncurrentTransition" }
    LifecycleFilter:
      type: object
      description: The objects of the rule; every criterion set must match (none - the whole bucket).
      properties:
        prefix: { type: string }
        tags:
          type: object
          additionalProperties: { type: string }
        sizeGreaterThan: { type: integer, format: int64, description: Exclusive bound in bytes. }
        sizeLessThan: { type: integer, format: int64, description: Exclusive bound in bytes. }
    LifecycleExpiration:
      type: object
      description: Exactly one of days, date and expiredObjectDeleteMarker.
      properties:
        days: { type: integer, description: Days after the creation of the current version. }
        date:
          type: string
          description: 'ISO 8601 date at midnight UTC ("2030-01-01" or "2030-01-01T00:00:00Z"); answered as the date only.'
        expiredObjectDeleteMarker:
          type: boolean
          description: Remove the delete markers left without versions.
    LifecycleNoncurrentExpiration:
      type: object
      properties:
        noncurrentDays: { type: integer, description: Days after the version became noncurrent. }
        newerNoncurrentVersions: { type: integer, description: Noncurrent versions kept (1-100). }
    LifecycleAbortUpload:
      type: object
      properties:
        daysAfterInitiation: { type: integer }
    LifecycleTransition:
      type: object
      required: [storageClass]
      properties:
        days: { type: integer }
        date: { type: string }
        storageClass: { type: string, description: Storage class of a remote tier (P2). }
    LifecycleNoncurrentTransition:
      type: object
      required: [storageClass]
      properties:
        noncurrentDays: { type: integer }
        newerNoncurrentVersions: { type: integer }
        storageClass: { type: string }
    LifecycleApplyResult:
      type: object
      required: [buckets, versions, deleted, deleteMarkers, uploadsAborted, locked]
      properties:
        buckets: { type: integer, description: 1 when the bucket has a configuration. }
        versions: { type: integer, description: Versions evaluated. }
        deleted: { type: integer, description: Versions and delete markers removed. }
        deleteMarkers: { type: integer, description: Delete markers created. }
        uploadsAborted: { type: integer }
        locked: { type: integer, description: Expirations Object Lock prevented. }
    BucketNotifications:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items: { $ref: "#/components/schemas/EventSubscription" }
    EventSubscription:
      type: object
      required: [arn, events]
      properties:
        id:
          type: string
          maxLength: 255
          description: Generated from the content of the subscription when empty.
        arn:
          type: string
          description: 'ARN of the target, arn:nexo:sqs:<region>:<id>:<type> (NotifyTarget.arn).'
        events:
          type: array
          description: 'Event names or families: s3:ObjectCreated:*, s3:ObjectRemoved:Delete...'
          items: { type: string }
        prefix: { type: string }
        suffix: { type: string }
    NotifyTarget:
      type: object
      required: [id, type, arn, enabled, online, pendingEvents]
      properties:
        id: { type: string, description: '"_" for the default target of a subsystem.' }
        type:
          type: string
          enum: [webhook, kafka, nats, amqp, redis, postgresql]
        arn: { type: string }
        enabled: { type: boolean }
        endpoint: { type: string, description: 'The destination, without credentials.' }
        online: { type: boolean, description: False from a failed delivery to the next successful one. }
        pendingEvents: { type: integer, description: Events waiting in the queue of the target. }
        lastError: { type: string }
    NotifyTargetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotifyTarget" }
    NotifyTargetTest:
      type: object
      required: [target, delivered]
      properties:
        target: { type: string, description: '"<id>:<type>".' }
        delivered: { type: boolean }
        error: { type: string }
    CorsConfiguration:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CorsRule" }
    CorsRule:
      type: object
      required: [allowedOrigins, allowedMethods]
      properties:
        id: { type: string, maxLength: 255 }
        allowedOrigins:
          type: array
          description: Origins with at most one "*" each ("*" alone allows any origin).
          items: { type: string }
        allowedMethods:
          type: array
          items:
            type: string
            description: GET, PUT, POST, DELETE or HEAD.
        allowedHeaders:
          type: array
          items: { type: string }
        exposeHeaders:
          type: array
          items: { type: string }
        maxAgeSeconds: { type: integer }
    SubtitleTrack:
      type: object
      required: [lang, name, auto, cues, size]
      properties:
        lang: { type: string, description: BCP 47 language tag. }
        name: { type: string, description: The name of the language in that language. }
        auto: { type: boolean, description: "A track the media worker derived (transcribed or translated) from the current content." }
        from: { type: string, description: The language an automatic translation derives from. }
        engine: { type: string, description: What produced an automatic track. }
        cues: { type: integer }
        size: { type: integer, format: int64 }
        updated: { type: string, format: date-time }
        updatedBy: { type: string }
    Subtitles:
      type: object
      required: [tracks]
      properties:
        tracks:
          type: array
          items: { $ref: "#/components/schemas/SubtitleTrack" }
    SubtitleCue:
      type: object
      required: [start, end, text]
      properties:
        start: { type: number, description: Seconds from the start of the video. }
        end: { type: number }
        text: { type: string }
        settings: { type: string, description: "WebVTT cue settings (line:0 align:start...)." }
    SubtitleCues:
      type: object
      required: [track, cues]
      properties:
        track: { $ref: "#/components/schemas/SubtitleTrack" }
        cues:
          type: array
          items: { $ref: "#/components/schemas/SubtitleCue" }
    SubtitleCuesRequest:
      type: object
      required: [cues]
      properties:
        cues:
          type: array
          items: { $ref: "#/components/schemas/SubtitleCue" }
    MediaStatus:
      type: object
      required: [state, current]
      properties:
        state: { type: string, enum: [none, processing, done, failed] }
        current: { type: boolean }
        versionId: { type: string }
        error: { type: string }
        step: { type: string }
        rule: { type: string }
        duration: { type: number, description: Duration of the video in seconds. }
        width: { type: integer }
        height: { type: integer }
        renditions:
          type: array
          items:
            type: object
            required: [name, width, height, bandwidth]
            properties:
              name: { type: string }
              width: { type: integer }
              height: { type: integer }
              bandwidth: { type: integer }
        poster: { type: boolean }
        thumbnails:
          type: object
          required: [interval, width, height, columns, count]
          properties:
            interval: { type: number }
            width: { type: integer }
            height: { type: integer }
            columns: { type: integer }
            count: { type: integer }
        images:
          type: array
          description: The variants of an image (width and height are then the size of the image).
          items: { $ref: "#/components/schemas/MediaImageOutput" }
        alpha:
          type: boolean
          description: The image has transparency (its JPEG variants are flattened onto white).
        subtitles:
          type: array
          description: The languages of the automatic subtitle tracks the worker made.
          items: { type: string }
        language: { type: string, description: The spoken language the transcription detected. }
        subtitlesError:
          type: string
          description: Why the automatic subtitles failed (the other outputs are served nonetheless).
        updated: { type: string, format: date-time }
    MediaImageOutput:
      type: object
      required: [format, width, pixelWidth, pixelHeight, size, contentType, url]
      properties:
        format: { type: string, enum: [avif, webp, jpeg, png] }
        width: { type: integer, description: The width the rule asked for; 0 for the image at its own size. }
        pixelWidth: { type: integer, description: Width of the variant in pixels. }
        pixelHeight: { type: integer, description: Height of the variant in pixels. }
        size: { type: integer, format: int64, description: Size of the variant in bytes. }
        contentType: { type: string, description: The media type of the format (image/avif...). }
        url:
          type: string
          description: The variant on the Admin API (GET /buckets/{bucket}/objects/image), a path of the server.
    MediaConfiguration:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/MediaRule" }
    MediaRule:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,64}$"
        prefix:
          type: string
          maxLength: 1024
          description: Prefix of the keys (empty for the whole bucket; never .nexo-media/).
        suffixes:
          type: array
          description: >-
            Suffixes of the keys, matched without case (default .mp4, .mov, .m4v; for an image rule
            .avif, .bmp, .gif, .heic, .heif, .jpeg, .jpg, .png, .tif, .tiff, .webp).
          items: { type: string, maxLength: 32 }
        renditions:
          type: array
          description: Lower qualities to produce, H.264 with the source audio; those taller than the source are skipped.
          items:
            type: string
            enum: ["2160p", "1440p", "1080p", "720p", "480p", "360p", "240p"]
        poster: { type: boolean, description: A JPEG poster frame. }
        thumbnails: { $ref: "#/components/schemas/MediaThumbnails" }
        images: { $ref: "#/components/schemas/MediaImages" }
        subtitles: { $ref: "#/components/schemas/MediaSubtitles" }
    MediaSubtitles:
      type: object
      description: >-
        Automatic subtitles of the videos: the media worker transcribes the speech (an
        OpenAI-compatible transcription service, such as whisper.cpp server) and translates the
        transcription in the languages listed. Not for an image rule.
      properties:
        source:
          type: string
          description: The spoken language (BCP 47); empty detects it.
        languages:
          type: array
          maxItems: 20
          description: Languages (BCP 47) to translate the transcription in.
          items: { type: string }
    MediaImages:
      type: object
      description: >-
        Makes an image rule: the media worker derives the variants of every image the rule selects,
        in every format at every width (widths not smaller than the image are skipped; every format
        also gets the image at its own size). An image rule has no renditions, poster, thumbnails or subtitles.
      properties:
        formats:
          type: array
          description: Formats of the variants (default all), stored the most compact first.
          items: { type: string, enum: [avif, webp, jpeg, png] }
        widths:
          type: array
          maxItems: 16
          description: Widths of the variants in pixels (default 160, 320, 640, 1280, 1920, 2560), stored ascending.
          items: { type: integer, minimum: 16, maximum: 8192 }
    MediaThumbnails:
      type: object
      description: A timeline thumbnail sprite with its WebVTT map.
      properties:
        interval:
          type: string
          description: Interval between two thumbnails, a Go duration from 1s to 10m (default 10s).
    MediaReprocessRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
        versionId: { type: string, description: The version to process (default the latest). }
    ObjectRetention:
      type: object
      properties:
        versionId: { type: string }
        mode:
          type: string
          enum: [GOVERNANCE, COMPLIANCE]
        retainUntil: { type: string, format: date-time }
    SetObjectRetentionRequest:
      type: object
      properties:
        mode:
          type: string
          description: GOVERNANCE or COMPLIANCE (case-insensitive); empty with no date removes the retention.
        retainUntil: { type: string, format: date-time }
        bypassGovernance:
          type: boolean
          description: Shorten or remove a GOVERNANCE retention (s3:BypassGovernanceRetention).
    ObjectLegalHold:
      type: object
      required: [status]
      properties:
        versionId: { type: string }
        status:
          type: string
          description: ON or OFF (case-insensitive in requests).
    Checksum:
      type: object
      required: [algorithm, value]
      properties:
        algorithm:
          type: string
          enum: [CRC32, CRC32C, CRC64NVME, SHA1, SHA256]
        type:
          type: string
          enum: [FULL_OBJECT, COMPOSITE]
        value: { type: string, description: Base64-encoded. }
    ObjectPart:
      type: object
      required: [partNumber, size]
      properties:
        partNumber: { type: integer }
        size: { type: integer, format: int64 }
        checksum: { $ref: "#/components/schemas/Checksum" }
    ObjectAttributes:
      type: object
      required: [key, etag, size, lastModified, partsCount, parts, isTruncated]
      properties:
        key: { type: string }
        versionId: { type: string }
        etag: { type: string }
        size: { type: integer, format: int64 }
        lastModified: { type: string, format: date-time }
        storageClass: { type: string }
        checksum: { $ref: "#/components/schemas/Checksum" }
        partsCount: { type: integer, description: 0 for an object written in one request. }
        parts:
          type: array
          items: { $ref: "#/components/schemas/ObjectPart" }
        isTruncated: { type: boolean }
        nextPartNumberMarker: { type: integer }
    KmsStatus:
      type: object
      description: >-
        State of the KMS of the server-side encryption. Without KMS configured is false: SSE-S3 and
        SSE-KMS are refused, SSE-C still works.
      required: [configured, online]
      properties:
        configured: { type: boolean }
        backend:
          type: string
          enum: [builtin, kes]
          description: '"builtin" (master key from the environment) or "kes" (external KES servers).'
        defaultKeyId: { type: string, description: The key of SSE-S3 and of the SSE-KMS requests without key id. }
        endpoints:
          type: array
          description: The servers of an external KMS.
          items:
            type: object
            required: [url, online]
            properties:
              url: { type: string }
              online: { type: boolean }
        online: { type: boolean, description: The KMS answers. }
        error: { type: string, description: Why the KMS does not answer. }
        version: { type: string, description: Version of the external KMS. }
    KmsInfo:
      description: The KMS in the server information, with the names of its first keys.
      allOf:
        - { $ref: "#/components/schemas/KmsStatus" }
        - type: object
          properties:
            keys:
              type: array
              items: { type: string }
    KmsKey:
      type: object
      required: [id]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        default: { type: boolean, description: The key of SSE-S3. }
    KmsKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KmsKey" }
    CreateKmsKeyRequest:
      type: object
      required: [id]
      properties:
        id: { type: string }
    KmsResealResult:
      type: object
      required: [buckets, versions, uploads, resealed, failed]
      properties:
        buckets: { type: integer, description: Buckets walked. }
        versions: { type: integer, description: SSE-S3 and SSE-KMS versions met. }
        uploads: { type: integer, description: Pending multipart uploads of SSE-S3 and SSE-KMS objects met (their description holds the sealed key). }
        resealed: { type: integer, description: Versions and uploads whose data key is sealed under the current master key. }
        failed: { type: integer, description: Versions and uploads that could not be re-sealed. }
        firstError: { type: string, description: Why the first failed version or upload could not be re-sealed. }

    KeyPattern:
      type: object
      required: [type, pattern]
      description: |
        A pattern of keys or paths: `prefix` (literal, an empty prefix matches everything),
        `glob` (`*` one segment, `**` any number, `?`, `[abc]`, `{a,b}`) or `regex` (RE2:
        linear time, no backreference nor lookaround, at most 1024 characters). Keys are
        matched decoded and normalized (`.`, `..`, `//` resolved, Unicode NFC).
      properties:
        type:
          type: string
          enum: [prefix, glob, regex]
        pattern: { type: string }
        caseInsensitive: { type: boolean }
    AccessRuleConditions:
      type: object
      description: Conditions of an access rule; all must hold.
      properties:
        sourceIp:
          type: array
          description: CIDRs or IPs (IPv4, IPv6) one of which must contain the client (behind the trusted proxies).
          items: { type: string }
        notSourceIp:
          type: array
          items: { type: string }
        referer:
          type: array
          description: Patterns with `*` and `?` one of which the Referer must match.
          items: { type: string }
        host:
          type: array
          description: Hosts the request must be addressed to (exact or `*.example.com`).
          items: { type: string }
        secureTransport: { type: boolean }
        timeWindow:
          type: object
          properties:
            from: { type: string, description: "RFC 3339, included." }
            to: { type: string, description: "RFC 3339, included." }
        methods:
          type: array
          items: { type: string }
        headers:
          type: object
          description: Request headers and their exact values; a value may be `${secret:<name>}`.
          additionalProperties: { type: string }
        captureEquals:
          type: object
          description: Named groups of the regex of the rule and the values they must capture (policy variables such as `${aws:username}`).
          additionalProperties: { type: string }
    BucketAccessRule:
      type: object
      required: [id, priority, effect, principals, actions]
      properties:
        id:
          type: string
          description: 1-64 letters, digits, '.', '_' or '-'; unique in the bucket.
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Order of evaluation, lower first (deny rules before allow rules).
        effect:
          type: string
          enum: [allow, deny]
        principals:
          type: array
          description: '`*` (everyone, anonymous included), `user:<name>`, `group:<name>`, `accesskey:<key>`, `distribution:<id>` (wildcards `*` and `?` in the names).'
          items: { type: string }
        actions:
          type: array
          description: Classes `read`, `list`, `write`, `delete`, `tag`, `all`, or S3 actions (`s3:GetObject`, `s3:Get*`). Object lock is never granted.
          items: { type: string }
        match:
          description: The keys of the rule; absent, the whole bucket.
          allOf:
            - { $ref: "#/components/schemas/KeyPattern" }
        conditions: { $ref: "#/components/schemas/AccessRuleConditions" }
        description: { type: string }
    AccessRules:
      type: object
      required: [bucket, rules, etag, public, blockPublic, warnings]
      properties:
        bucket: { type: string }
        rules:
          type: array
          items: { $ref: "#/components/schemas/BucketAccessRule" }
        etag:
          type: string
          description: Version of the rules, for the If-Match of PUT (also in the ETag header, quoted).
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        public:
          type: boolean
          description: An allow rule for everyone is in effect (not blocked).
        blockPublic:
          type: boolean
          description: The block public access in effect on the bucket (cluster or bucket).
        warnings:
          type: array
          description: Rules letting everyone write or delete, rules for everyone ignored by the block public access.
          items: { type: string }
    PutAccessRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          description: Every rule of the bucket; an empty list removes them.
          items: { $ref: "#/components/schemas/BucketAccessRule" }
    TestAccessRulesRequest:
      type: object
      properties:
        keys:
          type: array
          description: Keys to test (the listing prefixes of a listing action); none tests the bucket.
          items: { type: string }
        action:
          type: string
          description: An action class (read, list, write, delete, tag) or an S3 action; default read.
        principal:
          type: string
          description: '`anonymous` (default), `user:<name>`, `accesskey:<key>` (or a bare access key), `distribution:<id>`.'
        ip: { type: string, description: "Client address." }
        host: { type: string, description: "Host the request is addressed to." }
        method: { type: string, description: "HTTP method (default derived from the action)." }
        secure: { type: boolean, description: "HTTPS (absent - unknown)." }
        referer: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        distribution: { type: string, description: "Distribution serving the request." }
        time: { type: string, format: date-time, description: "Time of the request (default now)." }
    EvaluatedAccessRule:
      type: object
      required: [id, priority, effect, matched]
      properties:
        id: { type: string }
        priority: { type: integer }
        effect: { type: string, enum: [Allow, Deny] }
        captures:
          type: object
          description: Named groups captured by the regex of the rule.
          additionalProperties: { type: string }
        matched: { type: boolean, description: "The rule applies to the request." }
        mismatch:
          type: string
          enum: [principal, action, key, condition, blocked-public]
          description: The first element that did not match.
        condition: { type: string, description: "The condition that did not hold." }
    AccessRulesKeyResult:
      type: object
      required: [key, normalizedKey, rules, matched, rulesOutcome, allowed, reason]
      properties:
        key: { type: string }
        normalizedKey: { type: string, description: "The key the patterns were matched against." }
        rules:
          type: array
          description: Every rule with its outcome, in evaluation order.
          items: { $ref: "#/components/schemas/EvaluatedAccessRule" }
        matched:
          type: array
          description: Ids of the rules that apply.
          items: { type: string }
        blockedPublic:
          type: array
          description: Ids of the rules for everyone the block public access ignores.
          items: { type: string }
        rulesOutcome:
          type: string
          enum: [allow, deny, none]
          description: The outcome of the access rules alone.
        allowed: { type: boolean, description: "The final decision of the policy engine." }
        determinant: { type: string, description: "The access rule that decided (absent - another source or the implicit deny)." }
        source: { type: string, description: "Source of the decisive statement (iam, group, bucket, accessrule, root...)." }
        reason: { type: string }
    AccessRulesTestResult:
      type: object
      required: [bucket, action, blockPublic, results]
      properties:
        bucket: { type: string }
        action: { type: string, description: "The S3 action evaluated." }
        blockPublic: { $ref: "#/components/schemas/BlockPublic" }
        results:
          type: array
          items: { $ref: "#/components/schemas/AccessRulesKeyResult" }
    AccessRulesPreset:
      type: string
      enum: [private, public-read, public-read-list, public-prefix, public-write, custom]
    AccessRulesPublicStatus:
      type: object
      required: [bucket, public, preset, blocked]
      properties:
        bucket: { type: string }
        public: { type: boolean, description: "An allow rule for everyone is in effect." }
        preset: { $ref: "#/components/schemas/AccessRulesPreset" }
        rules:
          type: array
          description: Ids of the allow rules for everyone.
          items: { type: string }
        blocked: { type: boolean, description: "The block public access ignores them." }
    AccessPresetRequest:
      type: object
      required: [preset]
      properties:
        preset: { $ref: "#/components/schemas/AccessRulesPreset" }
        match:
          description: The keys of public-prefix (required) and public-write (optional).
          allOf:
            - { $ref: "#/components/schemas/KeyPattern" }
        confirm: { type: boolean, description: "Acknowledges public-write." }
    BlockPublicMode:
      type: string
      enum: [reject, ignore]
    BlockPublic:
      type: object
      required: [enabled, mode, cluster, effective]
      properties:
        bucket: { type: string, description: "Absent for the cluster level." }
        enabled: { type: boolean, description: "The setting of this level." }
        mode: { $ref: "#/components/schemas/BlockPublicMode" }
        cluster: { type: boolean, description: "The cluster-level setting." }
        effective: { type: boolean, description: "In effect (cluster or bucket)." }
    BlockPublicRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        mode:
          description: Cluster level only; absent keeps it.
          allOf:
            - { $ref: "#/components/schemas/BlockPublicMode" }
    AccessRuleError:
      type: object
      required: [rule, message]
      properties:
        rule: { type: integer, description: "1-based index of the rule, 0 for the whole list." }
        id: { type: string }
        field: { type: string, description: "The element at fault (match.pattern, conditions.sourceIp[1]...)." }
        position: { type: integer, description: "1-based position of the problem in the pattern." }
        message: { type: string }

    DistributionMode:
      type: string
      enum: [website, s3]
      description: website (static sites, downloads; never S3 XML) or s3 (the domain is an S3 endpoint of the bucket).
    DistributionAccess:
      type: string
      enum: [public, signed, authenticated, deny]
    DistributionCORS:
      type: object
      required: [allowedOrigins]
      properties:
        allowedOrigins:
          type: array
          items: { type: string }
        allowedMethods:
          type: array
          items: { type: string }
        allowedHeaders:
          type: array
          items: { type: string }
        exposeHeaders:
          type: array
          items: { type: string }
        maxAge: { type: integer }
        allowCredentials: { type: boolean }
    DistributionBehavior:
      type: object
      description: How the requests of a path are served; an unset field inherits from the default behavior.
      properties:
        pathPattern:
          description: The paths of the behavior (absent for the default behavior).
          allOf:
            - { $ref: "#/components/schemas/KeyPattern" }
        access: { $ref: "#/components/schemas/DistributionAccess" }
        allowedMethods:
          type: array
          description: Default GET, HEAD, OPTIONS; POST and PUT only on signed behaviors of a website distribution.
          items: { type: string }
        indexDocument: { type: string }
        spaFallback: { type: string, description: "Path served (200) instead of a missing object." }
        cache:
          type: object
          description: Cache settings (docs/11); cacheControl is the Cache-Control sent to the browsers.
          properties:
            cacheControl: { type: string }
        signing:
          type: object
          required: [keyGroup]
          properties:
            keyGroup: { type: string }
        responseHeaders:
          type: object
          additionalProperties: { type: string }
        cors: { $ref: "#/components/schemas/DistributionCORS" }
        images: { $ref: "#/components/schemas/DistributionImages" }
        video: { $ref: "#/components/schemas/DistributionVideo" }
    DistributionVideo:
      type: object
      description: |
        Serves the HLS presentations of the MP4 videos below their URL (website mode only). With
        `hls`, `<video>/master.m3u8` is the multivariant playlist of the video at `<video>` (the
        renditions of the media worker included) and the files it names (media playlists, init and
        media segments, `poster.jpg`, `thumbnails.vtt` and `sprite.jpg`) are its siblings. A viewer
        allowed `nexo:GetMediaStream` streams the video without being allowed to download it
        (`s3:GetObject`). On a signed behavior, sign a custom policy whose resource covers the URL of
        the video with a wildcard (`https://videos.example.com/intro.mp4/*`), or use signed cookies:
        the playlists carry the parameters of the signed URL to the files they name. The files pinned
        to a revision (`?rev=`) are cacheable for a day; a path whose prefix is not a streamable video
        is served as the object of that key.
      required: [hls]
      properties:
        hls: { type: boolean }
    DistributionImages:
      type: object
      description: |
        Serves the variants of the images the media worker derived (an image rule of the bucket) at
        the URL of the image itself (website mode only). With `negotiate`, a GET or HEAD of an image
        whose variants derive from its current content answers the variant the request selects: the
        format negotiated with the Accept header (AVIF, WebP, JPEG; PNG rather than a flattened JPEG
        for a transparent image; `Vary: Accept`) or named by `?format=avif|webp|jpeg|png`, the image
        at its own size or with `?w=<pixels>` the narrowest variant at least that wide.
        `?format=original`, an object without variants (not an image, not processed yet, processed
        from an older content) is served as the original. The header `X-Nexo-Image-Variant` names
        the variant served. The cache of the distribution keys the variants by format and width.
      required: [negotiate]
      properties:
        negotiate: { type: boolean }
    Distribution:
      type: object
      required: [id, aliases, origin]
      description: |
        A distribution (docs/10 §10.2): the document stored in the system store and
        exported by `nexoctl dist export`.
      properties:
        id:
          type: string
          description: Lowercase letters, digits, '.', '_' and '-' (at most 64).
        enabled: { type: boolean }
        comment: { type: string }
        aliases:
          type: array
          description: Host names, exact or wildcard (`*.preview.example.com`), unique across the distributions.
          items: { type: string }
        origin:
          type: object
          required: [bucket]
          properties:
            bucket: { type: string }
            pathPrefix: { type: string, description: "The distribution serves only the keys under this prefix (website mode)." }
            versionPinning: { type: boolean }
        mode: { $ref: "#/components/schemas/DistributionMode" }
        defaultBehavior: { $ref: "#/components/schemas/DistributionBehavior" }
        behaviors:
          type: array
          description: Evaluated in order, the first match wins.
          items: { $ref: "#/components/schemas/DistributionBehavior" }
        errorPages:
          type: array
          items:
            type: object
            required: [status, path]
            properties:
              status: { type: integer }
              path: { type: string }
              responseStatus: { type: integer }
        redirects:
          type: array
          items:
            type: object
            properties:
              from: { type: string, description: "RE2 expression on the path." }
              to: { type: string, description: "Target with $1, ${name}." }
              hostFrom: { type: string }
              toHost: { type: string }
              httpsOnly: { type: boolean }
              status: { type: integer }
        headers:
          type: object
          properties:
            response:
              type: object
              additionalProperties: { type: string }
            cors: { $ref: "#/components/schemas/DistributionCORS" }
        restrictions:
          type: object
          properties:
            sourceIp:
              type: object
              properties:
                allow:
                  type: array
                  items: { type: string }
                deny:
                  type: array
                  items: { type: string }
            originSecretHeader:
              type: object
              required: [name]
              properties:
                name: { type: string }
                value: { type: string, description: "A secret in clear (stored hashed) or ${secret:<name>}." }
                values:
                  type: array
                  description: The active secrets, hashed (sha256:<hex>) or ${secret:<name>}.
                  items: { type: string }
            rateLimit:
              type: object
              description: >-
                Requests admitted by each node (S-DST-08): requestsPerSecond on average, burst at once,
                per client address or shared by the distribution. Beyond it a website answers 429, an s3
                distribution 503 SlowDown, with Retry-After.
              properties:
                requestsPerSecond: { type: integer, minimum: 0, description: "0: no limit." }
                burst: { type: integer, minimum: 0, description: "0: requestsPerSecond." }
                per: { type: string, enum: [ip, distribution], description: "Default ip." }
        tls:
          type: object
          properties:
            certificate:
              type: string
              description: auto (ACME), upload:<id>, none (TLS terminated by a proxy).
            challenge:
              type: string
              enum: [http-01, tls-alpn-01, dns-01]
              description: |
                ACME challenge of the certificate `auto` (default: the challenge of the
                deployment). A wildcard alias requires `dns-01`.
            dnsProvider:
              type: string
              description: Name of the DNS provider of `dns-01` (/dns-providers).
        logging:
          type: object
          properties:
            accessLog: { type: boolean }
            format: { type: string, enum: [json, combined] }
            target: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        etag: { type: string, description: "The stored version (If-Match of PUT); ignored in requests." }
    DistributionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
    Route:
      type: object
      required: [kind, host]
      properties:
        kind:
          type: string
          enum: [distribution, virtual-host, main, path-style, misdirected]
        host: { type: string, description: "Normalized host." }
        alias: { type: string, description: "The alias that matched." }
        distribution: { type: string, description: "Id of the distribution." }
        mode: { $ref: "#/components/schemas/DistributionMode" }
        enabled: { type: boolean }
        bucket: { type: string }
    DistributionTestRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "An absolute URL on an alias of the distribution, or a path." }
        method: { type: string, description: "Default GET." }
        clientIp: { type: string }
    DistributionTestResult:
      type: object
      required: [route, behaviorIndex, behavior, responseHeaders]
      properties:
        route: { $ref: "#/components/schemas/Route" }
        behaviorIndex: { type: integer, description: "Index of the behavior, -1 for the default one." }
        behavior: { $ref: "#/components/schemas/DistributionBehavior" }
        bucket: { type: string }
        key: { type: string }
        redirectStatus: { type: integer }
        redirectLocation: { type: string }
        refusalStatus: { type: integer }
        refusal: { type: string }
        responseHeaders:
          type: object
          additionalProperties: { type: string }
    RotateOriginSecretRequest:
      type: object
      properties:
        header: { type: string, description: "Default the current header, or X-Origin-Secret." }
        keep: { type: integer, minimum: 0, description: "Previous secrets kept active (default 1)." }
        dropPrevious: { type: boolean }
    RotateOriginSecretResult:
      type: object
      required: [secret, header, distribution]
      properties:
        secret: { type: string, description: "The new secret in clear, shown once." }
        header: { type: string }
        distribution: { $ref: "#/components/schemas/Distribution" }
    SignDistributionRequest:
      type: object
      required: [url, privateKeyPem]
      properties:
        url: { type: string, description: "An absolute URL on an alias, or a path completed with scheme and host." }
        scheme: { type: string, enum: [http, https] }
        host: { type: string, description: "Default the first exact alias." }
        privateKeyPem: { type: string, description: "PKCS 8 (or PKCS 1 RSA) private key of a key of the key group." }
        keyPairId: { type: string }
        expiresIn: { type: integer, minimum: 1, description: "Seconds from now." }
        expiresAt: { type: string, format: date-time }
        notBefore: { type: string, format: date-time }
        ipRange: { type: string, description: "IP or CIDR of the viewers." }
        resource: { type: string, description: "URL with * and ? wildcards (default the URL)." }
        cookies: { type: boolean }
    SignedCookie:
      type: object
      required: [name, value, expires]
      properties:
        name: { type: string }
        value: { type: string }
        expires: { type: string, format: date-time }
    SignDistributionResult:
      type: object
      required: [url, cookies, keyGroup, keyPairId, expiresAt]
      properties:
        url: { type: string, description: "The signed URL (unsigned with cookies)." }
        cookies:
          type: array
          items: { $ref: "#/components/schemas/SignedCookie" }
        keyGroup: { type: string }
        keyPairId: { type: string }
        expiresAt: { type: string, format: date-time }
    PublicKey:
      type: object
      required: [id, algorithm, publicKeyPem, createdAt]
      properties:
        id: { type: string, description: "Key-Pair-Id of the signed URLs." }
        algorithm: { type: string, enum: [ed25519, rsa] }
        bits: { type: integer }
        publicKeyPem: { type: string }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
    PublicKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicKey" }
    KeyGroup:
      type: object
      required: [id, keys, createdAt, updatedAt]
      properties:
        id: { type: string }
        comment: { type: string }
        keys:
          type: array
          items: { $ref: "#/components/schemas/PublicKey" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    KeyGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KeyGroup" }
    GenerateKeyRequest:
      type: object
      properties:
        algorithm: { type: string, enum: [ed25519, rsa] }
        bits: { type: integer, description: "RSA size (2048 by default, 3072 or 4096)." }
        comment: { type: string }
    GeneratedKey:
      type: object
      required: [publicKey, privateKeyPem]
      properties:
        publicKey: { $ref: "#/components/schemas/PublicKey" }
        privateKeyPem: { type: string, description: "PKCS 8 private key, returned once and never stored." }
    CreateKeyGroupRequest:
      type: object
      required: [id]
      properties:
        id: { type: string }
        comment: { type: string }
        generateKey: { $ref: "#/components/schemas/GenerateKeyRequest" }
    CreateKeyGroupResult:
      type: object
      required: [keyGroup]
      properties:
        keyGroup: { $ref: "#/components/schemas/KeyGroup" }
        key: { $ref: "#/components/schemas/GeneratedKey" }
    AddKeyRequest:
      type: object
      properties:
        publicKeyPem: { type: string, description: "A PKIX public key; absent generates a key pair." }
        algorithm: { type: string, enum: [ed25519, rsa] }
        bits: { type: integer }
        comment: { type: string }
    AddKeyResult:
      type: object
      required: [publicKey]
      properties:
        publicKey: { $ref: "#/components/schemas/PublicKey" }
        privateKeyPem: { type: string, description: "The private key of a generated key pair, returned once." }

    CertificateStatus:
      type: string
      enum: [valid, expiring, expired, not-yet-valid]
    CertificateDetails:
      type: object
      required: [id, source, domains, subject, issuer, serial, notBefore, notAfter, fingerprint, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        source: { type: string, enum: [upload, acme] }
        domains:
          type: array
          items: { type: string }
        subject: { type: string }
        issuer: { type: string }
        serial: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        fingerprint: { type: string }
        status: { $ref: "#/components/schemas/CertificateStatus" }
        lastError: { type: string, description: "Last failure of an ACME renewal." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Certificate:
      allOf:
        - { $ref: "#/components/schemas/CertificateDetails" }
        - type: object
          required: [usedBy]
          properties:
            usedBy:
              type: array
              description: Distributions whose TLS names the certificate.
              items: { type: string }
    ManagedCertificate:
      type: object
      required: [id, domains, distributions, state]
      properties:
        id: { type: string }
        domains:
          type: array
          items: { type: string }
        distributions:
          type: array
          items: { type: string }
        challenge:
          type: string
          enum: [http-01, tls-alpn-01, dns-01]
          description: Challenge of the certificate (absent for the challenge of the deployment).
        dnsProvider: { type: string, description: "DNS provider of dns-01." }
        state: { type: string, enum: [issued, pending] }
        certificate: { $ref: "#/components/schemas/CertificateDetails" }
    CertificateList:
      type: object
      required: [items, acme]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Certificate" }
        acme:
          type: object
          required: [directory, challenge, managed]
          properties:
            directory: { type: string }
            challenge: { type: string, enum: [http-01, tls-alpn-01] }
            managed:
              type: array
              items: { $ref: "#/components/schemas/ManagedCertificate" }
    UploadCertificateRequest:
      type: object
      required: [certificatePem, privateKeyPem]
      properties:
        id: { type: string, description: "Default derived from the first DNS name." }
        certificatePem: { type: string, description: "Leaf certificate followed by its intermediates." }
        privateKeyPem: { type: string }
    DnsProviderType:
      type: string
      enum: [cloudflare, route53, rfc2136]
    DnsProviderSettings:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/DnsProviderType" }
        comment: { type: string }
        cloudflare:
          type: object
          properties:
            zoneId: { type: string, description: "Default: the zone found by name." }
        route53:
          type: object
          properties:
            accessKeyId: { type: string, description: "Absent: the ambient AWS credentials of the node." }
            region: { type: string, description: "Default us-east-1." }
            hostedZoneId: { type: string, description: "Default: the public zone found by name." }
        rfc2136:
          type: object
          required: [nameserver]
          properties:
            nameserver: { type: string, description: "Primary nameserver accepting the updates, host[:port]." }
            zone: { type: string, description: "Default: from the SOA the nameserver reports." }
            tsigKeyName: { type: string, description: "Absent: unsigned updates." }
            tsigAlgorithm:
              type: string
              enum: [hmac-sha256, hmac-sha512, hmac-sha384, hmac-sha224, hmac-sha1]
        ttl: { type: integer, description: "TTL of the records in seconds (default 60)." }
        propagationTimeout: { type: integer, description: "Wait of the propagation in seconds (default 120, at most 1800)." }
        pollingInterval: { type: integer, description: "Delay between two checks in seconds (default 4)." }
    DnsProvider:
      allOf:
        - { $ref: "#/components/schemas/DnsProviderSettings" }
        - type: object
          required: [name, hasCredentials, usedBy, createdAt, updatedAt]
          properties:
            name: { type: string }
            hasCredentials:
              type: boolean
              description: Credentials are stored (they are never returned).
            usedBy:
              type: array
              description: Distributions whose `tls.dnsProvider` names it.
              items: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    DnsProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DnsProvider" }
    DnsProviderRequest:
      allOf:
        - { $ref: "#/components/schemas/DnsProviderSettings" }
        - type: object
          properties:
            name: { type: string, description: "Required to create; the one of the path to update." }
            credentials:
              type: object
              description: |
                Write-only, sealed in the system store, never returned nor logged. On an update an
                empty field keeps the stored value.
              properties:
                apiToken: { type: string, description: "Cloudflare API token (Zone:DNS:Edit)." }
                secretAccessKey: { type: string, description: "Route 53 secret access key." }
                sessionToken: { type: string, description: "Route 53 session token (temporary credentials)." }
                tsigSecret: { type: string, description: "RFC 2136 TSIG secret, base64." }
    DnsProviderTestResult:
      type: object
      required: [ok, record, durationMs]
      properties:
        ok: { type: boolean }
        record: { type: string, description: "The TXT record of the test." }
        step: { type: string, enum: [present, propagation, cleanup], description: "The failed step." }
        error: { type: string }
        durationMs: { type: integer, format: int64 }
    CacheDuration:
      description: |
        A duration: Go syntax ("90s", "1h30m") or days ("365d"); a number is seconds. The
        server writes the Go syntax, whole days as "<n>d".
      oneOf:
        - type: string
        - type: number
    CacheSize:
      description: |
        A size: bytes, or a number with a unit (KiB, MiB, GiB, TiB, KB, MB, GB, TB; K, M,
        G, T are binary). The server writes the largest binary unit dividing it ("20GiB").
      oneOf:
        - type: string
        - type: integer
    CacheLevel:
      type: string
      enum: [default, global, distribution, domain, behavior]
      description: Where a setting comes from (docs/11 §11.1).
    CacheMode:
      type: string
      enum: [local, shared, shared+local]
    CacheQueryString:
      description: |
        The query parameters of the cache key: "none", "all", "allowlist:v,w",
        "denylist:utm_source", or the object form (`mode` and `params`, or `allowlist` /
        `denylist`). The server writes the object `{mode, params}`.
      anyOf:
        - type: string
        - type: object
          properties:
            mode: { type: string, enum: [none, all, allowlist, denylist] }
            params:
              type: array
              items: { type: string }
            allowlist:
              type: array
              items: { type: string }
            denylist:
              type: array
              items: { type: string }
    CachePolicySpec:
      type: object
      description: |
        The settings of a cache policy (docs/11 §11.2). In a policy every field is set; in
        the settings of a level an unset field inherits from the more general level.
      properties:
        ttl:
          type: object
          description: Lifetime in cache when the object states none (default), and bounds of every lifetime (min, max).
          properties:
            default: { $ref: "#/components/schemas/CacheDuration" }
            min: { $ref: "#/components/schemas/CacheDuration" }
            max: { $ref: "#/components/schemas/CacheDuration" }
        respectObjectCacheControl: { type: boolean, description: "Use the Cache-Control and Expires stored with the objects." }
        browserCacheControl: { type: string, description: "Cache-Control sent to the clients; empty keeps the one of the object." }
        cacheKey:
          type: object
          properties:
            queryString: { $ref: "#/components/schemas/CacheQueryString" }
            headers:
              type: array
              items: { type: string }
            cookies:
              type: array
              items: { type: string }
            normalize: { type: boolean, description: "Sort the query, lowercase, drop utm_*, fbclid, gclid." }
            includeHost: { type: boolean, description: "One key per domain, or shared by the aliases." }
        staleWhileRevalidate: { $ref: "#/components/schemas/CacheDuration" }
        staleIfError: { $ref: "#/components/schemas/CacheDuration" }
        negativeCaching: { $ref: "#/components/schemas/CacheDuration" }
        bypass:
          type: object
          properties:
            always: { type: boolean }
            authorization: { type: boolean, description: "Skip the requests with credentials; false caches them per credential." }
            cookies:
              type: array
              items: { type: string }
            queryParams:
              type: array
              items: { type: string }
            headers:
              type: array
              items: { type: string }
        compression:
          type: object
          properties:
            enabled: { type: boolean }
            algorithms:
              type: array
              items: { type: string, enum: [gzip, br, zstd] }
            contentTypes:
              type: array
              items: { type: string }
            minSize: { $ref: "#/components/schemas/CacheSize" }
        minSize: { $ref: "#/components/schemas/CacheSize" }
        maxObjectSize: { $ref: "#/components/schemas/CacheSize" }
        rangeCaching:
          type: object
          properties:
            enabled: { type: boolean }
            blockSize: { $ref: "#/components/schemas/CacheSize" }
        contentTypes:
          type: object
          properties:
            allow:
              type: array
              items: { type: string }
            deny:
              type: array
              items: { type: string }
    CachePolicy:
      description: A reusable cache policy, referenced by name.
      allOf:
        - $ref: "#/components/schemas/CachePolicySpec"
        - type: object
          required: [name]
          properties:
            name:
              type: string
              description: Lowercase letters, digits, '.', '_' and '-' (at most 64).
            comment: { type: string }
            builtin: { type: boolean, description: "A predefined, read-only policy; ignored in requests." }
            updatedAt: { type: string, format: date-time }
            etag: { type: string, description: "The stored version; ignored in requests." }
    CachePolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CachePolicy" }
    CachePolicyPreview:
      type: object
      required: [policy, cacheControl, inherited, summary]
      properties:
        policy: { $ref: "#/components/schemas/CachePolicy" }
        cacheControl: { type: string, description: "The Cache-Control sent to the clients." }
        inherited: { type: boolean, description: "The policy sets none: the one of the objects is sent." }
        summary: { type: string }
    CacheSettings:
      description: |
        The cache settings of a level: whether the cache is on, the policy it starts from
        (naming one replaces what the more general levels set) and the fields of the policy
        it overrides.
      allOf:
        - $ref: "#/components/schemas/CachePolicySpec"
        - type: object
          properties:
            enabled: { type: boolean }
            policy: { type: string }
            quota: { $ref: "#/components/schemas/CacheSize" }
            purgeWebhooks:
              type: array
              description: The webhooks of the distribution purged on the invalidations of the domain (domain level).
              items: { type: string }
            autoInvalidate: { type: boolean, description: "Drop the entries of the objects written (global and distribution levels; default true)." }
    CacheGlobalSettings:
      type: object
      required: [cache]
      properties:
        cache: { $ref: "#/components/schemas/CacheSettings" }
        nodeHeader: { type: boolean, description: "Add X-Cache-Node to every answer." }
        debug:
          type: object
          description: The request header unlocking X-Cache-Key, X-Cache-Policy and X-Cache-Node.
          properties:
            header: { type: string, description: "Default X-Nexo-Cache-Debug." }
            secret: { type: string, description: "The value to present, or ${secret:<name>}; masked in answers." }
        updatedAt: { type: string, format: date-time }
        etag: { type: string }
    CacheWebhook:
      type: object
      required: [id, type]
      description: |
        A CDN or proxy purged on the invalidations of the distribution, with retries and a
        persistent queue. Secrets (token, clientSecret) may be ${secret:webhook-<name>}
        (NEXO_SECRET_WEBHOOK_<NAME>, no other secret) and never go in the headers; they are
        masked in answers, and a masked value keeps the stored one only while the type, url,
        zone, clientToken and network are unchanged. The endpoint must be a public address
        (or a network of --cache-webhook-allow), never a node of the cluster; the test call
        reports the status, never the body of the answer.
      properties:
        id: { type: string }
        type: { type: string, enum: [cloudflare, fastly, akamai, nginx, varnish, generic] }
        domains:
          type: array
          description: The domains whose invalidations call it (none for every domain not bound to another webhook).
          items: { type: string }
        url: { type: string, description: "API base, address of the proxy, or URL template of a generic webhook." }
        zone: { type: string, description: "Cloudflare zone id, Fastly service id." }
        token: { type: string }
        clientToken: { type: string }
        clientSecret: { type: string }
        network: { type: string, enum: [production, staging] }
        cpCode: { type: string }
        method: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        body: { type: string, description: "Body template of a generic webhook (Go text/template)." }
        scheme: { type: string, enum: [http, https] }
    CacheWebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CacheWebhook" }
    CacheWebhookTestResult:
      type: object
      required: [ok, durationMs]
      properties:
        ok: { type: boolean }
        status: { type: integer, description: "HTTP status answered by the endpoint." }
        error: { type: string }
        durationMs: { type: integer }
    DistributionCache:
      type: object
      required: [cache]
      description: The cache settings of a distribution (docs/11 §11.1).
      properties:
        distribution: { type: string, description: "The id of the distribution (the one of the path; may be omitted in requests)." }
        cache: { $ref: "#/components/schemas/CacheSettings" }
        domains:
          type: array
          items:
            type: object
            required: [host, cache]
            properties:
              host: { type: string, description: "An alias of the distribution (exact or wildcard), or a host a wildcard alias matches." }
              cache: { $ref: "#/components/schemas/CacheSettings" }
        behaviors:
          type: array
          description: Overrides per path, the first match wins (no quota, webhooks nor autoInvalidate).
          items:
            type: object
            required: [pathPattern, cache]
            properties:
              pathPattern: { $ref: "#/components/schemas/KeyPattern" }
              cache: { $ref: "#/components/schemas/CacheSettings" }
        webhooks:
          type: array
          items: { $ref: "#/components/schemas/CacheWebhook" }
        warmOnWrite:
          type: array
          description: The objects written whose path matches one of these patterns are cached at once.
          items: { $ref: "#/components/schemas/KeyPattern" }
        updatedAt: { type: string, format: date-time }
        etag: { type: string }
    CacheEffectivePolicy:
      type: object
      required: [enabled, enabledLevel, policyName, policyLevel, policy, fields, behavior, autoInvalidate]
      properties:
        enabled: { type: boolean }
        enabledLevel: { $ref: "#/components/schemas/CacheLevel" }
        policyName: { type: string }
        policyLevel: { $ref: "#/components/schemas/CacheLevel" }
        policy: { $ref: "#/components/schemas/CachePolicySpec" }
        fields:
          type: object
          description: Every setting ("ttl.default", "staleIfError"...) with the level that set it last.
          additionalProperties: { $ref: "#/components/schemas/CacheLevel" }
        domain: { type: string, description: "The domain settings that matched." }
        behavior: { type: integer, description: "Index of the behavior that matched, -1 for none." }
        distributionQuota: { $ref: "#/components/schemas/CacheSize" }
        domainQuota: { $ref: "#/components/schemas/CacheSize" }
        cacheControl: { type: string, description: "The Cache-Control sent to the clients (empty: the one of the object)." }
        autoInvalidate: { type: boolean }
    CacheInvalidationRequest:
      type: object
      properties:
        domain: { type: string, description: "A domain of the distribution; alone, it purges the whole domain." }
        paths:
          type: array
          description: Exact paths ("/docs/" also drops its index document), or absolute URLs of a domain (their host sets the domain).
          items: { type: string }
        patterns:
          type: array
          items: { $ref: "#/components/schemas/KeyPattern" }
        tags:
          type: array
          description: Cache tags (x-amz-meta-cache-tag, surrogate keys).
          items: { type: string }
        all: { type: boolean }
        soft: { type: boolean, description: "Mark the entries expired instead of dropping them." }
    CacheNodeStatus:
      type: object
      required: [node, state]
      properties:
        node: { type: string }
        state: { type: string, enum: [pending, completed, running, failed] }
        at: { type: string, format: date-time }
        removed: { type: integer, description: "Entries dropped or marked." }
        error: { type: string }
    CacheInvalidation:
      type: object
      required: [id, request, createdAt, state, nodes]
      properties:
        id: { type: string }
        request:
          allOf:
            - $ref: "#/components/schemas/CacheInvalidationRequest"
            - type: object
              properties:
                distribution: { type: string, description: "Empty for a global purge." }
                actor: { type: string }
        createdAt: { type: string, format: date-time }
        state: { type: string, enum: [in-progress, completed] }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CacheNodeStatus" }
    CacheInvalidationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CacheInvalidation" }
    CacheWarmRequest:
      type: object
      properties:
        domain: { type: string, description: "The domain the entries are keyed by (default the first exact alias)." }
        paths:
          type: array
          items: { type: string }
        urls:
          type: array
          description: Absolute URLs of the domain.
          items: { type: string }
        prefix: { type: string, description: "Every object below this path prefix." }
        pattern: { $ref: "#/components/schemas/KeyPattern" }
        concurrency: { type: integer, minimum: 0, description: "Parallel reads (default 4)." }
        bandwidth: { $ref: "#/components/schemas/CacheSize" }
    CacheWarmJob:
      type: object
      required: [id, request, createdAt, state, nodes]
      properties:
        id: { type: string }
        request:
          allOf:
            - $ref: "#/components/schemas/CacheWarmRequest"
            - type: object
              properties:
                distribution: { type: string }
                actor: { type: string }
        createdAt: { type: string, format: date-time }
        state: { type: string, enum: [running, completed, failed] }
        nodes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CacheNodeStatus"
              - type: object
                required: [total, done, failed, bytes]
                properties:
                  total: { type: integer }
                  done: { type: integer }
                  failed: { type: integer }
                  bytes: { type: integer }
    CacheInspection:
      type: object
      required: [url, host, path, bypass, policy, mode, nodes]
      properties:
        url: { type: string }
        distribution: { type: string }
        host: { type: string }
        path: { type: string }
        bucket: { type: string }
        key: { type: string, description: "The object the URL maps to." }
        cacheKey: { type: string }
        bypass: { type: boolean }
        reason: { type: string, description: "Why the cache is bypassed (redirection, refusal, method, credentials, disabled cache...)." }
        policy: { $ref: "#/components/schemas/CacheEffectivePolicy" }
        mode: { $ref: "#/components/schemas/CacheMode" }
        nodes:
          type: array
          items:
            type: object
            required: [node, online, entry]
            properties:
              node: { type: string }
              online: { type: boolean }
              owner: { type: boolean, description: "The owner of the key (shared mode)." }
              error: { type: string }
              entry:
                type: object
                required: [key, present, ageSeconds, expiresInSeconds, sizeBytes, encodings]
                properties:
                  key: { type: string }
                  present: { type: boolean }
                  tier: { type: string, enum: [memory, disk] }
                  kind: { type: string, enum: [object, head, info, negative, pass] }
                  ageSeconds: { type: integer }
                  expiresInSeconds: { type: integer, description: "Negative once stale." }
                  stale: { type: boolean }
                  sizeBytes: { type: integer }
                  etag: { type: string }
                  encodings:
                    type: array
                    items: { type: string }
                  blocks: { type: integer }
    CacheCounters:
      type: object
      required: [requests, bytesCache, bytesOrigin, hitRatio]
      properties:
        requests:
          type: object
          description: Answers by X-Cache value (HIT, MISS, STALE, BYPASS, EXPIRED, REVALIDATED).
          additionalProperties: { type: integer }
        bytesCache: { type: integer }
        bytesOrigin: { type: integer }
        hitRatio: { type: number, description: "Share of the cacheable requests served from the cache (HIT, STALE, REVALIDATED)." }
    CacheHostStats:
      allOf:
        - $ref: "#/components/schemas/CacheCounters"
        - type: object
          required: [distribution, host, entries, memoryBytes, diskBytes]
          properties:
            distribution: { type: string }
            host: { type: string }
            entries: { type: integer }
            memoryBytes: { type: integer }
            diskBytes: { type: integer }
    CacheObjectStat:
      type: object
      required: [distribution, host, path, requests, misses]
      properties:
        distribution: { type: string }
        host: { type: string }
        path: { type: string }
        requests: { type: integer }
        misses: { type: integer }
    CacheNodeStats:
      allOf:
        - $ref: "#/components/schemas/CacheCounters"
        - type: object
          required: [node, online, mode, entries, memoryBytes, memoryLimitBytes, diskBytes, diskLimitBytes, evictions, invalidations, flushes, synced, originReads, webhookQueue, hosts, topObjects, topMisses]
          properties:
            node: { type: string }
            online: { type: boolean }
            mode: { $ref: "#/components/schemas/CacheMode" }
            entries: { type: integer }
            memoryBytes: { type: integer }
            memoryLimitBytes: { type: integer }
            diskBytes: { type: integer }
            diskLimitBytes: { type: integer }
            evictions: { type: integer }
            invalidations: { type: integer }
            flushes: { type: integer }
            synced: { type: boolean, description: "The node receives the invalidations of every peer." }
            originReads: { type: integer }
            webhookQueue: { type: integer }
            hosts:
              type: array
              items: { $ref: "#/components/schemas/CacheHostStats" }
            topObjects:
              type: array
              items: { $ref: "#/components/schemas/CacheObjectStat" }
            topMisses:
              type: array
              items: { $ref: "#/components/schemas/CacheObjectStat" }
            error: { type: string }
    CacheStats:
      description: The statistics of the cluster (summed over the nodes) and of every node.
      allOf:
        - $ref: "#/components/schemas/CacheCounters"
        - type: object
          required: [entries, memoryBytes, diskBytes, hosts, topObjects, topMisses, nodes]
          properties:
            entries: { type: integer }
            memoryBytes: { type: integer }
            diskBytes: { type: integer }
            hosts:
              type: array
              items: { $ref: "#/components/schemas/CacheHostStats" }
            topObjects:
              type: array
              items: { $ref: "#/components/schemas/CacheObjectStat" }
            topMisses:
              type: array
              items: { $ref: "#/components/schemas/CacheObjectStat" }
            nodes:
              type: array
              items: { $ref: "#/components/schemas/CacheNodeStats" }
    SpeedtestRequest:
      type: object
      properties:
        size: { type: integer, minimum: 1, maximum: 67108864, description: "Size of each file or object (default 4 MiB)." }
        durationSeconds: { type: number, minimum: 0.1, maximum: 60, description: "Duration of each phase (default 5)." }
        concurrency: { type: integer, minimum: 1, maximum: 64, description: "Concurrency of the object test and of the reads of the net test (default 8)." }
    SpeedtestMeasure:
      type: object
      required: [bytes, operations, elapsedSeconds, bytesPerSecond, operationsPerSecond, latencyP50Ms, latencyP99Ms]
      properties:
        bytes: { type: integer }
        operations: { type: integer }
        elapsedSeconds: { type: number }
        bytesPerSecond: { type: number }
        operationsPerSecond: { type: number }
        latencyP50Ms: { type: number }
        latencyP99Ms: { type: number }
    SpeedtestTarget:
      type: object
      required: [target, write, read]
      properties:
        target: { type: string, description: "A drive, a peer node, or objects." }
        write: { $ref: "#/components/schemas/SpeedtestMeasure" }
        read: { $ref: "#/components/schemas/SpeedtestMeasure" }
        error: { type: string }
    SpeedtestResult:
      type: object
      required: [kind, node, size, durationSeconds, concurrency, targets]
      properties:
        kind: { type: string, enum: [drive, object, net] }
        node: { type: string }
        size: { type: integer }
        durationSeconds: { type: number }
        concurrency: { type: integer }
        targets:
          type: array
          items: { $ref: "#/components/schemas/SpeedtestTarget" }
