        - { name: partNumberMarker, in: query, description: The parts after this number., schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The attributes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectAttributes" }
        default: { $ref: "#/components/responses/Problem" }
