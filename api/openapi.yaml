      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectEntry" }
        "413": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
