        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionList" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/folder:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [objects]
      operationId: createFolder
      summary: Create a folder (the empty object "prefix/")
      x-nexo-actions: ["s3:PutObject"]
      x-nexo-authorized-by: service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FolderRequest" }
      responses:
        "201":
          description: The folder object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectEntry" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/restore:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [objects]
      operationId: restoreObjectVersion
      summary: Make a previous version the latest again (copy of the version onto its key)
      description: |
        Copies the version onto its own key with its content, metadata and tags: a new latest
        version is created and the history is kept. Authorized like the S3 CopyObject it stands
        for: s3:GetObjectVersion on the version (`s3:versionid` condition) and s3:PutObject on
        the key. A delete marker cannot be restored (405).
      x-nexo-actions: ["s3:GetObjectVersion", "s3:PutObject"]
      x-nexo-authorized-by: service
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: versionId, in: query, required: true, schema: { type: string } }
      responses:
        "201":
          description: The new latest version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectEntry" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "405": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/rename:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [objects]
      operationId: renameObjects
      summary: Move an object, or every object under a prefix (copy then delete)
      description: |
        Moving a prefix needs s3:ListBucket on the source prefix (`s3:prefix` condition): otherwise the
        whole request is denied before moving anything.
      x-nexo-actions: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"]
      x-nexo-authorized-by: service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameRequest" }
      responses:
        "200":
          description: The result of every object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenameResult" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/tags:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    put:
      tags: [objects]
      operationId: setObjectTags
      summary: Replace the tags of an object (version); an empty set removes them
      x-nexo-actions: ["s3:PutObjectTagging", "s3:PutObjectVersionTagging"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Tags" }
      responses:
        "200":
          description: The tags.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tags" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/download:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: downloadObject
      summary: Download an object (Content-Disposition attachment, Range supported)
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: The object.
          content:
            "*/*": {}
        "206":
          description: A range of the object.
          content:
            "*/*": {}
        "304": { description: Not modified. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/preview:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: previewObject
      summary: Preview an object
      description: |
        Inline only for types that cannot run scripts in the console origin (raster
        images, PDF, text/plain, JSON, audio, video), with a sandboxing
        Content-Security-Policy; everything else (SVG, HTML, XML...) is served as an
        `application/octet-stream` attachment.
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: The object.
          content:
            "*/*": {}
        "206":
          description: A range of the object.
          content:
            "*/*": {}
        "304": { description: Not modified. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/master.m3u8:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: hlsMasterPlaylist
      summary: HLS master playlist of a video
      description: |
        The HLS presentation of an MP4 video (H.264 or H.265, optional AAC audio), packaged on
        the fly without transcoding: the playlists and segments reference each other with relative
        URIs pinned to the ETag of the object. Fragmented MP4 and SSE-C objects are refused.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: HLS master playlist of a video.
          content:
            "application/vnd.apple.mpegurl":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/media.m3u8:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: hlsMediaPlaylist
      summary: HLS media playlist of a video
      description: |
        The segments of the presentation (VOD).
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: rev, in: query, required: true, description: The ETag the presentation is pinned to (412 once the object changed)., schema: { type: string } }
        - { name: r, in: query, required: false, description: "A rendition of the media worker (720p, 480p...): the presentation of that rendition, rev being its ETag.", schema: { type: string } }
      responses:
        "200":
          description: HLS media playlist of a video.
          content:
            "application/vnd.apple.mpegurl":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/init.mp4:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: hlsInitSegment
      summary: HLS init segment of a video
      description: |
        The fMP4 initialization segment.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: rev, in: query, required: true, description: The ETag the presentation is pinned to (412 once the object changed)., schema: { type: string } }
        - { name: r, in: query, required: false, description: "A rendition of the media worker (720p, 480p...): the presentation of that rendition, rev being its ETag.", schema: { type: string } }
      responses:
        "200":
          description: HLS init segment of a video.
          content:
            "video/mp4":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/segment.m4s:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: hlsMediaSegment
      summary: HLS media segment of a video
      description: |
        One fMP4 media segment, numbered from 0.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: rev, in: query, required: true, description: The ETag the presentation is pinned to (412 once the object changed)., schema: { type: string } }
        - { name: r, in: query, required: false, description: "A rendition of the media worker (720p, 480p...): the presentation of that rendition, rev being its ETag.", schema: { type: string } }
        - { name: n, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: HLS media segment of a video.
          content:
            "video/iso.segment":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/poster.jpg:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: mediaPoster
      summary: Poster frame of a video
      description: The JPEG poster the media worker derived from the current content of the video (404 otherwise).
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The poster.
          content:
            "image/jpeg":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/sprite.jpg:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: mediaThumbnailSprite
      summary: Timeline thumbnails of a video
      description: The JPEG grid of thumbnails the media worker derived from the current content of the video, mapped by thumbnails.vtt.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The sprite.
          content:
            "image/jpeg":
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/thumbnails.vtt:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: mediaThumbnails
      summary: WebVTT map of the timeline thumbnails
      description: One cue per thumbnail, pointing to its tile of sprite.jpg (`#xywh=x,y,w,h`).
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The WebVTT map.
          content:
            "text/vtt":
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/subtitles.m3u8:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
      - { $ref: "#/components/parameters/subtitleLang" }
    get:
      tags: [objects]
      operationId: mediaSubtitlePlaylist
      summary: HLS playlist of the subtitles of a language
      description: |
        A subtitle rendition of the master playlist (`EXT-X-MEDIA TYPE=SUBTITLES`): one WebVTT
        segment spanning the video. 404 when the video has no current track of that language.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The playlist.
          content:
            "application/vnd.apple.mpegurl":
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/hls/subtitles.vtt:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
      - { $ref: "#/components/parameters/subtitleLang" }
    get:
      tags: [objects]
      operationId: mediaSubtitleFile
      summary: WebVTT of the subtitles of a language
      description: The segment of the subtitle playlist, anchored with `X-TIMESTAMP-MAP` at the start of the video.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The WebVTT.
          content:
            "text/vtt":
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/image:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: mediaImage
      summary: A variant of an image
      description: |
        A variant of an image the media worker derived from the current content of the object (an
        image rule; 404 until the worker produced them, and once the object changed until it produces
        them again). `format=auto` (the default) serves the most compact format the client accepts
        among those produced, in the order AVIF, WebP, JPEG, PNG: AVIF and WebP only when the Accept
        header names them, PNG only when asked (Accept or format) or when the image has no JPEG
        variant; the response then varies on Accept. `w` serves the narrowest variant at least `w`
        pixels wide (else the widest); without it, the image at its own size. Ranges and
        conditional requests are answered (ETag and Last-Modified name the variant).
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: w, in: query, required: false, description: "The width the client displays, in pixels.", schema: { type: integer, minimum: 0 } }
        - name: format
          in: query
          required: false
          description: auto (default) or a format (jpg is jpeg).
          schema: { type: string, enum: [auto, avif, webp, jpeg, jpg, png] }
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The variant.
          headers:
            ETag: { schema: { type: string } }
            Vary: { schema: { type: string }, description: Accept with format auto. }
          content:
            "image/*":
              schema: { type: string, format: binary }
        "206":
          description: A range of the variant.
          content:
            "image/*":
              schema: { type: string, format: binary }
        "304": { description: Not modified. }
        default: { $ref: "#/components/responses/Problem" }
    head:
      tags: [objects]
      operationId: mediaImageHead
      summary: The headers of a variant of an image
      description: |
        The headers GET would answer for the same variant (Content-Type, Content-Length, ETag,
        Last-Modified, Vary), without the body: a client checks that a variant exists, or its size,
        before downloading it.
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: w, in: query, required: false, description: "The width the client displays, in pixels.", schema: { type: integer, minimum: 0 } }
        - name: format
          in: query
          required: false
          description: auto (default) or a format (jpg is jpeg).
          schema: { type: string, enum: [auto, avif, webp, jpeg, jpg, png] }
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The variant exists.
          headers:
            ETag: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Vary: { schema: { type: string }, description: Accept with format auto. }
        "206": { description: A range of the variant. }
        "304": { description: Not modified. }
        default: { description: "The error (no body: 404 when the worker produced no variant from the current content)." }
  /buckets/{bucket}/objects/media/status:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: mediaStatus
      summary: Processing state of a video or an image by the media worker
      description: |
        The status.json of the version written by the worker: `none` when it never processed it.
        `current` is false when the outputs derive from an older content of the version. The
        variants of an image carry their URL (GET /buckets/{bucket}/objects/image).
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/subtitles:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: listSubtitles
      summary: Subtitle tracks of a video
      description: |
        The tracks that apply to the current content of the version: the manual ones (uploaded or
        edited) and the automatic ones the media worker transcribed or translated from this
        content. The master playlist lists the same tracks.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      responses:
        "200":
          description: The tracks, by language.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subtitles" }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/subtitles/{lang}:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
      - name: lang
        in: path
        required: true
        description: BCP 47 language tag (it, en, pt-BR...).
        schema: { type: string }
    get:
      tags: [objects]
      operationId: getSubtitles
      summary: Cues of a subtitle track
      description: The track and its cues; `format=vtt` or `format=srt` downloads the document instead.
      x-nexo-actions: ["nexo:GetMediaStream", "s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, vtt, srt], default: json }
      responses:
        "200":
          description: The track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubtitleCues" }
            "text/vtt":
              schema: { type: string }
            "application/x-subrip":
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [objects]
      operationId: putSubtitles
      summary: Upload or edit a subtitle track
      description: |
        Stores the cues as a manual track of the version, replacing the track of that language (an
        automatic one too: the media worker then leaves it alone). The body is a JSON list of cues,
        or a WebVTT or SubRip document (any other content type, at most 2 MiB). The text of the
        cues is sanitized: only the WebVTT tags b, i, u, c, v, lang and ruby are kept.
      x-nexo-actions: ["s3:PutObject"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubtitleCuesRequest" }
          "text/vtt":
            schema: { type: string }
          "application/x-subrip":
            schema: { type: string }
      responses:
        "200":
          description: The stored track.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubtitleTrack" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [objects]
      operationId: deleteSubtitles
      summary: Remove a subtitle track
      description: An automatic track comes back when the media worker processes the video again.
      x-nexo-actions: ["s3:PutObject"]
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/download-zip:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [objects]
      operationId: downloadZip
      summary: Zip archive of objects and prefixes, streamed
      description: |
        Names are relative to `base`. Explicit keys are checked before streaming; every prefix
        needs s3:ListBucket (`s3:prefix` condition), otherwise the request is denied before
        streaming. Objects of the prefixes the caller may not read are listed in `nexo-zip-errors.txt`.
        The console submits the request as a form (`application/x-www-form-urlencoded`: the JSON
        `ZipRequest` in the field `request`, the CSRF token in the field `csrfToken`) so that the
        browser streams the archive to disk instead of holding it in memory. This is the only
        operation that reads the CSRF token from a form field; the request must still come from
        the console origin.
      x-nexo-actions: ["s3:GetObject", "s3:ListBucket"]
      x-nexo-authorized-by: service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZipRequest" }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  type: string
                  description: The ZipRequest as a JSON document.
                csrfToken:
                  type: string
                  description: The CSRF token of the console session (instead of the X-CSRF-Token header).
                downloadToken:
                  type: string
                  pattern: "^[A-Za-z0-9]{16,64}$"
                  description: >-
                    Set by the console to learn that the archive started: the answer then sets the
                    cookie `nexo_dl_<downloadToken>` (a download never loads the frame of the form).
      responses:
        "200":
          description: The archive.
          content:
            application/zip: {}
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/upload:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
    post:
      tags: [uploads]
      operationId: uploadObject
      summary: Upload a small object in one request (raw body, streamed)
      description: |
        The body is the content; its Content-Type is stored. Larger files use the
        multipart endpoints (limit: 64 MiB by default, 413 entity_too_large beyond).
        The policies see the condition values of the equivalent S3 PutObject
        (s3:x-amz-tagging, s3:RequestObjectTag/<key>, s3:x-amz-server-side-encryption*).
      x-nexo-actions: ["s3:PutObject"]
      parameters:
        - { $ref: "#/components/parameters/tagging" }
        - { $ref: "#/components/parameters/sse" }
        - { $ref: "#/components/parameters/sseKmsKeyId" }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
