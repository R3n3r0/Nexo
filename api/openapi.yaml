      summary: Download an object (Content-Disposition attachment, Range supported)
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: The object.
          content:
            "*/*": {}
        "206":
          description: A range of the object.
          content:
            "*/*": {}
        "304": { description: Not modified. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/preview:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
      - { $ref: "#/components/parameters/key" }
      - { $ref: "#/components/parameters/versionId" }
    get:
      tags: [objects]
      operationId: previewObject
      summary: Preview an object
      description: |
        Inline only for types that cannot run scripts in the console origin (raster
        images, PDF, text/plain, JSON, audio, video), with a sandboxing
        Content-Security-Policy; everything else (SVG, HTML, XML...) is served as an
        `application/octet-stream` attachment.
      x-nexo-actions: ["s3:GetObject", "s3:GetObjectVersion"]
      parameters:
        - { name: Range, in: header, schema: { type: string } }
      responses:
        "200":
          description: The object.
          content:
            "*/*": {}
        "206":
          description: A range of the object.
          content:
            "*/*": {}
        "304": { description: Not modified. }
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/download-zip:
    parameters:
      - { $ref: "#/components/parameters/bucket" }
    post:
      tags: [objects]
      operationId: downloadZip
      summary: Zip archive of objects and prefixes, streamed
      description: |
        Names are relative to `base`. Explicit keys are checked before streaming; every prefix
        needs s3:ListBucket (`s3:prefix` condition), otherwise the request is denied before
        streaming. Objects of the prefixes the caller may not read are listed in `nexo-zip-errors.txt`.
        The console submits the request as a form (`application/x-www-form-urlencoded`: the JSON
        `ZipRequest` in the field `request`, the CSRF token in the field `csrfToken`) so that the
        browser streams the archive to disk instead of holding it in memory.
      x-nexo-actions: ["s3:GetObject", "s3:ListBucket"]
      x-nexo-authorized-by: service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZipRequest" }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  type: string
                  description: The ZipRequest as a JSON document.
                csrfToken:
                  type: string
                  description: The CSRF token of the console session (instead of the X-CSRF-Token header).
                downloadToken:
                  type: string
                  pattern: "^[A-Za-z0-9]{16,64}$"
                  description: >-
                    Set by the console to learn that the archive started: the answer then sets the
                    cookie `nexo_dl_<downloadToken>` (a download never loads the frame of the form).
      responses:
        "200":
          description: The archive.
          content:
            application/zip: {}
        default: { $ref: "#/components/responses/Problem" }
  /buckets/{bucket}/objects/upload:
    parameters:
