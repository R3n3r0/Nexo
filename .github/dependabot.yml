# Dependabot: Go modules, npm (web console), Docker base images, GitHub Actions.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(go)"
    labels: ["dependencies", "go"]
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
      aws-sdk:
        patterns: ["github.com/aws/*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(web)"
    labels: ["dependencies", "web"]
    groups:
      mantine:
        patterns: ["@mantine/*"]
      react:
        patterns: ["react", "react-dom", "react-router", "@types/react", "@types/react-dom"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "msw", "jsdom"]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "prettier"]
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    commit-message:
      prefix: "deps(docker)"
    labels: ["dependencies", "docker"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    commit-message:
      prefix: "deps(actions)"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
