name: Release

# Release of a v* tag (docs/08 §8.7, T-9.5):
#   1. goreleaser: binaries (console embedded), archives, deb/rpm, checksums
#      signed with cosign keyless, SBOMs, multi-arch images on Docker Hub
#      (docker.io/<namespace>/nexo, .../nexoctl and .../nexo-media-worker)
#      with SBOM and provenance attestations, signed; Homebrew casks; GitHub
#      release;
#   2. verify (TM-11): signatures of checksums.txt and of the images, SBOM
#      attestation, trivy scan without High/Critical vulnerabilities;
#   3. smoke (TM-10): the binaries of every OS/arch start (QEMU for
#      linux/arm64, Rosetta for darwin/amd64) and report the tag as version
#      (the media worker too, except on linux/arm64: it needs the dynamic
#      loader of the platform, which QEMU user emulation lacks);
#   4. helm: chart packaged with the version of the tag, signed with cosign
#      keyless (sign-blob bundle) and attached to the GitHub release
#      (helm install nexo <release URL of nexo-X.Y.Z.tgz>);
#   5. dockerhub-description: README and short description of the Docker Hub
#      repositories (deploy/docker/DOCKERHUB.md, DOCKERHUB.media-worker.md).
#
# Images are published only on Docker Hub. Required: the secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (access token with Read, Write,
# Delete scope; the goreleaser job fails early without them). The namespace
# is the repository variable DOCKERHUB_NAMESPACE, default paolor; the public
# repositories <namespace>/nexo, <namespace>/nexoctl and
# <namespace>/nexo-media-worker must exist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # Pinned release tools (same versions as the Makefile).
  GORELEASER_VERSION: v2.18.3
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: v1.54.1
  HELM_VERSION: v3.22.0
  # Identity of the keyless signatures made by this workflow (compared
  # exactly by cosign: the repository as GitHub spells it).
  CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
  CERT_ISSUER: https://token.actions.githubusercontent.com
  # Docker Hub namespace of the images (repository variable, default
  # paolor); read by .goreleaser.yaml, lowercased where used.
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'paolor' }}

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # GitHub release and assets
      id-token: write   # cosign keyless signing (Sigstore, GitHub OIDC)
    steps:
      # Fail early with a clear message when the Docker Hub credentials are
      # missing, before building anything.
      - name: Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required to publish the images on Docker Hub (docs/08 §8.7)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history and tags for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # docs/06 §6.8: a P0/P1 feature of the catalog without a test, a tag
      # naming a code outside the catalog or a stale test/TRACEABILITY.md
      # stops the release.
      - name: Traceability matrix
        run: make traceability-check

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The console is embedded into nexo (-tags embedui): build it first.
      - name: Build web console
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      # buildx builds both platforms from the compiled binaries (no RUN in
      # the target platform), QEMU only for safety.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64

      - uses: docker/setup-buildx-action@v4

      # buildx and cosign both use this login (the signatures are pushed
      # next to the docker.io images).
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token allowed to push to r3n3r0/homebrew-tap; the casks are
          # skipped without it.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # DOCKERHUB_NAMESPACE (workflow env): namespace of the images.

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.json
            dist/*.txt
            dist/*.sigstore.json
            dist/homebrew/Casks/*.rb
          if-no-files-found: ignore
          retention-days: 14

  verify:
    # TM-11: everything published can be verified by a user, and the images
    # have no High/Critical vulnerability with a fix available.
    name: Verify signatures, SBOM, vulnerabilities
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Pulls from Docker Hub are rate limited for anonymous clients.
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: checksums.txt signature and checksums
        working-directory: dist
        run: |
          set -eux
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER"
          sha256sum --ignore-missing -c checksums.txt

      # docker.io/<namespace>, lowercase as in .goreleaser.yaml.
      - name: Registry
        run: echo "REGISTRY=docker.io/$(echo "$DOCKERHUB_NAMESPACE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image signatures and SBOM attestations
        run: |
          set -eux
          for image in nexo nexoctl nexo-media-worker; do
            ref="${REGISTRY}/${image}:${GITHUB_REF_NAME}"
            cosign verify "$ref" --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER" >/dev/null
            docker buildx imagetools inspect "$ref"
            # One SPDX document per platform, attached by BuildKit.
            docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' | grep -q '"SPDX'
          done

      - name: Vulnerability scan of the images (High/Critical with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/nexo:${{ github.ref_name }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The worker image has a glibc base (distroless/cc) of its own.
      - name: Vulnerability scan of the media worker image (High/Critical with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/nexo-media-worker:${{ github.ref_name }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  smoke:
    # TM-10: the binaries of the release archives start on every OS/arch and
    # report the tag (packaging/smoke.sh: version, dry run, server, S3 round
    # trip with nexoctl, SIGTERM; Windows stops after the dry run).
    name: Smoke ${{ matrix.platform }}
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux_amd64}
          - {os: ubuntu-latest, platform: linux_arm64, runner: qemu-aarch64-static}
          - {os: macos-latest, platform: darwin_arm64}
          - {os: macos-latest, platform: darwin_amd64, runner: arch -x86_64}
          - {os: windows-latest, platform: windows_amd64, quick: "1"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: QEMU user emulation
        if: matrix.runner == 'qemu-aarch64-static'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static

      - name: Rosetta
        if: matrix.platform == 'darwin_amd64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Extract the archives
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          # Each archive in its own directory, the binaries next to each
          # other in smoke/ (an extraction directory named smoke/nexo would
          # shadow the nexo binary).
          mkdir -p smoke extract
          for name in nexo nexoctl; do
            archive="dist/${name}_${version}_${{ matrix.platform }}"
            if [ -f "$archive.zip" ]; then
              unzip -o -q "$archive.zip" -d "extract/$name"
            else
              mkdir -p "extract/$name" && tar -xzf "$archive.tar.gz" -C "extract/$name"
            fi
            cp extract/$name/$name extract/$name/$name.exe smoke/ 2>/dev/null || true
            test -f "smoke/$name" || test -f "smoke/$name.exe"
          done
          ls -la smoke

      - name: packaging/smoke.sh
        env:
          RUNNER: ${{ matrix.runner }}
          SMOKE_QUICK: ${{ matrix.quick }}
        run: sh packaging/smoke.sh smoke "$GITHUB_REF_NAME"

      # The media worker reports the tag. Not under QEMU user emulation: the
      # binary needs the dynamic loader of linux/arm64 (OpenH264 is loaded
      # with dlopen), absent from the amd64 runner.
      - name: Media worker version
        if: matrix.runner != 'qemu-aarch64-static'
        env:
          RUNNER: ${{ matrix.runner }}
        run: |
          set -eux
          archive="dist/nexo-media-worker_${GITHUB_REF_NAME#v}_${{ matrix.platform }}"
          mkdir -p extract/nexo-media-worker
          if [ -f "$archive.zip" ]; then
            unzip -o -q "$archive.zip" -d extract/nexo-media-worker
            bin=extract/nexo-media-worker/nexo-media-worker.exe
          else
            tar -xzf "$archive.tar.gz" -C extract/nexo-media-worker
            bin=extract/nexo-media-worker/nexo-media-worker
            test -f extract/nexo-media-worker/systemd/nexo-media-worker.service
          fi
          # shellcheck disable=SC2086 # RUNNER is a command with its arguments
          $RUNNER "$bin" version | tee version.txt
          grep -q "nexo-media-worker ${GITHUB_REF_NAME}" version.txt

  helm:
    name: Helm chart
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # attach the chart to the release
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The chart is not pushed to an OCI registry: on Docker Hub
      # `helm push` would store chart "nexo" in the repository
      # <namespace>/nexo, the one of the server image. It is attached to the
      # release with a Sigstore bundle instead.
      - name: Package, sign and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          helm lint --strict deploy/helm/nexo
          helm package deploy/helm/nexo --version "$version" --app-version "$GITHUB_REF_NAME" -d chart
          chart="chart/nexo-${version}.tgz"
          cosign sign-blob --yes --bundle "${chart}.sigstore.json" "$chart"
          cosign verify-blob "$chart" --bundle "${chart}.sigstore.json" \
            --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER"
          gh release upload "$GITHUB_REF_NAME" "$chart" "${chart}.sigstore.json" --clobber

  dockerhub-description:
    # README (deploy/docker/DOCKERHUB.md) and short description of the Docker
    # Hub repositories. The token needs the Read, Write, Delete scope; for an
    # organization namespace the user must be an admin of the repositories.
    name: Docker Hub description ${{ matrix.image }}
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nexo
            description: S3-compatible object storage server with an embedded web console
            readme: DOCKERHUB.md
            title: "# Nexo"
          - image: nexoctl
            description: Command-line client of Nexo, the S3-compatible object storage server
            readme: DOCKERHUB.md
            title: "# Nexo"
          - image: nexo-media-worker
            description: Media worker of Nexo - video renditions, posters, thumbnails and image variants
            readme: DOCKERHUB.media-worker.md
            title: "# Nexo media worker"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/docker

      # The repository name, and the README with the image names of the
      # configured namespace and without its leading maintainer comment.
      - name: Repository name and README
        id: repo
        env:
          IMAGE: ${{ matrix.image }}
          README: ${{ matrix.readme }}
          TITLE: ${{ matrix.title }}
        run: |
          set -eu
          namespace="$(echo "$DOCKERHUB_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          echo "name=${namespace}/${IMAGE}" >> "$GITHUB_OUTPUT"
          sed -e '1,/^-->$/d' -e "s#docker\.io/paolor/#docker.io/${namespace}/#g" \
            "deploy/docker/$README" > "$RUNNER_TEMP/DOCKERHUB.md"
          grep -qx "$TITLE" "$RUNNER_TEMP/DOCKERHUB.md"
          echo "readme=$RUNNER_TEMP/DOCKERHUB.md" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.repo.outputs.name }}
          short-description: ${{ matrix.description }}
          readme-filepath: ${{ steps.repo.outputs.readme }}
