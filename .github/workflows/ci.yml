name: CI

# Pipeline of docs/06 §6.1: every pull request runs the lint, the unit
# tests, the integration suite and the CLI scripts in every deployment mode
# (SNSD, SNMD, cluster in-process; docs/08 §8.6 TM-01, TM-02), the
# Playwright suite against bin/nexo in every mode (single drive, 4 drives,
# 4 processes), Nexo behind two edge proxies (test/proxy), the image
# smoke tests, the security scans (govulncheck, gosec, npm audit) and the
# packaging (GoReleaser snapshot, deb/rpm installed, Helm chart, systemd
# unit, Dockerfiles; the release itself is release.yml); a
# merge on main adds the multi-process cluster smoke; the nightly run adds
# the whole cluster suite (TC-*), the slow integration tests, the internode
# RPC benchmarks, the fuzzing of every fuzz target and the Ceph s3-tests
# compatibility suite.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GOLANGCI_LINT_VERSION: v2.14.0
  # The security scanners (make security, docs/security).
  GOVULNCHECK_VERSION: v1.8.0
  GOSEC_VERSION: v2.29.0

jobs:
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy is a no-op
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)

      - name: gofmt
        run: |
          out="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$out" ]; then
            echo "files need gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          # The test hooks of bin/nexo and the multi-process cluster tests.
          go vet -tags nexotest ./cmd/nexo
          go vet -tags cluster ./test/cluster/...
          go vet -tags compose ./test/compose/...
          go vet -tags proxy ./test/proxy/...
          go vet -tags upgrade ./test/upgrade/...

      - name: traceability matrix (docs/06 §6.8)
        run: make traceability-check

      - name: go generate is a no-op (mocks are up to date)
        run: |
          go generate ./...
          git diff --exit-code -- '*.go' || { echo "generated mocks are stale: run go generate ./..."; exit 1; }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  security:
    # docs/security: the known vulnerabilities the code reaches, in the
    # modules and in the standard library of the toolchain of go.mod
    # (govulncheck), insecure code (gosec: a false positive carries a
    # "#nosec Gxxx -- reason" next to it) and the production dependencies
    # of the dashboard (npm audit).
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: gosec
        env:
          # gosec needs a newer toolchain than go.mod: the go command
          # downloads it.
          GOTOOLCHAIN: auto
        run: go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }} -quiet -exclude-dir=web ./...

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (production dependencies of the dashboard)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate

  test-go:
    name: Test Go (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        env:
          CGO_ENABLED: "1"
        # The integration suite and the CLI scripts run per mode below.
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v -e '/test/cli$' -e '/test/integration$')
          go test -race -count=1 -shuffle=on -coverprofile=coverage.txt -covermode=atomic "${pkgs[@]}"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            go tool cover -func=coverage.txt | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-go
          path: coverage.txt
          if-no-files-found: ignore
          retention-days: 14

  test-modes:
    # TM-01 and TM-02: the S3/IAM/presigned integration suite and the CLI
    # end-to-end scripts (testscript) in every deployment mode, the
    # deployments started in the test process.
    name: Test ${{ matrix.mode }} (integration, CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: snsd
            integration: -skip '^TestDeploymentModes$'
            cli: -skip '^TestScripts$/^(snmd|cluster)_'
          - mode: snmd
            integration: -run '^TestDeploymentModes$/^snmd$'
            cli: -run '^TestScripts$/^snmd_'
          - mode: cluster
            integration: -run '^TestDeploymentModes$/^cluster$'
            # Every script of a single drive runs on the cluster too
            # (NEXO_CLI_MODE), with the cluster_* ones.
            cli: -skip '^TestScripts$/^snmd_'
            cliMode: cluster
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration suite (test/integration)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ${{ matrix.integration }} ./test/integration/...

      - name: CLI end-to-end (testscript, test/cli)
        env:
          CGO_ENABLED: "1"
          NEXO_CLI_MODE: ${{ matrix.cliMode }}
        run: go test -race -count=1 ${{ matrix.cli }} ./test/cli/...

  proxy:
    # docs/10 §10.6 TCD-01..03, docs/11 TCC-C-05, docs/09 TPS-19 on the
    # custom domains: Nexo behind two edge proxies with their own domains
    # and origin secrets (test/proxy, build tag "proxy"). In-process Go
    # proxies (X-Forwarded-* and PROXY protocol v2) in every mode, then the
    # real nginx and HAProxy running the files of
    # deploy/docker/compose.multi-proxy.yml in front of a 4-node cluster.
    name: Proxies (TCD-01..03, TCC-C-05)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nginx and HAProxy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx haproxy
          # The tests start their own processes with their own files.
          sudo systemctl stop nginx haproxy || true
          nginx -v
          haproxy -v | head -n 1

      - name: make test-proxy
        env:
          # The real proxies are required here: a missing binary fails.
          NEXO_PROXY_REAL: "1"
        run: make test-proxy

  web:
    name: Web console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/services/http/schema.d.ts || { echo "schema.d.ts is stale: run npm run gen:api"; exit 1; }

      - name: Unit tests
        run: npm test -- --run --coverage

      - name: Build
        run: npm run build

      - name: Bundle size budget (initial bundle <= 300 KiB gzip, docs/06 §6.5)
        run: npm run size

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: web/coverage
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build binaries (embedded UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [web]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build nexo and nexoctl
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/r3n3r0/nexo/internal/version.Version=${VERSION} \
            -X github.com/r3n3r0/nexo/internal/version.Commit=${COMMIT} \
            -X github.com/r3n3r0/nexo/internal/version.Date=${DATE}"
          go build -trimpath -tags embedui -ldflags "${LDFLAGS}" -o bin/nexo ./cmd/nexo
          go build -trimpath -ldflags "${LDFLAGS}" -o bin/nexoctl ./cmd/nexoctl
          ls -la bin/

      - name: Smoke test
        env:
          NEXO_ROOT_USER: admin
          NEXO_ROOT_PASSWORD: password123
        run: |
          ./bin/nexo version
          ./bin/nexo version --json
          ./bin/nexoctl version
          ./bin/nexo server --dry-run --address 127.0.0.1:0 --console-address 127.0.0.1:0 "$(mktemp -d)"

      - uses: actions/upload-artifact@v4
        with:
          name: nexo-linux-amd64
          path: bin/
          if-no-files-found: error
          retention-days: 7

  packaging:
    # T-9.5 (docs/08 §8.7): the whole release built without publishing
    # (GoReleaser snapshot: binaries for every OS/arch, archives, deb/rpm,
    # SBOMs, multi-arch images, Homebrew casks), TM-10 on linux/amd64 and
    # linux/arm64 (QEMU), the deb packages installed and the hardened unit
    # run by the systemd of the runner, the rpm packages installed in
    # Fedora, the Helm chart (lint, template, kubeconform), the systemd unit
    # (verify, security) and the Dockerfiles (hadolint).
    name: Packaging (GoReleaser snapshot, packages, Helm, systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [web]
    env:
      GORELEASER_VERSION: v2.18.3
      HELM_VERSION: v3.22.0
      KUBECONFORM_VERSION: v0.7.0
      SYFT_VERSION: v1.54.1
      HADOLINT_VERSION: v2.14.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser derives the snapshot version from the tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Tools (kubeconform, QEMU user emulation)
        run: |
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static

      - uses: docker/setup-buildx-action@v3

      - name: GoReleaser configuration
        run: goreleaser check

      - name: Dockerfiles (hadolint)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "hadolint/hadolint:${HADOLINT_VERSION}" hadolint \
            Dockerfile Dockerfile.nexoctl deploy/docker/Dockerfile.goreleaser deploy/docker/Dockerfile.nexoctl.goreleaser

      - name: Helm chart (lint, template, kubeconform)
        run: make helm-lint

      - name: Snapshot release (no publish, no signature)
        run: make release-snapshot RELEASE_SKIP=sign

      - name: Release artefacts
        run: |
          set -eux
          ls -la dist
          sha256sum --ignore-missing -c dist/checksums.txt
          for f in dist/*.tar.gz dist/*.zip; do test -f "$f.sbom.json"; done
          ls dist/homebrew/Casks/nexo.rb dist/homebrew/Casks/nexoctl.rb
          dpkg-deb -c dist/nexo_*_amd64.deb
          dpkg-deb -c dist/nexoctl_*_amd64.deb
          # The preinst creates the nexo user with useradd (passwd); the user
          # is declared for systemd-sysusers too.
          dpkg-deb -f dist/nexo_*_amd64.deb Pre-Depends | grep -qx passwd
          dpkg-deb -c dist/nexo_*_amd64.deb | grep -q ' ./usr/lib/sysusers.d/nexo.conf$'

      - name: TM-10 smoke (linux/amd64, linux/arm64 with QEMU)
        run: make release-smoke

      - name: Images built by GoReleaser
        run: |
          set -eux
          # docker.io/paolor/<name> (default DOCKERHUB_NAMESPACE), listed by
          # docker without the docker.io/ prefix.
          docker images 'paolor/*'
          for name in nexo nexoctl; do
            for arch in amd64 arm64; do
              img="$(docker images --format '{{.Repository}}:{{.Tag}}' "paolor/$name" | grep -- "-$arch\$" | head -1)"
              test -n "$img"
              test "$(docker image inspect -f '{{.Architecture}}' "$img")" = "$arch"
              test "$(docker image inspect -f '{{.Config.User}}' "$img")" = "65532:65532"
            done
            docker run --rm --platform linux/amd64 "$(docker images --format '{{.Repository}}:{{.Tag}}' "paolor/$name" | grep -- '-amd64$' | head -1)" version
          done

      - name: Image HEALTHCHECK with TLS (NEXO_CERTS_DIR)
        run: |
          set -eux
          img="$(docker images --format '{{.Repository}}:{{.Tag}}' paolor/nexo | grep -- '-amd64$' | head -1)"
          certs="$RUNNER_TEMP/certs"
          CERTS_DIR="$certs" sh deploy/docker/gen-dev-certs.sh
          # Readable by the nonroot user of the image only.
          sudo chown -R 65532:65532 "$certs"
          docker run -d --name nexo-tls -e NEXO_ROOT_USER=admin -e NEXO_ROOT_PASSWORD=ci-password-123 \
            -e NEXO_CERTS_DIR=/certs -v "$certs:/certs:ro" "$img"
          # The image HEALTHCHECK (nexo healthcheck) follows NEXO_CERTS_DIR:
          # https on the console, trusting /certs/public.crt and /certs/CAs.
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nexo-tls)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' nexo-tls | grep -qx healthy || { docker logs nexo-tls; exit 1; }
          docker exec nexo-tls /nexo healthcheck --ready
          docker rm -f nexo-tls

      - name: systemd unit (verify, security)
        run: packaging/systemd-verify.sh dist/nexo_linux_amd64_v1/nexo

      - name: deb packages with the systemd of the runner
        run: |
          set -eux
          sudo apt-get install -y ./dist/nexoctl_*_amd64.deb ./dist/nexo_*_amd64.deb
          getent passwd nexo
          test "$(sudo stat -c '%U:%G %a' /var/lib/nexo/data)" = "nexo:nexo 750"
          test "$(sudo stat -c '%U:%G %a' /etc/default/nexo)" = "root:nexo 640"
          # The root password is empty: the --dry-run pre-start check refuses to start.
          if sudo systemctl start nexo; then echo "started without a root password" >&2; exit 1; fi
          sudo sed -i 's/^NEXO_ROOT_PASSWORD=$/NEXO_ROOT_PASSWORD=ci-password-123/' /etc/default/nexo
          sudo systemctl reset-failed nexo
          sudo systemctl start nexo
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:9000/nexo/health/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:9000/nexo/health/ready
          export NEXOCTL_CONFIG_DIR="$RUNNER_TEMP/nexoctl"
          nexoctl alias set ci http://127.0.0.1:9000 admin ci-password-123
          nexoctl mb ci/packages
          nexoctl cp /etc/os-release ci/packages/os-release
          nexoctl cat ci/packages/os-release | cmp - /etc/os-release
          sudo systemctl reload nexo
          systemctl is-active nexo
          sudo systemctl stop nexo
          sudo apt-get remove -y nexo nexoctl
          # The data (the drive formatted by the service), the user and the
          # configuration survive the removal.
          test -n "$(sudo ls -A /var/lib/nexo/data)"
          getent passwd nexo
          sudo test -f /etc/default/nexo

      - name: Service logs
        if: failure()
        run: sudo journalctl -u nexo --no-pager -n 200 || true

      - name: rpm packages (Fedora)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:42 sh -euxc '
            dnf install -y -q /dist/nexoctl-*.x86_64.rpm /dist/nexo-*.x86_64.rpm
            getent passwd nexo
            rpm -V nexo nexoctl
            test "$(stat -c "%U:%G" /var/lib/nexo/data)" = "nexo:nexo"
            nexo version
            nexoctl version
            touch /var/lib/nexo/data/format.json
            dnf remove -y -q nexo nexoctl
            test -f /var/lib/nexo/data/format.json'

  e2e:
    # The Playwright projects of web/playwright.config.ts: the whole suite
    # on a single drive, TD-E-01..04 on one node with 4 drives (SNMD) and
    # TD-E-15 (cluster and healing pages) on 4 bin/nexo processes with a
    # node frozen and resumed.
    name: End-to-end ${{ matrix.project }} (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, snmd, cluster]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci + vite build + bin/nexo with the embedded dashboard.
      - name: make build
        run: make build

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: npm run e2e -- --project ${{ matrix.project }}
        working-directory: web
        env:
          CI: "true"
        run: npm run e2e -- --project ${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-cluster-nightly:
    # Nightly (TM-02): the whole Playwright suite of the single drive on
    # the cluster of 4 bin/nexo processes ("cluster-full"), then the
    # cluster scenario.
    name: End-to-end cluster-full (Playwright, Chromium, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: make build
        run: make build

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: npm run e2e -- --project cluster
        working-directory: web
        env:
          CI: "true"
          NEXO_E2E_CLUSTER_FULL: "1"
        run: npm run e2e -- --project cluster

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cluster-full
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  cluster-smoke:
    # Merge on main (docs/06 §6.1): a cluster of 4 bin/nexo processes,
    # consistency across the nodes and the server information.
    name: Cluster smoke (4 processes)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: TC-03, TC-04 and the server information of every node
        run: go test -tags cluster -count=1 -timeout 10m -v -run '^(TestTC03CrossNodeConsistency|TestTC04IdentityPropagation|TestServerInfoNodes)$' ./test/cluster/...

  cluster-nightly:
    # Nightly (docs/06 §6.1): the multi-process cluster tests (TC-*,
    # test/cluster, build tag "cluster").
    name: Cluster (4 processes, TC-*)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-cluster
        # shell: bash runs with pipefail: the status of make survives tee.
        shell: bash
        env:
          # TC-15: the soak under random chaos runs 10 minutes at night.
          NEXO_CLUSTER_SOAK: 10m
        run: make test-cluster 2>&1 | tee cluster-tests.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cluster-tests-log
          path: cluster-tests.log
          if-no-files-found: ignore
          retention-days: 14

  bench-nightly:
    # Nightly: the throughput of the internode storage RPC over loopback
    # against the local drive (docs/05 T-6.1 DoD: 1 GB/s between two
    # nodes, checked on the concurrent streams); the numbers are kept as
    # an artifact and in the job summary to follow the trend.
    name: Benchmarks (internode RPC)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make bench-rpc
        shell: bash
        run: make bench-rpc 2>&1 | tee bench-rpc.txt

      - name: DoD T-6.1 (internode throughput >= 1 GB/s)
        shell: bash
        # The aggregate throughput of concurrent shard streams (what an
        # erasure read or write moves between two nodes), best of the runs.
        run: |
          {
            echo "### Internode RPC throughput (MB/s, best of 3)"
            for b in CreateFile ReadFileStream CreateFileParallel ReadFileStreamParallel; do
              best=$(grep -E "^Benchmark${b}/remote-" bench-rpc.txt | awk '{print $(NF-1)}' | sort -n | tail -1)
              echo "- ${b}/remote: ${best}"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for b in CreateFileParallel ReadFileStreamParallel; do
            best=$(grep -E "^Benchmark${b}/remote-" bench-rpc.txt | awk '{print $(NF-1)}' | sort -n | tail -1)
            awk -v v="$best" -v b="$b" 'BEGIN { if (v + 0 < 1000) { print b " below 1 GB/s: " v " MB/s"; exit 1 } }'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bench-rpc
          path: bench-rpc.txt
          retention-days: 90

  fuzz-nightly:
    # Nightly (M9 T-9.2): every Go fuzz target (parsers of the S3 and
    # Admin API documents, SigV4, policies, xl.meta, endpoints, keys,
    # distributions, end to end request bodies) for a minute each; a
    # crasher is kept as an artifact, to be added to the testdata/fuzz
    # corpus of its package with the fix.
    name: Fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make fuzz
        run: make fuzz FUZZTIME=60s

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          retention-days: 30

  s3tests-nightly:
    # Nightly (docs/06 §6.1, T-9.1, DoD of T-7.1): the Ceph s3-tests
    # compatibility suite (every file: test_s3, headers, IAM, STS, Select,
    # SNS, S3 Control, at the commit pinned by test/compat/run-s3tests.sh)
    # against bin/nexo over TLS, in every mode (4 drives, 1 drive, 4
    # processes x 2 drives). A job fails when a group with applicable tests
    # passes less than 95% of them, or when a test excluded by name
    # (test/compat/excluded.txt) passes and its exclusion must go; the
    # per-test report is kept as an artifact and the per-group summary is
    # in the job summary.
    name: Compatibility (Ceph s3-tests, ${{ matrix.mode }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [snmd, snsd, cluster]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: make test-s3compat
        shell: bash
        env:
          # Without network the script would skip: in CI that is a failure.
          NEXO_S3TESTS_REQUIRE_NETWORK: "1"
          NEXO_S3TESTS_MODE: ${{ matrix.mode }}
          NEXO_S3TESTS_REPORT_DIR: ${{ github.workspace }}/s3tests-report
          NEXO_S3TESTS_CHECK_EXCLUDED: names
        run: make test-s3compat

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -s s3tests-report/report.txt ]]; then
            {
              echo '### Ceph s3-tests (${{ matrix.mode }})'
              echo '```'
              sed -n '1,/^$/p;/^group/,/^$/p' s3tests-report/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3tests-report-${{ matrix.mode }}
          path: s3tests-report
          if-no-files-found: ignore
          retention-days: 30

  mint-nightly:
    # Nightly (docs/06 §6.1, T-9.1): the SDK suites of MinIO Mint
    # (github.com/minio/mint at the commit pinned by
    # test/compat/run-mint.sh: minio-go/py/js/java, aws-sdk-go-v2,
    # aws-sdk-java-v2, aws-sdk-ruby, aws-sdk-php, awscli, s3cmd, mc, ...)
    # built on the runner, without Docker, and run against bin/nexo over
    # TLS. A job fails when a suite fails a test not listed with its
    # reason in test/compat/mint-excluded.txt, or cannot be built.
    name: Compatibility (MinIO Mint, ${{ matrix.mode }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [snmd, cluster]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: make test-mint
        shell: bash
        env:
          NEXO_MINT_REQUIRE_NETWORK: "1"
          NEXO_MINT_REQUIRE_ALL: "1"
          NEXO_MINT_MODE: ${{ matrix.mode }}
          NEXO_MINT_REPORT_DIR: ${{ github.workspace }}/mint-report
        run: make test-mint

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -s mint-report/report.txt ]]; then
            {
              echo '### MinIO Mint (${{ matrix.mode }})'
              echo '```'
              sed -n '1,/^$/p;/^suite/,/^$/p' mint-report/report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mint-report-${{ matrix.mode }}
          path: mint-report
          if-no-files-found: ignore
          retention-days: 30

  upgrade-nightly:
    # Nightly (docs/05 T-9.8, docs/06 §6.1): the release before (the M7
    # commit, built from git by the test) writes a 4-drive node and a
    # cluster of 4 nodes; the working tree takes the node over and
    # upgrades the cluster one node at a time under load (no client error,
    # every read checked), then the release before is started again on the
    # drives (downgrade, test/upgrade/doc.go).
    name: Upgrade (release before -> working tree)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # The release before is built from its commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-upgrade
        # shell: bash runs with pipefail: the status of make survives tee.
        shell: bash
        run: make test-upgrade 2>&1 | tee upgrade-tests.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: upgrade-tests-log
          path: upgrade-tests.log
          if-no-files-found: ignore
          retention-days: 14

  integration-nightly:
    # Nightly: the integration suite in every mode with its slow tests
    # (thousands of objects, large transfers), without the race detector.
    name: Integration (every mode, slow tests)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-integration
        run: make test-integration

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build nexo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: nexo:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=nexo
          cache-to: type=gha,scope=nexo,mode=max

      - name: Build nexoctl image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nexoctl
          push: false
          load: true
          tags: nexoctl:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=nexoctl
          cache-to: type=gha,scope=nexoctl,mode=max

      - name: Smoke test images
        run: |
          set -eux
          docker run --rm nexo:ci version
          docker run --rm nexoctl:ci version

          docker run -d --name nexo \
            -e NEXO_ROOT_USER=admin -e NEXO_ROOT_PASSWORD=password123 \
            nexo:ci

          # Wait for the image HEALTHCHECK (nexo healthcheck) to report healthy.
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' nexo)"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' nexo | grep -qx healthy

          # Probe the liveness and readiness endpoints from the container network.
          docker run --rm --network container:nexo curlimages/curl:8.14.1 \
            -fsS http://127.0.0.1:9001/nexo/health/live
          docker run --rm --network container:nexo curlimages/curl:8.14.1 \
            -fsS http://127.0.0.1:9001/nexo/health/ready
          docker run --rm --network container:nexo curlimages/curl:8.14.1 \
            -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:9001/

          # The process runs as nonroot.
          docker exec nexo /nexoctl version

      - name: Container logs
        if: failure()
        run: docker logs nexo || true

      - name: Vulnerability scan (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexo:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Cleanup
        if: always()
        run: docker rm -f nexo >/dev/null 2>&1 || true

  compose-cluster-nightly:
    # Nightly: compose.cluster.yml with the image of this commit behind its
    # nginx load balancer (docs/08 §8.6): TM-06 (a container stopped under
    # load, no client error) and TM-09 (presigned and share links
    # generated with NEXO_SERVER_URL, downloaded from outside), the tests
    # of test/compose (build tag "compose").
    name: Compose cluster (TM-06, TM-09)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Build nexo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: nexo:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=nexo

      - name: Start compose.cluster.yml
        working-directory: deploy/docker
        env:
          NEXO_IMAGE: nexo:ci
        run: |
          cp nexo.env.example nexo.env
          sed -i 's/^NEXO_ROOT_PASSWORD=$/NEXO_ROOT_PASSWORD=ci-password-123/' nexo.env
          echo "NEXO_SERVER_URL=http://localhost:9000" >> nexo.env
          docker compose -f compose.cluster.yml up -d
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:9000/nexo/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:9000/nexo/health/ready

      - name: TM-06 and TM-09 (test/compose)
        env:
          NEXO_IMAGE: nexo:ci
          NEXO_COMPOSE_FILE: deploy/docker/compose.cluster.yml
          NEXO_COMPOSE_PASSWORD: ci-password-123
        run: go test -tags compose -count=1 -v -timeout 20m ./test/compose/...

      - name: Compose logs
        if: failure()
        working-directory: deploy/docker
        env:
          NEXO_IMAGE: nexo:ci
        run: docker compose -f compose.cluster.yml logs --no-color --tail 300 || true

      - name: Stop the deployment
        if: always()
        working-directory: deploy/docker
        env:
          NEXO_IMAGE: nexo:ci
        run: docker compose -f compose.cluster.yml down -v || true

  deploy-files:
    name: Deploy files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: YAML syntax (compose, workflows, observability)
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]; print("ok", len(sys.argv) - 1, "files")' \
            deploy/docker/compose.*.yml \
            deploy/docker/observability/*.yml \
            deploy/docker/observability/grafana/provisioning/*/*.yml \
            deploy/proxy/*.yml \
            deploy/swarm/*.yml \
            deploy/helm/nexo/values.yaml \
            deploy/helm/nexo/ci/*.yaml \
            .github/workflows/*.yml \
            .github/dependabot.yml \
            .goreleaser.yaml \
            .mockery.yaml \
            api/openapi.yaml

      - name: Compose files validate
        run: |
          cd deploy/docker
          cp nexo.env.example nexo.env
          mkdir -p certs
          for f in compose.single.yml compose.snmd.yml compose.cluster.yml compose.cluster-tls.yml; do
            docker compose -f "$f" config --quiet
          done
          NEXO_SECRET_PROXY_A=a NEXO_SECRET_PROXY_B=b docker compose -f compose.multi-proxy.yml config --quiet
          GRAFANA_ADMIN_PASSWORD=ci docker compose -f compose.single.yml -f compose.observability.yml config --quiet
          GRAFANA_ADMIN_PASSWORD=ci PROMETHEUS_CONFIG=prometheus.cluster.yml docker compose -f compose.cluster.yml -f compose.observability.yml config --quiet
          # The scrapers of the observability overlay share a network with
          # every target of their Prometheus configuration.
          shares() {
            python3 -c 'import json, sys
          s = json.load(sys.stdin)["services"]
          nets = lambda n: set(s[n].get("networks") or ["default"])
          alone = [n for n in sys.argv[1:] if not nets("prometheus") & nets(n)]
          print("prometheus shares a network with", sys.argv[1:], "except", alone)
          sys.exit(1 if alone else 0)' "$@"
          }
          GRAFANA_ADMIN_PASSWORD=ci docker compose -f compose.single.yml -f compose.observability.yml config --format json | shares nexo
          GRAFANA_ADMIN_PASSWORD=ci PROMETHEUS_CONFIG=prometheus.cluster.yml docker compose -f compose.cluster.yml -f compose.observability.yml config --format json \
            | shares nexo1 nexo2 nexo3 nexo4 lb

      - name: nginx configs
        run: |
          for f in nginx.conf nginx-tls.conf; do
            docker run --rm -v "$PWD/deploy/docker/$f:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
          done

      - name: Proxy configs (deploy/proxy, compose.multi-proxy.yml)
        run: |
          set -eux
          # Development certificates: the edges of compose.multi-proxy.yml,
          # and one self-signed pair for the examples of deploy/proxy.
          deploy/docker/multi-proxy/gen-certs.sh
          certs="$(mktemp -d)"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj /CN=example.com \
            -keyout "$certs/privkey.pem" -out "$certs/fullchain.pem"
          for d in s3.example.com console.example.com example.com; do
            mkdir -p "$certs/$d" && cp "$certs/fullchain.pem" "$certs/privkey.pem" "$certs/$d/"
          done
          mkdir -p "$certs/haproxy" && cat "$certs/fullchain.pem" "$certs/privkey.pem" > "$certs/haproxy/example.pem"
          chmod -R a+rX "$certs"

          # compose.multi-proxy.yml: the nginx template rendered by the image, HAProxy.
          docker run --rm -e NEXO_ORIGIN_SECRET=x \
            -v "$PWD/deploy/docker/multi-proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/deploy/docker/certs/proxy-a:/etc/nginx/certs:ro" nginx:1.27-alpine nginx -t
          docker run --rm -e NEXO_ORIGIN_SECRET=x \
            -v "$PWD/deploy/docker/multi-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v "$PWD/deploy/docker/certs/proxy-b:/usr/local/etc/haproxy/certs:ro" \
            haproxy:3.0-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

          # deploy/proxy examples.
          docker run --rm -v "$PWD/deploy/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$certs:/etc/nginx/certs:ro" nginx:1.27-alpine nginx -t
          docker run --rm -e NEXO_ORIGIN_SECRET=x -v "$PWD/deploy/proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            -v "$certs/haproxy:/usr/local/etc/haproxy/certs:ro" haproxy:3.0-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          docker run --rm -v "$PWD/deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Grafana dashboard JSON
        run: python3 -m json.tool deploy/docker/observability/grafana/dashboards/nexo-overview.json >/dev/null

      - name: Prometheus rules and config
        run: |
          docker run --rm -v "$PWD/deploy/docker/observability:/obs:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /obs/alerts.yml
          for f in prometheus.single.yml prometheus.cluster.yml; do
            docker run --rm -v "$PWD/deploy/docker/observability:/obs:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config --syntax-only "/obs/$f"
          done

      - name: Swarm stack
        run: |
          cd deploy/swarm
          docker stack config -c stack.yml >/dev/null

  docs:
    name: User documentation (CLI reference, MkDocs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # docs/user/cli is generated from the cobra commands (nexoctl gendocs):
      # a command or flag changed without make docs fails here.
      - name: CLI reference is up to date (make docs-check)
        run: make docs-check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # The site of mkdocs.yml (docs/user): broken links, missing pages and
      # an invalid navigation fail the build.
      # The versions are pinned in docs/requirements.txt (make docs-tools).
      - name: MkDocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          python3 -m pip install --disable-pip-version-check -r docs/requirements.txt
          mkdocs build --strict -f mkdocs.yml -d "$RUNNER_TEMP/site"
