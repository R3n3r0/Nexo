# Site of the user documentation (docs/user), built with MkDocs Material:
#   make docs-site     # bin/site, mkdocs build --strict + the Admin API page
# Requires: the pinned tools of docs/requirements.txt (make docs-tools
# installs them in bin/docs-venv; the CI job "docs" uses the same file).
# The pages are plain Markdown that renders on GitHub too: no Material-only
# syntax (tabs, admonitions) in docs/user.
#
# Languages (mkdocs-static-i18n, suffix structure): English is the default
# and lives in <page>.md, served at /; the Italian translation lives next to
# it in <page>.it.md, served at /it/. A page without an Italian version (the
# generated CLI reference in docs/user/cli, English only) falls back to the
# English one in the Italian site.
site_name: Nexo
site_description: >-
  Nexo is an open source, S3-compatible object storage server written in Go: one binary
  for a single drive, erasure-coded drives or a cluster, with a web console, IAM, encryption,
  custom domains and caching. Documentation, guides and reference.
site_url: https://r3n3r0.github.io/Nexo/
repo_url: https://github.com/R3n3r0/Nexo
repo_name: R3n3r0/Nexo
edit_uri: edit/main/docs/user/
docs_dir: docs/user
copyright: Nexo

theme:
  name: material
  # main.html: Google Search Console verification and link previews.
  custom_dir: docs/overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# google_site_verification: the content of the meta tag of Google Search
# Console (URL prefix property https://r3n3r0.github.io/Nexo/, method "HTML
# tag"); empty: no tag. The sitemap (sitemap.xml) is generated by MkDocs.
extra:
  google_site_verification: "O8fweuPJ9Fgzy8GZnR7q0KY3AIzx4LrfJHtWqjXVodk"

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: it
          name: Italiano
          build: true
          site_description: Documentazione utente di Nexo, object storage compatibile con S3
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                toggle:
                  icon: material/brightness-7
                  name: Tema scuro
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                toggle:
                  icon: material/brightness-4
                  name: Tema chiaro
          nav_translations:
            Introduction: Introduzione
            How Nexo compares: Confronto con le alternative
            Getting started: Per iniziare
            Installation: Installazione
            Deployment modes: Modalità di deployment
            Configuration: Configurazione
            Migrating from MinIO: Migrare da MinIO
            Operations: Operazioni
            Monitoring: Monitoraggio
            Trace, logs and audit: Trace, log e audit
            Healing and disks: Healing e dischi
            Upgrade and expansion: Aggiornamento ed espansione
            Backup and migration: Backup e migrazione
            Troubleshooting: Risoluzione dei problemi
            Security: Sicurezza
            Users, policies and credentials: Utenti, policy e credenziali
            Sharing and anonymous access: Condivisione e accesso anonimo
            Access rules: Regole di accesso
            TLS and certificates: TLS e certificati
            Features: Funzionalità
            Distributions and cache: Distribuzioni e cache
            "Tutorial: static site": "Tutorial: sito statico"
            Events and lifecycle: Eventi e lifecycle
            Video streaming: Streaming video
            Media worker: Media worker
            Reference: Riferimenti
            nexoctl commands: Comandi di nexoctl
            S3 compatibility: Compatibilità S3

markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences
  - pymdownx.inlinehilite

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The generated CLI reference (238 pages, English only) is reached from its
# root page.
not_in_nav: |
  /cli/*.md

nav:
  - Introduction: README.md
  - How Nexo compares: comparison.md
  - Getting started:
      - Quickstart: quickstart.md
      - Installation: installation.md
      - Deployment modes: deployment-modes.md
      - Configuration: configuration.md
      - Migrating from MinIO: migrate-from-minio.md
  - Operations:
      - Monitoring: operations/monitoring.md
      - Trace, logs and audit: operations/trace-log-audit.md
      - Healing and disks: operations/healing-disks.md
      - Upgrade and expansion: operations/upgrade-expansion.md
      - Backup and migration: operations/backup-migration.md
      - Metadata log: operations/metadata-log.md
      - Troubleshooting: operations/troubleshooting.md
  - Security:
      - Users, policies and credentials: security/users-policies.md
      - Sharing and anonymous access: security/sharing.md
      - Access rules: security/access-rules.md
      - TLS and certificates: security/tls.md
      - KMS and SSE: security/kms-sse.md
      - Threat model: security/threat-model.md
  - Features:
      - Distributions and cache: distributions/README.md
      - "Tutorial: static site": distributions/tutorial-static-site.md
      - Events and lifecycle: events-lifecycle.md
      - Video streaming: video-streaming.md
      - Media worker: media-worker.md
  - Reference:
      - CLI: reference/cli.md
      - nexoctl commands: cli/nexoctl.md
      - Admin API: reference/admin-api.md
      - S3 compatibility: reference/s3-compatibility.md
