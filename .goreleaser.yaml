# GoReleaser v2 configuration of the Nexo release (docs/08 §8.7), run by
# .github/workflows/release.yml on every v* tag with GoReleaser v2.18.3.
#
# Artefacts:
#   - binaries: nexo (server + embedded console, -tags embedui) for
#     linux/darwin/windows on amd64/arm64 (no windows/arm64), nexoctl for
#     the same platforms plus windows/arm64 and nexo-media-worker for the
#     platforms of nexo; CGO_ENABLED=0 (static, except the worker, which
#     loads OpenH264 through the dynamic loader of the system),
#     reproducible (-trimpath, mod_timestamp);
#   - archives: tar.gz (zip on Windows) with LICENSE, NOTICE,
#     COMMERCIAL-LICENSE.md, README and the systemd
#     unit and env file (nexo and nexo-media-worker, not on Windows: builds
#     and archives nexo-windows, nexo-media-worker-windows) or shell
#     completions (nexoctl);
#   - packages: nexo, nexoctl and nexo-media-worker as deb and rpm (nfpm)
#     for linux amd64/arm64;
#   - checksums.txt (sha256) signed with cosign keyless (Sigstore bundle
#     checksums.txt.sigstore.json); SPDX SBOMs (syft) of every archive,
#     listed in checksums.txt;
#   - images docker.io/paolor/nexo, docker.io/paolor/nexoctl and
#     docker.io/paolor/nexo-media-worker on Docker Hub (the only registry),
#     multi-arch (linux/amd64, linux/arm64), with
#     BuildKit SBOM and provenance attestations, signed with cosign keyless;
#     tags vX.Y.Z, plus vX.Y and latest for final releases; the namespace is
#     DOCKERHUB_NAMESPACE (default paolor, lowercased; the release workflow
#     sets it from the repository variable of the same name and logs in to
#     Docker Hub first);
#   - Homebrew casks nexo and nexoctl pushed to r3n3r0/homebrew-tap when the
#     HOMEBREW_TAP_GITHUB_TOKEN secret is set.
#
# The console must be built before running GoReleaser (the before hook
# checks it), then:
#   (cd web && npm ci && npm run build)
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=docker,sign    # local, no docker: make release-snapshot
version: 2

project_name: nexo

env:
  - CGO_ENABLED=0

before:
  hooks:
    - 'sh -c "test -f web/dist/index.html || { echo web/dist/index.html missing - run npm ci and npm run build in web/ >&2; exit 1; }"'
    - go mod download
    # Shell completions of nexoctl, shipped in its archives, packages and
    # Homebrew cask. bin/ is ignored by git.
    - 'sh -c "rm -rf bin/completions && mkdir -p bin/completions && for s in bash zsh fish; do go run ./cmd/nexoctl completion $s > bin/completions/nexoctl.$s || exit 1; done"'

builds:
  - id: nexo
    main: ./cmd/nexo
    binary: nexo
    flags:
      - -trimpath
    tags:
      - embedui
    ldflags:
      - -s -w
      - -X github.com/r3n3r0/nexo/internal/version.Version=v{{ .Version }}
      - -X github.com/r3n3r0/nexo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/r3n3r0/nexo/internal/version.Date={{ .CommitDate }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The server for Windows: a build of its own, so that its archive has no
  # systemd files (archive nexo-windows).
  - id: nexo-windows
    main: ./cmd/nexo
    binary: nexo
    flags:
      - -trimpath
    tags:
      - embedui
    ldflags:
      - -s -w
      - -X github.com/r3n3r0/nexo/internal/version.Version=v{{ .Version }}
      - -X github.com/r3n3r0/nexo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/r3n3r0/nexo/internal/version.Date={{ .CommitDate }}
    goos: [windows]
    goarch: [amd64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: nexoctl
    main: ./cmd/nexoctl
    binary: nexoctl
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/r3n3r0/nexo/internal/version.Version=v{{ .Version }}
      - -X github.com/r3n3r0/nexo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/r3n3r0/nexo/internal/version.Date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The media worker, for the platforms Cisco publishes an OpenH264 build
  # for (downloaded by the worker at its first start, never shipped).
  - id: nexo-media-worker
    main: ./cmd/nexo-media-worker
    binary: nexo-media-worker
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/r3n3r0/nexo/internal/version.Version=v{{ .Version }}
      - -X github.com/r3n3r0/nexo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/r3n3r0/nexo/internal/version.Date={{ .CommitDate }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The worker for Windows: a build of its own, so that its archive has no
  # systemd files (archive nexo-media-worker-windows).
  - id: nexo-media-worker-windows
    main: ./cmd/nexo-media-worker
    binary: nexo-media-worker
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/r3n3r0/nexo/internal/version.Version=v{{ .Version }}
      - -X github.com/r3n3r0/nexo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/r3n3r0/nexo/internal/version.Date={{ .CommitDate }}
    goos: [windows]
    goarch: [amd64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: nexo
    ids: [nexo]
    name_template: "nexo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &fileinfo
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info: *fileinfo
      - src: COMMERCIAL-LICENSE.md
        info: *fileinfo
      - src: README.md
        info: *fileinfo
      - src: deploy/systemd/nexo.service
        dst: systemd/nexo.service
        info: *fileinfo
      - src: deploy/systemd/nexo.env.example
        dst: systemd/nexo.env.example
        info: *fileinfo
      - src: deploy/systemd/README.md
        dst: systemd/README.md
        info: *fileinfo

  # Windows: the binary, LICENSE and README, without the systemd files.
  - id: nexo-windows
    ids: [nexo-windows]
    name_template: "nexo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *fileinfo
      - src: NOTICE
        info: *fileinfo
      - src: COMMERCIAL-LICENSE.md
        info: *fileinfo
      - src: README.md
        info: *fileinfo

  - id: nexoctl
    ids: [nexoctl]
    name_template: "nexoctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *fileinfo
      - src: NOTICE
        info: *fileinfo
      - src: COMMERCIAL-LICENSE.md
        info: *fileinfo
      - src: README.md
        info: *fileinfo
      - src: bin/completions/*
        dst: completions
        strip_parent: true
        info: *fileinfo

  # The worker: binary, licenses, README and its systemd unit and env file.
  - id: nexo-media-worker
    ids: [nexo-media-worker]
    name_template: "nexo-media-worker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *fileinfo
      - src: NOTICE
        info: *fileinfo
      - src: COMMERCIAL-LICENSE.md
        info: *fileinfo
      - src: README.md
        info: *fileinfo
      - src: deploy/systemd/nexo-media-worker.service
        dst: systemd/nexo-media-worker.service
        info: *fileinfo
      - src: deploy/systemd/nexo-media-worker.env.example
        dst: systemd/nexo-media-worker.env.example
        info: *fileinfo
      - src: deploy/systemd/README.md
        dst: systemd/README.md
        info: *fileinfo

  # Windows: the binary, licenses and README, without the systemd files.
  - id: nexo-media-worker-windows
    ids: [nexo-media-worker-windows]
    name_template: "nexo-media-worker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *fileinfo
      - src: NOTICE
        info: *fileinfo
      - src: COMMERCIAL-LICENSE.md
        info: *fileinfo
      - src: README.md
        info: *fileinfo

nfpms:
  # Server: binary, systemd unit, /etc/default/nexo, nexo user (preinstall,
  # sysusers.d) and /var/lib/nexo. The CLI is a package of its own,
  # recommended.
  - id: nexo
    package_name: nexo
    ids: [nexo]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: r3n3r0
    homepage: https://github.com/r3n3r0/nexo
    maintainer: r3n3r0 <r3n3r0@users.noreply.github.com>
    license: AGPL-3.0-only
    description: |-
      S3-compatible object storage server with an embedded web console.
      Single node (one or more drives, erasure coding) or distributed cluster.
    formats: [deb, rpm]
    bindir: /usr/bin
    section: net
    priority: optional
    mtime: "{{ .CommitDate }}"
    recommends:
      - nexoctl
    contents:
      # Implicit parents take the owner of their files: keep /etc/default
      # root's (rpm leaves it to the filesystem package).
      - dst: /etc/default
        type: dir
        packager: deb
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: deploy/systemd/nexo.service
        dst: /usr/lib/systemd/system/nexo.service
        file_info:
          mode: 0644
      - src: packaging/nfpm/nexo.sysusers.conf
        dst: /usr/lib/sysusers.d/nexo.conf
        file_info:
          mode: 0644
      - src: deploy/systemd/nexo.env.example
        dst: /etc/default/nexo
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: nexo
      - dst: /var/lib/nexo
        type: dir
        file_info:
          mode: 0750
          owner: nexo
          group: nexo
      - dst: /var/lib/nexo/data
        type: dir
        file_info:
          mode: 0750
          owner: nexo
          group: nexo
      - dst: /etc/nexo
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: nexo
      - src: README.md
        dst: /usr/share/doc/nexo/README.md
        file_info:
          mode: 0644
      # The license: debian/copyright for the deb, %license for the rpm.
      - src: packaging/nfpm/copyright
        dst: /usr/share/doc/nexo/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/nexo/LICENSE
        packager: rpm
        type: license
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/nexo/NOTICE
        file_info:
          mode: 0644
      - src: deploy/systemd/README.md
        dst: /usr/share/doc/nexo/systemd.md
        file_info:
          mode: 0644
    scripts:
      preinstall: packaging/nfpm/preinstall.sh
      postinstall: packaging/nfpm/postinstall.sh
      preremove: packaging/nfpm/preremove.sh
      postremove: packaging/nfpm/postremove.sh
    rpm:
      summary: S3-compatible object storage server
      group: System Environment/Daemons
    deb:
      # The preinst creates the nexo user with useradd/groupadd.
      predepends:
        - passwd
      lintian_overrides:
        - statically-linked-binary

  # CLI: nexoctl and its shell completions.
  - id: nexoctl
    package_name: nexoctl
    ids: [nexoctl]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: r3n3r0
    homepage: https://github.com/r3n3r0/nexo
    maintainer: r3n3r0 <r3n3r0@users.noreply.github.com>
    license: AGPL-3.0-only
    description: |-
      Command-line client of Nexo, the S3-compatible object storage server:
      buckets and objects, mirroring, sharing and administration.
    formats: [deb, rpm]
    bindir: /usr/bin
    section: net
    priority: optional
    mtime: "{{ .CommitDate }}"
    contents:
      - src: bin/completions/nexoctl.bash
        dst: /usr/share/bash-completion/completions/nexoctl
        file_info:
          mode: 0644
      - src: bin/completions/nexoctl.zsh
        dst: /usr/share/zsh/vendor-completions/_nexoctl
        packager: deb
        file_info:
          mode: 0644
      - src: bin/completions/nexoctl.zsh
        dst: /usr/share/zsh/site-functions/_nexoctl
        packager: rpm
        file_info:
          mode: 0644
      - src: bin/completions/nexoctl.fish
        dst: /usr/share/fish/vendor_completions.d/nexoctl.fish
        file_info:
          mode: 0644
      - src: packaging/nfpm/copyright
        dst: /usr/share/doc/nexoctl/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/nexoctl/LICENSE
        packager: rpm
        type: license
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/nexoctl/NOTICE
        file_info:
          mode: 0644
    rpm:
      summary: Command-line client of Nexo
      group: Applications/Internet
    deb:
      lintian_overrides:
        - statically-linked-binary

  # Media worker: binary, systemd unit (dynamic user, no account to create),
  # /etc/default/nexo-media-worker. OpenH264, a C++ library, is downloaded
  # by the worker at its first start: the package depends on libstdc++.
  - id: nexo-media-worker
    package_name: nexo-media-worker
    ids: [nexo-media-worker]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: r3n3r0
    homepage: https://github.com/r3n3r0/nexo
    maintainer: r3n3r0 <r3n3r0@users.noreply.github.com>
    license: AGPL-3.0-only
    description: |-
      Media worker of Nexo, the S3-compatible object storage server:
      renditions, posters and thumbnails of videos (OpenH264, downloaded
      from Cisco at the first start) and variants of images.
    formats: [deb, rpm]
    bindir: /usr/bin
    section: video
    priority: optional
    mtime: "{{ .CommitDate }}"
    overrides:
      deb:
        dependencies:
          - libstdc++6
      rpm:
        dependencies:
          - libstdc++
    contents:
      - dst: /etc/default
        type: dir
        packager: deb
        file_info:
          mode: 0755
          owner: root
          group: root
      - src: deploy/systemd/nexo-media-worker.service
        dst: /usr/lib/systemd/system/nexo-media-worker.service
        file_info:
          mode: 0644
      - src: deploy/systemd/nexo-media-worker.env.example
        dst: /etc/default/nexo-media-worker
        type: config|noreplace
        file_info:
          mode: 0600
          owner: root
          group: root
      - src: packaging/nfpm/copyright
        dst: /usr/share/doc/nexo-media-worker/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/nexo-media-worker/LICENSE
        packager: rpm
        type: license
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/nexo-media-worker/NOTICE
        file_info:
          mode: 0644
      - src: deploy/systemd/README.md
        dst: /usr/share/doc/nexo-media-worker/systemd.md
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/nfpm/media-worker-postinstall.sh
      preremove: packaging/nfpm/media-worker-preremove.sh
      postremove: packaging/nfpm/media-worker-postremove.sh
    rpm:
      summary: Media worker of Nexo (video renditions, image variants)
      group: System Environment/Daemons

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX JSON SBOMs generated by syft, one per archive (the Go modules and
# the toolchain of its binaries). The deb/rpm packages contain the same
# linux binaries as the linux archives, whose SBOMs describe them (syft
# does not look inside the packages).
sboms:
  - id: archives
    artifacts: archive

source:
  enabled: true
  name_template: "nexo_{{ .Version }}_source"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

report_sizes: true

# cosign keyless (Sigstore, GitHub OIDC): only checksums.txt is signed,
# it covers every archive, package, SBOM and the source archive.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

# One multi-arch image per name, built and pushed by buildx from the
# binaries above (deploy/docker/Dockerfile*.goreleaser read them from
# $TARGETPLATFORM/), with SBOM and provenance attestations, pushed to
# Docker Hub only: docker.io/<DOCKERHUB_NAMESPACE>/nexo and .../nexoctl
# (namespace default paolor, lowercased; an empty value counts as unset).
# docker_signs signs each pushed name:tag by its digest. The media worker has
# an image of its own (glibc base, for OpenH264): .../nexo-media-worker.
dockers_v2:
  - id: nexo
    ids: [nexo, nexoctl]
    dockerfile: deploy/docker/Dockerfile.goreleaser
    extra_files: [LICENSE, NOTICE, COMMERCIAL-LICENSE.md]
    images:
      - 'docker.io/{{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexo'
    tags:
      - "{{ .Tag }}"
      - '{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    sbom: "true"
    labels: &imagelabels
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
    annotations: &imageannotations
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
    flags:
      # A snapshot loads each platform into the local daemon, whose exporter
      # cannot store attestations; a release pushes them.
      - '--provenance={{ if .IsSnapshot }}false{{ else }}mode=max{{ end }}'

  - id: nexoctl
    ids: [nexoctl]
    dockerfile: deploy/docker/Dockerfile.nexoctl.goreleaser
    extra_files: [LICENSE, NOTICE, COMMERCIAL-LICENSE.md]
    images:
      - 'docker.io/{{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexoctl'
    tags:
      - "{{ .Tag }}"
      - '{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    sbom: "true"
    labels: *imagelabels
    annotations: *imageannotations
    flags:
      # A snapshot loads each platform into the local daemon, whose exporter
      # cannot store attestations; a release pushes them.
      - '--provenance={{ if .IsSnapshot }}false{{ else }}mode=max{{ end }}'

  - id: nexo-media-worker
    ids: [nexo-media-worker]
    dockerfile: deploy/docker/Dockerfile.media-worker.goreleaser
    extra_files: [LICENSE, NOTICE, COMMERCIAL-LICENSE.md]
    images:
      - 'docker.io/{{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexo-media-worker'
    tags:
      - "{{ .Tag }}"
      - '{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms: [linux/amd64, linux/arm64]
    sbom: "true"
    labels: *imagelabels
    annotations: *imageannotations
    flags:
      - '--provenance={{ if .IsSnapshot }}false{{ else }}mode=max{{ end }}'

# Every pushed docker.io name:tag, signed by digest: the signature is
# stored next to the image in the Docker Hub repository.
docker_signs:
  - id: images
    cmd: cosign
    artifacts: images
    output: true
    args:
      - sign
      - ${artifact}@${digest}
      - --yes

# Homebrew casks in r3n3r0/homebrew-tap (brew install r3n3r0/tap/nexoctl).
# Skipped when HOMEBREW_TAP_GITHUB_TOKEN (a token allowed to push to the
# tap) is not set, and for pre-releases.
homebrew_casks:
  - name: nexoctl
    ids: [nexoctl]
    binaries: [nexoctl]
    repository: &tap
      owner: r3n3r0
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Casks
    homepage: https://github.com/r3n3r0/nexo
    description: Command-line client of Nexo, the S3-compatible object storage server
    commit_msg_template: "nexoctl {{ .Tag }}"
    skip_upload: &tapskip '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ else }}auto{{ end }}'
    generate_completions_from_executable:
      executable: nexoctl
      args: [completion]
    hooks:
      post:
        # The binaries are signed with cosign, not notarized by Apple.
        install: &unquarantine |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path.to_s]
          end

  - name: nexo
    ids: [nexo]
    binaries: [nexo]
    repository: *tap
    directory: Casks
    homepage: https://github.com/r3n3r0/nexo
    description: S3-compatible object storage server with an embedded web console
    commit_msg_template: "nexo {{ .Tag }}"
    skip_upload: *tapskip
    caveats: |
      Start a single-drive server (console on http://localhost:9001):
        NEXO_ROOT_USER=admin NEXO_ROOT_PASSWORD=<at least 8 characters> nexo server ~/nexo-data
    hooks:
      post:
        install: *unquarantine

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^deps"
      - "merge conflict"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: r3n3r0
    name: nexo
  draft: false
  prerelease: auto
  mode: replace
  footer: |
    ## Verify this release

    ```sh
    # checksums.txt: signed with cosign keyless by the release workflow of this tag
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
      --certificate-identity 'https://github.com/R3n3r0/Nexo/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    sha256sum --ignore-missing -c checksums.txt

    # images (multi-arch index, SBOM and provenance attestations)
    cosign verify docker.io/{{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexo:{{ .Tag }} \
      --certificate-identity 'https://github.com/R3n3r0/Nexo/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    docker buildx imagetools inspect docker.io/{{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexo:{{ .Tag }} --format '{{ "{{" }} json .SBOM {{ "}}" }}'
    ```

    ## Install

    ```sh
    docker pull {{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexo:{{ .Tag }}
    docker pull {{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexoctl:{{ .Tag }}
    docker pull {{ tolower (or (envOrDefault "DOCKERHUB_NAMESPACE" "") "paolor") }}/nexo-media-worker:{{ .Tag }}
    # Helm chart attached to this release (signature: nexo-{{ .Version }}.tgz.sigstore.json)
    helm install nexo https://github.com/R3n3r0/Nexo/releases/download/{{ .Tag }}/nexo-{{ .Version }}.tgz
    ```

    deb/rpm packages `nexo` (server, systemd unit), `nexoctl` (CLI) and
    `nexo-media-worker` (media worker, systemd unit) for amd64 and arm64 are
    attached below; see docs/08-deployment-modes.md §8.7 and
    docs/user/media-worker.md.
