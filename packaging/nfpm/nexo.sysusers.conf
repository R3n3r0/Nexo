# System user and group of the Nexo object storage server (systemd-sysusers,
# installed as /usr/lib/sysusers.d/nexo.conf by the nexo deb/rpm package).
# The package preinstall script creates them with useradd; this file lets
# systemd-sysusers recreate them on image-based systems (factory reset of
# /etc) and documents them. Home: the state directory of nexo.service.
#Type Name ID GECOS                 Home          Shell
u     nexo -  "Nexo object storage" /var/lib/nexo -
