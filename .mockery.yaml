# Repository-wide mockery configuration (docs/12 §12.2 rule 8): every service
# interface gets a mock in <package>/mock, generated by
# `go generate ./...` (see internal/service/doc.go) and checked for drift in
# CI with `git diff --exit-code`.
log-level: error
resolve-type-alias: false
issue-845-fix: true
with-expecter: true
disable-version-string: true
dir: "{{.InterfaceDir}}/mock"
outpkg: mock
mockname: "{{.InterfaceName}}"
filename: "{{.InterfaceName | snakecase}}.go"
packages:
  github.com/r3n3r0/nexo/internal/cli:
    interfaces:
      AliasService:
      ConfigStore:
  github.com/r3n3r0/nexo/internal/service/admin:
    interfaces:
      Service:
      ActionHandler:
  github.com/r3n3r0/nexo/internal/service/audit:
    interfaces:
      Service:
  github.com/r3n3r0/nexo/internal/service/auth:
    interfaces:
      Verifier:
      Signer:
      CredentialLookup:
  github.com/r3n3r0/nexo/internal/service/bucket:
    interfaces:
      Service:
      MetadataStore:
  github.com/r3n3r0/nexo/internal/service/config:
    interfaces:
      Service:
      Store:
  github.com/r3n3r0/nexo/internal/service/event:
    interfaces:
      Service:
      Dispatcher:
      Target:
      TargetFactory:
      HTTPDoer:
  github.com/r3n3r0/nexo/internal/service/health:
    interfaces:
      Service:
  github.com/r3n3r0/nexo/internal/service/iam:
    interfaces:
      Service:
  github.com/r3n3r0/nexo/internal/service/lock:
    interfaces:
      Locker:
      NSLock:
      LockContext:
  github.com/r3n3r0/nexo/internal/service/metrics:
    interfaces:
      Registry:
  github.com/r3n3r0/nexo/internal/service/object:
    interfaces:
      Service:
      BucketConfigSource:
  github.com/r3n3r0/nexo/internal/service/policy:
    interfaces:
      Service:
      PolicyStore:
  github.com/r3n3r0/nexo/internal/service/session:
    interfaces:
      Service:
  github.com/r3n3r0/nexo/internal/service/storage:
    interfaces:
      StorageAPI:
      Formatter:
  github.com/r3n3r0/nexo/internal/service/topology:
    interfaces:
      Service:
      HostResolver:
      IDGenerator:
