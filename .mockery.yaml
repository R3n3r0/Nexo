# Repository-wide mockery configuration (docs/12 §12.2 rule 8): every
# interface of the service, transport, config and cli packages gets a mock in
# <package>/mock, generated by `go generate ./...` (see
# internal/service/doc.go) and checked for drift in CI with
# `git diff --exit-code`. internal/service/convention_test.go fails when an
# exported interface of those packages has no mock.
log-level: error
resolve-type-alias: false
issue-845-fix: true
with-expecter: true
disable-version-string: true
dir: "{{.InterfaceDir}}/mock"
outpkg: mock
mockname: "{{.InterfaceName}}"
filename: "{{.InterfaceName | snakecase}}.go"
packages:
  github.com/r3n3r0/nexo/internal/cli:
    interfaces:
      AliasService:
      ConfigStore:
  github.com/r3n3r0/nexo/internal/service/admin:
