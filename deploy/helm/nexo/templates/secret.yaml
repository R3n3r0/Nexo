{{- if include "nexo.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexo.labels" . | nindent 4 }}
  annotations:
    # Kept by "helm uninstall", like the volumes of the drives: a reinstall
    # with the same release name finds the same root credentials (and KMS
    # master key, without which encrypted objects are unreadable).
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.auth.existingSecret }}
  root-user: {{ .Values.auth.rootUser | b64enc | quote }}
  root-password: {{ include "nexo.rootPassword" . | b64enc | quote }}
  {{- end }}
  {{- if and .Values.kms.secretKey (not .Values.kms.existingSecret) }}
  kms-secret-key: {{ .Values.kms.secretKey | b64enc | quote }}
  {{- end }}
{{- end }}
