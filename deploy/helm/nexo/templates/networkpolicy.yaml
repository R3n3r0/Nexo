{{- if .Values.networkPolicy.enabled }}
{{/*
The nodes reach each other on every port (internode RPC on the S3 port);
S3 and console are reachable from networkPolicy.allowedFrom, or from
everywhere when it is empty.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nexo.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
    {{- if and .Values.mediaWorker.enabled .Values.networkPolicy.allowedFrom }}
    # The media worker (S3 API) and its setup Job (S3 API, Admin API).
    - ports:
        - port: s3
          protocol: TCP
        - port: console
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "nexo.mediaWorker.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: media-worker-setup
    {{- end }}
    - ports:
        - port: s3
          protocol: TCP
        - port: console
          protocol: TCP
      {{- with .Values.networkPolicy.allowedFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.mediaWorker.enabled }}
---
{{/*
The jobs endpoint of the media worker: only the Nexo pods (the
notify_media_worker target) and the Helm tests reach it.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexo.mediaWorker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexo.mediaWorker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexo.mediaWorker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: jobs
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "nexo.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
{{- end }}
{{- end }}
