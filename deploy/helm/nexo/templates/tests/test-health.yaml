{{/*
helm test: the S3 Service answers, and the cluster health endpoint reports
that every erasure set has its write quorum. Runs the server image itself
(nexo healthcheck), which has no shell.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nexo.fullname" . }}-test-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexo.testLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: health
      image: {{ include "nexo.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - healthcheck
        - --url
        - {{ printf "%s://%s:%v/nexo/health/cluster" (include "nexo.scheme" .) (include "nexo.serviceHost" .) .Values.service.s3Port | quote }}
      {{- if .Values.tls.caSecretName }}
      env:
        - name: SSL_CERT_FILE
          value: /etc/nexo/ca/ca.crt
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      {{- if .Values.tls.caSecretName }}
      volumeMounts:
        - name: ca
          mountPath: /etc/nexo/ca
          readOnly: true
      {{- end }}
  {{- if .Values.tls.caSecretName }}
  volumes:
    - name: ca
      secret:
        secretName: {{ .Values.tls.caSecretName }}
        defaultMode: 0440
        items:
          - key: {{ .Values.tls.caKey }}
            path: ca.crt
  {{- end }}
