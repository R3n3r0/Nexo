{{- $root := . }}
{{- range $kind, $port := dict "s3" "s3" "console" "console" "distributions" "s3" }}
{{- $ing := index $root.Values.ingress $kind }}
{{- if and $ing.enabled $ing.hosts }}
---
{{/*
Ingress of the S3 API, of the console or of the custom domains of the
distributions (served by the S3 port, chosen by the Host header). The
controller must keep the Host header unchanged (presigned URLs are signed
with it) and must not publish /nexo/rpc/ (README "Ingress").
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nexo.fullname" $root }}-{{ $kind }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "nexo.labels" $root | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $ing.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: {{ $ing.pathType }}
            backend:
              service:
                name: {{ include "nexo.fullname" $root }}
                port:
                  name: {{ $port }}
    {{- end }}
{{- end }}
{{- end }}
