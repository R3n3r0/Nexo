# Default values of the Nexo chart (docs/08 §8.4, deploy/helm/nexo/README.md).
#
#   helm install nexo oci://ghcr.io/r3n3r0/charts/nexo                      # standalone, 1 drive
#   helm install nexo oci://ghcr.io/r3n3r0/charts/nexo --set mode=distributed  # 4 pods x 2 drives

# -- Deployment mode:
#   standalone:  one pod (Deployment) with standalone.drives volumes: one drive
#                is SNSD, two or more are SNMD (erasure coding across them);
#   distributed: a cluster (StatefulSet + headless Service) of
#                distributed.replicas pods per pool with
#                distributed.drivesPerNode volumes each; the endpoints
#                (http://<release>-{0...N-1}.<release>-hl.<ns>.svc.<domain>:9000/data{1...M})
#                are generated by the chart.
mode: standalone

image:
  # -- Image of the server (it also contains nexoctl, used by the Helm tests).
  repository: ghcr.io/r3n3r0/nexo
  # -- Image tag; the chart appVersion when empty.
  tag: ""
  # -- Image digest (sha256:...); when set it pins the image instead of the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- DNS domain of the Kubernetes cluster, part of the distributed endpoints.
clusterDomain: cluster.local

auth:
  # -- Root user (at least 3 characters).
  rootUser: admin
  # -- Root password (at least 8 characters). Empty: a random one is
  # generated at install and kept on upgrades (see NOTES).
  rootPassword: ""
  # -- Existing Secret with the root credentials; when set, rootUser and
  # rootPassword are ignored.
  existingSecret: ""
  existingSecretUserKey: root-user
  existingSecretPasswordKey: root-password

standalone:
  # -- Drives of the standalone pod: 1 (SNSD, /data) or more (SNMD,
  # /data1 ... /dataN, erasure coding; at most 16 per erasure set).
  drives: 1

distributed:
  # -- Pods (nodes) of every server pool (at least 2).
  replicas: 4
  # -- Drives (one PersistentVolumeClaim each) per pod.
  drivesPerNode: 2
  # -- Server pools. Every pool adds `replicas` pods (StatefulSet ordinals
  # pool*replicas ... pool*replicas+replicas-1). Expanding a running cluster
  # changes the endpoints of every node: all the pods must restart together
  # (kubectl rollout restart, or delete the pods), docs/03.
  pools: 1
  # -- Parallel: the nodes wait for each other at bootstrap, they must start together.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate

persistence:
  # -- Store the drives in PersistentVolumeClaims; with false they are
  # emptyDir volumes, lost with the pod (tests only).
  enabled: true
  # -- StorageClass of the drives ("" = the cluster default, "-" = none).
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  # -- Size of every drive.
  size: 10Gi
  annotations: {}
  # -- standalone with one drive only: an existing claim used as /data.
  existingClaim: ""

cache:
  # -- Disk tier of the cache of the distributions (docs/11), mounted at
  # /cache (NEXO_CACHE_DIR). Without it only the memory tier is used.
  enabled: false
  # -- NEXO_CACHE_SIZE: size of the disk tier (KiB, MiB, GiB, TiB).
  size: 8GiB
  # -- NEXO_CACHE_MEMORY: size of the memory tier (empty = server default).
  memory: ""
  # -- NEXO_CACHE_MODE in a cluster: local, shared or shared+local (empty = local).
  mode: ""
  volume:
    # -- emptyDir (per pod, lost on restart) or pvc (one claim per pod).
    type: emptyDir
    # -- emptyDir medium ("" = node disk, "Memory" = tmpfs counted in the memory limit).
    medium: ""
    # -- emptyDir sizeLimit or PVC size; keep it above cache.size.
    size: 10Gi
    # -- StorageClass of the PVC ("" = default, "-" = none).
    storageClass: ""

tls:
  # -- Serve S3, console and internode RPC over TLS (NEXO_CERTS_DIR=/etc/nexo/certs):
  # the distributed endpoints become https:// and the probes use HTTPS.
  enabled: false
  # -- Secret of type kubernetes.io/tls (tls.crt, tls.key). In distributed
  # mode the certificate must cover the node names
  # *.<fullname>-hl.<namespace>.svc.<clusterDomain>, the Service names
  # <fullname>.<namespace>.svc[.<clusterDomain>] (ServiceMonitor, Helm
  # tests) and the public names (README "Credentials, KMS, TLS").
  # Changes are picked up without a restart (certificate hot reload).
  secretName: ""
  # -- Optional Secret with the CA certificates the nodes trust (mounted in
  # CAs/), e.g. the issuing CA of a cert-manager Certificate.
  caSecretName: ""
  caKey: ca.crt
  # -- NEXO_TLS_MIN_VERSION: "1.2" or "1.3" (empty = server default).
  minVersion: ""
  # -- NEXO_TLS_INTERNODE_VERIFY: mutual TLS between the nodes (the
  # certificate must be usable as a client certificate, signed by a CA of caSecretName).
  internodeVerify: false

kms:
  # -- Builtin KMS master key "<key-name>:<base64 of 32 random bytes>"
  # (openssl rand -base64 32), stored in the chart Secret and passed as
  # NEXO_KMS_SECRET_KEY_FILE. Enables SSE-S3/SSE-KMS.
  secretKey: ""
  # -- Existing Secret with the master key (wins over secretKey).
  existingSecret: ""
  existingSecretKey: kms-secret-key
  kes:
    # -- External KMS (KES) instead of the builtin one: https endpoints, comma separated.
    endpoint: ""
    # -- NEXO_KMS_KEY_NAME: default key of SSE-S3.
    keyName: ""
    # -- Secret with the mutual TLS material: client.crt, client.key, ca.crt.
    existingSecret: ""

# Server settings, passed as NEXO_* environment variables (empty = server default).
config:
  # -- NEXO_REGION
  region: ""
  # -- NEXO_DOMAIN: domain of the virtual-host style buckets.
  domain: ""
  # -- NEXO_SERVER_URL: public S3 URL of presigned and share links.
  # Default: https://<first host of ingress.s3> when that Ingress is enabled.
  serverURL: ""
  # -- NEXO_BROWSER_REDIRECT_URL: public console URL.
  # Default: https://<first host of ingress.console> when that Ingress is enabled.
  browserRedirectURL: ""
  # -- NEXO_TRUSTED_PROXIES: CIDRs of the proxies (Ingress controller pods)
  # whose X-Forwarded-* headers are trusted.
  trustedProxies: []
  # -- NEXO_FORWARDED_HEADERS: x-forwarded or forwarded.
  forwardedHeaders: ""
  # -- NEXO_LOG_LEVEL: debug, info, warn, error.
  logLevel: ""
  # -- NEXO_LOG_FORMAT: json or text.
  logFormat: ""
  # -- NEXO_PROMETHEUS_AUTH_TYPE: jwt (bearer token, see serviceMonitor) or public.
  prometheusAuthType: ""
  # -- NEXO_STORAGE_CLASS_STANDARD: parity as EC:n.
  storageClassStandard: ""
  # -- NEXO_STORAGE_CLASS_RRS: parity as EC:n.
  storageClassRRS: ""
  otel:
    # -- NEXO_OTEL_EXPORTER_OTLP_ENDPOINT: OpenTelemetry collector (http or https URL).
    endpoint: ""
    # -- NEXO_OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf or grpc.
    protocol: ""
    # -- NEXO_OTEL_TRACES_SAMPLER_ARG: share of the traces recorded, 0 to 1
    # (empty = server default, 1).
    sampleRatio: ""

# -- Extra environment variables of the server container (any NEXO_* setting).
extraEnv: []
#  - name: NEXO_SECRET_PROXY_A
#    valueFrom:
#      secretKeyRef: {name: nexo-origin-secrets, key: proxy-a}

# -- Extra envFrom sources of the server container.
envFrom: []

# -- Extra flags of "nexo server", before the endpoints.
extraArgs: []

service:
  # -- Service of the S3 API and of the console (ClusterIP, NodePort or LoadBalancer).
  type: ClusterIP
  annotations: {}
  # -- Service port of the S3 API (and of the distributions).
  s3Port: 9000
  # -- Service port of the console and Admin API.
  consolePort: 9001
  nodePorts:
    s3: ""
    console: ""
  loadBalancerSourceRanges: []
  # -- Local keeps the client address on NodePort/LoadBalancer services.
  externalTrafficPolicy: ""

ingress:
  # S3 API on its own host. /nexo/rpc/ (internode) must not be published:
  # block it at the controller (README "Ingress").
  s3:
    enabled: false
    className: ""
    # -- Uploads need no body limit and no buffering, e.g. for ingress-nginx:
    #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
    #   nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    annotations: {}
    hosts:
      - s3.example.com
    path: /
    pathType: Prefix
    # -- e.g. [{secretName: s3-example-tls, hosts: [s3.example.com]}]
    tls: []
  console:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - console.example.com
    path: /
    pathType: Prefix
    tls: []
  # Custom domains of the distributions (docs/10), routed to the S3 port:
  # the Host header selects the distribution.
  distributions:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    path: /
    pathType: Prefix
    tls: []

serviceMonitor:
  # -- ServiceMonitor of the Prometheus Operator (CRD monitoring.coreos.com/v1).
  enabled: false
  # -- Labels selecting it in the Prometheus resource (e.g. release: prometheus).
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  # -- Secret with a bearer token of nexoctl admin prometheus generate,
  # needed unless config.prometheusAuthType is public.
  bearerTokenSecret:
    name: ""
    key: token
  # -- Also scrape /nexo/metrics/v1/cluster once (through the Service, from
  # the target of the first pod): the cluster metrics are the same on every node.
  cluster: true
  # -- Also scrape /nexo/metrics/v1/bucket once, every bucketInterval.
  bucket: false
  bucketInterval: 5m
  relabelings: []
  metricRelabelings: []

podDisruptionBudget:
  # -- PodDisruptionBudget of the distributed pods (voluntary evictions
  # leave the erasure sets their quorum).
  enabled: true
  maxUnavailable: 1

# -- Spread the distributed pods across nodes: soft (preferred), hard
# (required: one pod per node) or "" (none, use affinity).
podAntiAffinity: soft
podAntiAffinityTopologyKey: kubernetes.io/hostname
affinity: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""
# -- Seconds granted to a stopping node to finish its in-flight requests.
terminationGracePeriodSeconds: 90

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 4Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# Probes on the S3 port: liveness /nexo/health/live (served during the
# bootstrap too), readiness /nexo/health/ready (503 until the node serves
# the APIs, and while it is stopping).
probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 5
    # -- 5s x 120: ten minutes to format the drives or wait for the other nodes.
    failureThreshold: 120
  liveness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # -- Nexo does not call the Kubernetes API.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

networkPolicy:
  # -- NetworkPolicy: the nodes reach each other on the S3 port (internode
  # RPC); S3 and console are reachable from allowedFrom (everywhere when empty).
  enabled: false
  # -- NetworkPolicyPeers allowed to reach the S3 and console ports.
  allowedFrom: []
  #  - namespaceSelector:
  #      matchLabels: {kubernetes.io/metadata.name: ingress-nginx}

tests:
  # -- Bucket created, written, read and removed by "helm test".
  bucket: helm-test
