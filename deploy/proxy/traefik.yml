# Traefik v3 static configuration for a Nexo server or cluster. Routers,
# services and middlewares are in traefik-dynamic.yml (file provider).
#
#   NEXO_ORIGIN_SECRET=$(openssl rand -hex 32) traefik --configFile=traefik.yml
#
# What Nexo needs from Traefik, and the defaults that give it:
#   - the Host header unchanged (passHostHeader, default true): SigV4 signs
#     it, the presigned URLs and the routing of the distributions use it;
#   - no body limit and no buffering: Traefik streams both ways unless the
#     buffering middleware is used (it is not);
#   - X-Forwarded-For/Proto/Host set by Traefik: the incoming ones are
#     dropped unless the client is in forwardedHeaders.trustedIPs;
#   - no read timeout on long uploads: Traefik v3 defaults readTimeout to
#     60 s, disabled (0) on the entry points below.
#
# Traefik has no PROXY protocol towards HTTP backends: the client address
# reaches Nexo in X-Forwarded-For (NEXO_FORWARDED_HEADERS=x-forwarded, the
# default) from the addresses in NEXO_TRUSTED_PROXIES.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 180s
    http:
      tls:
        certResolver: letsencrypt
    # Needed only when another proxy or load balancer (e.g. Cloudflare,
    # see cloudflare.md) sits in front of Traefik: its X-Forwarded-For is
    # kept and extended instead of replaced.
    # forwardedHeaders:
    #   trustedIPs: ["173.245.48.0/20", "103.21.244.0/22"]
    # A layer-4 load balancer sending the PROXY protocol to Traefik:
    # proxyProtocol:
    #   trustedIPs: ["10.0.0.0/8"]

providers:
  file:
    filename: traefik-dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com
      storage: /etc/traefik/acme.json
      # TLS-ALPN works for single host names (s3, console, the domains of
      # the distributions).
      tlsChallenge: {}
      # Wildcards (*.s3.example.com for virtual-host style buckets,
      # *.preview.example.com) need a DNS challenge instead:
      # dnsChallenge:
      #   provider: cloudflare

serversTransport:
  # Nexo nodes serving plain HTTP behind Traefik need nothing here. With TLS
  # on the nodes (NEXO_CERTS_DIR), trust their CA:
  # rootCAs:
  #   - /etc/traefik/nexo-ca.crt
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 0s
    idleConnTimeout: 90s
  maxIdleConnsPerHost: 64

api:
  dashboard: false

log:
  level: INFO
  format: json

accessLog:
  format: json
