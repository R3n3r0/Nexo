# nginx in front of a Nexo server (or cluster load balancer) with TLS
# termination. Drop it in /etc/nginx/conf.d/nexo.conf (http context).
#
#   https://s3.example.com         -> S3 API        (127.0.0.1:9000)
#   https://*.s3.example.com       -> S3 API, virtual-host style buckets
#   https://console.example.com    -> console + Admin API (127.0.0.1:9001)
#
# Pair it with, in nexo.env:
#   NEXO_SERVER_URL=https://s3.example.com
#   NEXO_BROWSER_REDIRECT_URL=https://console.example.com
#   NEXO_TRUSTED_PROXIES=127.0.0.1
#   NEXO_DOMAIN=s3.example.com        # only for virtual-host style buckets
#
# Rules that must hold for any S3 proxy:
#   - Host forwarded unchanged (SigV4 signs it; otherwise presigned URLs break);
#   - no body size limit and no request buffering (streamed uploads);
#   - X-Forwarded-Proto/Host so Nexo generates https public URLs.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream nexo_s3 {
    server 127.0.0.1:9000 max_fails=3 fail_timeout=10s;
    # Add the other nodes of a cluster here (or point to the compose lb).
    # server 10.0.0.2:9000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream nexo_console {
    server 127.0.0.1:9001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name s3.example.com *.s3.example.com console.example.com;
    return 301 https://$host$request_uri;
}

# S3 API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.example.com *.s3.example.com;

    # A wildcard certificate is required for virtual-host style buckets.
    ssl_certificate     /etc/nginx/certs/s3.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/s3.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:nexo_ssl:10m;

    ignore_invalid_headers off;
    client_max_body_size    0;
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_http_version      1.1;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_next_upstream   error timeout http_502 http_503 http_504;

    location / {
        proxy_pass http://nexo_s3;
    }
}

# Console + Admin API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/nginx/certs/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/console.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:nexo_ssl:10m;

    client_max_body_size    0;
    proxy_request_buffering off;
    proxy_buffering         off;      # SSE streams (live logs, traces)
    proxy_http_version      1.1;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    3600s;

    location / {
        proxy_pass http://nexo_console;
    }
}
