# nginx in front of a Nexo server or cluster, terminating TLS. Drop it in
# /etc/nginx/conf.d/nexo.conf (http context of the stock nginx.conf).
#
#   https://s3.example.com         -> S3 API              (port 9000 of the nodes)
#   https://*.s3.example.com       -> S3 API, virtual-host style buckets
#   https://console.example.com    -> console + Admin API (port 9001 of the nodes)
#   https://www.example.com, ...   -> distributions        (port 9000 of the nodes,
#                                     routed by Nexo on the Host header)
#
# Pair it with, in nexo.env (docs/08 §8.5, docs/10 §10.2):
#   NEXO_SERVER_URL=https://s3.example.com
#   NEXO_BROWSER_REDIRECT_URL=https://console.example.com
#   NEXO_TRUSTED_PROXIES=10.0.0.10          # the address(es) nginx connects from
#   NEXO_DOMAIN=s3.example.com              # only for virtual-host style buckets
#   NEXO_SECRET_PROXY_A=<the origin secret below>
# and give the distributions served here the origin secret of this proxy:
#   restrictions:
#     originSecretHeader: { name: X-Origin-Secret, values: ["${secret:proxy-a}"] }
#
# Rules that hold for every server block:
#   - Host forwarded unchanged ($http_host, with the port): SigV4 signs it,
#     presigned URLs and the routing of the distributions depend on it;
#   - no body size limit and no buffering (uploads and downloads stream);
#   - X-Forwarded-For/Proto/Host so that Nexo sees the real client (source
#     address conditions, HTTPS-only redirects, public URLs); Nexo reads
#     them only from NEXO_TRUSTED_PROXIES, from the right of
#     X-Forwarded-For, so a client cannot forge its address;
#   - a Forwarded header sent by the client is dropped: Nexo reads one
#     family only (NEXO_FORWARDED_HEADERS, default x-forwarded).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Every node of the cluster: nginx balances and fails over (a single
# server needs one line). Distributions and S3 share the S3 port.
upstream nexo_s3 {
    least_conn;
    server 10.0.0.1:9000 max_fails=3 fail_timeout=10s;
    server 10.0.0.2:9000 max_fails=3 fail_timeout=10s;
    server 10.0.0.3:9000 max_fails=3 fail_timeout=10s;
    server 10.0.0.4:9000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream nexo_console {
    least_conn;
    server 10.0.0.1:9001 max_fails=3 fail_timeout=10s;
    server 10.0.0.2:9001 max_fails=3 fail_timeout=10s;
    server 10.0.0.3:9001 max_fails=3 fail_timeout=10s;
    server 10.0.0.4:9001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Shared by the three HTTPS server blocks. proxy_set_header is not
# inherited by a block that defines one of its own, so the blocks below
# only add the origin secret where it is needed (repeating the set).
client_max_body_size    0;
proxy_request_buffering off;
proxy_buffering         off;
proxy_http_version      1.1;
ignore_invalid_headers  off;   # S3 clients send headers nginx would drop
proxy_connect_timeout   5s;
proxy_send_timeout      300s;
proxy_read_timeout      300s;
# Fail over to another node when one is down or restarting. POST/PATCH
# are never replayed once sent (nginx default for non-idempotent methods).
proxy_next_upstream       error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;

ssl_protocols     TLSv1.2 TLSv1.3;
ssl_session_cache shared:nexo_ssl:10m;

# Plain HTTP: redirect to HTTPS, except the ACME challenges of the
# distributions with tls.certificate=auto (Nexo answers them).
server {
    listen 80;
    listen [::]:80;
    server_name s3.example.com *.s3.example.com console.example.com
                www.example.com example.com *.preview.example.com;

    location /.well-known/acme-challenge/ {
        # Set every forwarding header: a header nginx does not set goes
        # through as the client sent it.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        proxy_pass http://nexo_s3;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# S3 API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.example.com *.s3.example.com;

    # A wildcard certificate is required for virtual-host style buckets.
    ssl_certificate     /etc/nginx/certs/s3.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/s3.example.com/privkey.pem;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Forwarded         "";
    proxy_set_header Connection        "";

    # The internode RPC shares the S3 port of the nodes but only travels
    # between them: never expose it.
    location ^~ /nexo/rpc/ {
        return 404;
    }
    # The session channel of the Nexo player (video protection, advanced
    # mode): a WebSocket. A proxy_set_header here replaces every inherited
    # one, so the forwarding headers are repeated. Without it the player
    # falls back to POST requests.
    location ~ ^/nexo/media/v1/[^/]+/session$ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_pass http://nexo_s3;
    }
    location / {
        proxy_pass http://nexo_s3;
    }
}

# Console + Admin API (SSE/WebSocket for live logs and traces).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/nginx/certs/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/console.example.com/privkey.pem;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Forwarded         "";
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location / {
        proxy_pass         http://nexo_console;
        proxy_read_timeout 3600s;
    }
}

# Distributions (docs/10 §10.2): the custom domains of the website and s3
# distributions. Nexo picks the distribution from the Host header; the
# origin secret proves the request came through this proxy (a request
# that reaches a node directly, without it, is refused with 403). Use one
# secret per proxy: rotate it with `nexoctl dist origin-secret rotate`
# (both values stay valid until the old one is dropped) or keep it in
# NEXO_SECRET_PROXY_A and reference ${secret:proxy-a}.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com example.com *.preview.example.com;

    # Certificates of the domains (a wildcard for *.preview.example.com).
    # With tls.certificate=auto on the distribution, Nexo obtains them
    # itself: expose its --web-tls-address instead (TLS passthrough).
    ssl_certificate     /etc/nginx/certs/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/example.com/privkey.pem;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Forwarded         "";
    proxy_set_header Connection        "";
    # Replaces any value a client sends.
    proxy_set_header X-Origin-Secret   "REPLACE-WITH-THE-ORIGIN-SECRET-OF-PROXY-A";

    # The internode RPC shares the S3 port of the nodes but only travels
    # between them: never expose it, on any domain.
    location ^~ /nexo/rpc/ {
        return 404;
    }
    # Nexo caches the distributions itself (docs/11) and invalidates on
    # every write: an nginx proxy_cache here would serve stale objects.
    # When you add one anyway, purge it with a cache webhook of the
    # distribution (`nexoctl cache webhook add ... --type nginx`).
    location / {
        proxy_pass http://nexo_s3;
    }
}
