# HAProxy (>= 2.4) in front of a Nexo server or cluster, terminating TLS.
#
#   https://s3.example.com         -> S3 API              (port 9000 of the nodes)
#   https://*.s3.example.com       -> S3 API, virtual-host style buckets
#   https://console.example.com    -> console + Admin API (port 9001 of the nodes)
#   https://www.example.com, ...   -> distributions        (port 9000, routed by Nexo
#                                     on the Host header)
#
# The client address reaches Nexo with the PROXY protocol v2 (send-proxy-v2-ssl:
# the source address of the client and whether it used TLS), not with
# X-Forwarded-For. In nexo.env (docs/08 §8.5, docs/10 §10.2):
#   NEXO_SERVER_URL=https://s3.example.com
#   NEXO_BROWSER_REDIRECT_URL=https://console.example.com
#   NEXO_TRUSTED_PROXIES=10.0.0.11          # the address(es) HAProxy connects from
#   NEXO_PROXY_PROTOCOL=s3                  # the listeners receiving the PROXY header
#   NEXO_SECRET_PROXY_B=<same value as NEXO_ORIGIN_SECRET of HAProxy>
# and on the distributions served here:
#   restrictions:
#     originSecretHeader: { name: X-Origin-Secret, values: ["${secret:proxy-b}"] }
#
# The origin secret comes from the environment of HAProxy:
#   NEXO_ORIGIN_SECRET=$(openssl rand -hex 32) haproxy -f haproxy.cfg
#
# Without the PROXY protocol, replace send-proxy-v2-ssl with "option
# forwardfor" plus the X-Forwarded-Proto/Host headers commented below.

global
    log stdout format raw local0 info
    # Each connection takes two file descriptors (client and server):
    # raise it together with the limit of open files of the process.
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2
    # HAProxy never buffers a request body unless asked to
    # (option http-buffer-request is not set): uploads stream through.
    tune.bufsize 32768

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    # A node stopped or restarting: a refused connection is retried on
    # another node for any request (nothing was sent); a node that is
    # stopping answers 503 until the health checks take it out of the
    # rotation, so the bodyless reads are retried on 503/504, an empty
    # answer or a timeout too (L7 retries, never for the writes: their
    # body is not kept). "redispatch" picks another server for a retry.
    retries 3
    option  redispatch
    retry-on conn-failure empty-response response-timeout 503 504
    timeout connect 5s
    # Long transfers: S3 uploads and downloads of large objects, SSE
    # streams of the console.
    timeout client  1h
    timeout server  1h
    timeout http-request 30s
    timeout http-keep-alive 60s
    # WebSockets: the console's live views and the session channel of the
    # Nexo player (/nexo/media/v1/{bucket}/session).
    timeout tunnel  1h

frontend https
    bind :80
    # One PEM per domain set (certificate + key), picked by SNI.
    bind :443 ssl crt /usr/local/etc/haproxy/certs/ alpn h2,http/1.1
    # Plain HTTP: HTTPS, except the ACME challenges of the distributions
    # with tls.certificate=auto (Nexo answers them).
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 if !{ ssl_fc } !acme

    # Nexo reads one family of forwarding headers: the ones a client
    # sends never reach it (the PROXY header carries the client).
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    # L7 retries (retry-on above) for the reads only.
    http-request disable-l7-retry unless METH_GET || METH_OPTIONS

    # The Host header without its port.
    acl host_console req.hdr(host),field(1,:) -i console.example.com
    acl host_s3      req.hdr(host),field(1,:) -i s3.example.com
    acl host_s3      req.hdr(host),field(1,:) -m end -i .s3.example.com
    acl rpc          path_beg /nexo/rpc/

    # The internode RPC shares the S3 port of the nodes but only travels
    # between them: never expose it.
    http-request deny deny_status 404 if rpc
    use_backend nexo_console if host_console
    use_backend nexo_s3 if host_s3
    default_backend nexo_distributions

# S3 API: the Host header goes through unchanged (SigV4 signs it).
backend nexo_s3
    balance leastconn
    option httpchk GET /nexo/health/ready
    http-check expect status 200
    # Without the PROXY protocol:
    # option forwardfor
    # http-request set-header X-Forwarded-Proto https if { ssl_fc }
    # http-request set-header X-Forwarded-Host %[req.hdr(host)]
    default-server send-proxy-v2-ssl check inter 5s fall 3 rise 2
    server nexo1 10.0.0.1:9000
    server nexo2 10.0.0.2:9000
    server nexo3 10.0.0.3:9000
    server nexo4 10.0.0.4:9000

# Console + Admin API: the console listener receives X-Forwarded-*
# (NEXO_PROXY_PROTOCOL lists s3 only).
backend nexo_console
    balance leastconn
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    option httpchk GET /nexo/health/live
    http-check expect status 200
    default-server check inter 5s fall 3 rise 2
    server nexo1 10.0.0.1:9001
    server nexo2 10.0.0.2:9001
    server nexo3 10.0.0.3:9001
    server nexo4 10.0.0.4:9001

# Distributions (docs/10 §10.2): every other host. The origin secret
# proves that a request came through this proxy: a request that reaches
# a node directly without it is refused (403). One secret per proxy (see
# README.md).
backend nexo_distributions
    balance leastconn
    # Replaces any value a client sends.
    http-request set-header X-Origin-Secret "${NEXO_ORIGIN_SECRET}"
    option httpchk GET /nexo/health/ready
    http-check expect status 200
    default-server send-proxy-v2-ssl check inter 5s fall 3 rise 2
    server nexo1 10.0.0.1:9000
    server nexo2 10.0.0.2:9000
    server nexo3 10.0.0.3:9000
    server nexo4 10.0.0.4:9000
