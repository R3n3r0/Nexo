# The operator: one active replica (leader election), restricted pod
# security. WATCH_NAMESPACE (comma separated) limits it to some namespaces.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexo-operator
  namespace: nexo-operator
  labels:
    app.kubernetes.io/name: nexo-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexo-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexo-operator
    spec:
      serviceAccountName: nexo-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: docker.io/paolor/nexo-operator:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: WATCH_NAMESPACE
              value: ""
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
