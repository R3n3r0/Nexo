# Nexo distributed cluster: 4 nodes x 2 drives (one erasure set of 8 drives)
# behind an nginx load balancer exposing S3 (9000) and the console (9001).
#
#   cp nexo.env.example nexo.env
#   docker compose -f compose.cluster.yml up -d
#   docker compose -f compose.cluster.yml stop nexo3   # the cluster keeps serving
#
# Every node runs the same command and discovers the others by hostname
# (nexo1..nexo4). Clients only talk to the load balancer: sessions are
# stateless (JWT cookies), so no sticky sessions are needed.
name: nexo-cluster

x-nexo: &nexo
  image: ${NEXO_IMAGE:-docker.io/paolor/nexo:latest}
  command: ["server", "--console-address", ":9001", "http://nexo{1...4}:9000/data{1...2}"]
  env_file:
    - nexo.env
  environment:
    # Disk tier of the distribution cache (docs/11): one volume per node,
    # ideally on an SSD/NVMe. NEXO_CACHE_MODE=shared keeps one copy of an
    # object in the cluster (its owner node) instead of one per node.
    NEXO_CACHE_DIR: /cache
    NEXO_CACHE_SIZE: ${NEXO_CACHE_SIZE:-10GiB}
    NEXO_CACHE_MODE: ${NEXO_CACHE_MODE:-local}
  healthcheck:
    test: ["CMD", "/nexo", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s
  restart: unless-stopped
  stop_grace_period: 30s

services:
  nexo1:
    <<: *nexo
    hostname: nexo1
    volumes:
      - d1-1:/data1
      - d1-2:/data2
      - c1:/cache

  nexo2:
    <<: *nexo
    hostname: nexo2
    volumes:
      - d2-1:/data1
      - d2-2:/data2
      - c2:/cache

  nexo3:
    <<: *nexo
    hostname: nexo3
    volumes:
      - d3-1:/data1
      - d3-2:/data2
      - c3:/cache

  nexo4:
    <<: *nexo
    hostname: nexo4
    volumes:
      - d4-1:/data1
      - d4-2:/data2
      - c4:/cache

  # Load balancer: HTTP reverse proxy for S3 and console. The Host header is
  # forwarded unchanged so SigV4 signatures and presigned URLs stay valid.
  lb:
    image: nginx:1.27-alpine
    ports:
      - "${NEXO_S3_PORT:-9000}:9000"
      - "${NEXO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        # A fixed address: the only proxy NEXO_TRUSTED_PROXIES may trust
        # (nexo.env.example), never a whole range of the Docker networks.
        ipv4_address: 172.29.0.10
    depends_on:
      - nexo1
      - nexo2
      - nexo3
      - nexo4
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9001/nexo/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  # The default network of the project, so that the services of an overlay
  # (compose.observability.yml: Prometheus, Grafana) share it with the
  # nodes and the load balancer.
  default:
    ipam:
      config:
        # The load balancer has a fixed address; the nodes (and the
        # services of an overlay) get theirs from ip_range, which never
        # includes it.
        - subnet: 172.29.0.0/24
          ip_range: 172.29.0.128/25

volumes:
  d1-1: {}
  d1-2: {}
  d2-1: {}
  d2-2: {}
  d3-1: {}
  d3-2: {}
  d4-1: {}
  d4-2: {}
  c1: {}
  c2: {}
  c3: {}
  c4: {}
