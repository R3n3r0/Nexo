# nginx TCP passthrough for a Nexo cluster with TLS (compose.cluster-tls.yml).
# Mounted at /etc/nginx/nginx.conf: this is a complete configuration.
#
# TLS is terminated by the Nexo nodes themselves (NEXO_CERTS_DIR=/certs), so
# nginx only balances TCP connections: the client sees Nexo's certificate,
# the Host header travels untouched and presigned URLs stay valid.
#
# To hand the client address to Nexo add "proxy_protocol on;" to the server
# blocks and enable PROXY protocol support on the nodes.
#
# TCP passthrough cannot filter paths: the internode RPC (/nexo/rpc/v1 on
# the S3 port, HTTP/2 only, authenticated) is reachable through this
# balancer too. Publish it only where the network in front of it is
# trusted, or terminate TLS here (http block with "location ^~ /nexo/rpc/
# { return 404; }", as in nginx.conf) and re-encrypt towards the nodes.

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    log_format basic '$remote_addr [$time_local] $protocol $status '
                     '$bytes_sent $bytes_received $session_time upstream=$upstream_addr';
    access_log /dev/stdout basic;

    # Re-resolve node addresses through Docker's DNS (nginx >= 1.27.3).
    upstream nexo_s3 {
        zone nexo_s3 64k;
        resolver 127.0.0.11 valid=10s;
        least_conn;
        server nexo1:9000 resolve max_fails=3 fail_timeout=10s;
        server nexo2:9000 resolve max_fails=3 fail_timeout=10s;
        server nexo3:9000 resolve max_fails=3 fail_timeout=10s;
        server nexo4:9000 resolve max_fails=3 fail_timeout=10s;
    }

    upstream nexo_console {
        zone nexo_console 64k;
        resolver 127.0.0.11 valid=10s;
        least_conn;
        server nexo1:9001 resolve max_fails=3 fail_timeout=10s;
        server nexo2:9001 resolve max_fails=3 fail_timeout=10s;
        server nexo3:9001 resolve max_fails=3 fail_timeout=10s;
        server nexo4:9001 resolve max_fails=3 fail_timeout=10s;
    }

    # S3 API (TLS passthrough)
    server {
        listen 9000;
        listen [::]:9000;
        proxy_pass            nexo_s3;
        proxy_connect_timeout 5s;
        proxy_timeout         1h;
    }

    # Console + Admin API (TLS passthrough)
    server {
        listen 9001;
        listen [::]:9001;
        proxy_pass            nexo_console;
        proxy_connect_timeout 5s;
        proxy_timeout         1h;
    }
}
