# Edge B of compose.multi-proxy.yml: HAProxy in front of the 4 nodes for
# the domains *.beta.example (distributions only).
#
# The client reaches Nexo in a PROXY protocol v2 header (send-proxy-v2-ssl:
# its address and whether it used TLS): this proxy is in
# NEXO_TRUSTED_PROXIES and the nodes accept the header on the S3 port
# (NEXO_PROXY_PROTOCOL=s3). The Host header goes through unchanged, the
# bodies are streamed, and the origin secret of this proxy
# (NEXO_ORIGIN_SECRET in the environment) replaces any value a client
# sends. The image runs HAProxy as a non-root user: it listens on 8080
# and 8443 (published as 8081 and 9443 by the compose file).

global
    log stdout format raw local0 info
    # Each connection takes two file descriptors (client and server):
    # raise it together with the limit of open files of the process.
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

# Node addresses re-resolved through the Docker DNS.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold nx 10s

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    # A node stopped or restarting: a refused connection is retried on
    # another node for any request (nothing was sent); a node that is
    # stopping answers 503 until the health checks take it out of the
    # rotation, so the bodyless reads are retried on 503/504, an empty
    # answer or a timeout too (L7 retries, never for the writes: their
    # body is not kept). "redispatch" picks another server for a retry.
    retries 3
    option  redispatch
    retry-on conn-failure empty-response response-timeout 503 504
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout http-request 30s
    timeout http-keep-alive 60s

# Liveness of the proxy itself (healthcheck of the container).
frontend health
    bind :8404
    monitor-uri /healthz

frontend edge
    bind :8080
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/beta.pem alpn h2,http/1.1

    # This proxy serves *.beta.example only.
    acl beta req.hdr(host),field(1,:) -i beta.example
    acl beta req.hdr(host),field(1,:) -m end -i .beta.example
    http-request return status 421 if !beta
    # The internode RPC is never exposed, on any domain.
    http-request deny deny_status 404 if { path_beg /nexo/rpc/ }

    # The client is described by the PROXY header: the forwarding headers
    # a client sends never reach Nexo.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    # L7 retries (retry-on above) for the reads only.
    http-request disable-l7-retry unless METH_GET || METH_OPTIONS
    default_backend nexo_distributions

backend nexo_distributions
    balance leastconn
    http-request set-header X-Origin-Secret "${NEXO_ORIGIN_SECRET}"
    option httpchk GET /nexo/health/ready
    http-check expect status 200
    default-server send-proxy-v2-ssl check inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server nexo1 nexo1:9000
    server nexo2 nexo2:9000
    server nexo3 nexo3:9000
    server nexo4 nexo4:9000
