# nginx load balancer for a Nexo cluster (compose.cluster.yml).
# Mounted at /etc/nginx/nginx.conf: this is a complete configuration.
#
# Two listeners: 9000 -> S3 API of every node, 9001 -> console/Admin API.
# Essentials for S3 compatibility:
#   - Host forwarded unchanged (SigV4 signs it; presigned URLs would break);
#   - no body size limit and no request buffering (uploads stream through);
#   - X-Forwarded-* so Nexo can build public URLs (NEXO_TRUSTED_PROXIES).

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for" rt=$request_time upstream=$upstream_addr';
    access_log /dev/stdout main;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    server_tokens     off;

    # S3 clients may send headers that nginx would otherwise drop.
    ignore_invalid_headers off;

    # --- S3 essentials (see header) ----------------------------------------
    client_max_body_size    0;
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_http_version      1.1;

    # proxy_set_header is not inherited once redefined in a child block, so
    # the whole set lives here and is never repeated below.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # Keep upstream connections alive, but honour WebSocket/SSE upgrades.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Fail over to another node when one is down or restarting.
    proxy_next_upstream       error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Re-resolve node addresses through Docker's DNS so that a recreated
    # container (new IP) is picked up without restarting nginx.
    # Requires nginx >= 1.27.3 (resolve/resolver in upstream, open source).
    upstream nexo_s3 {
        zone nexo_s3 64k;
        resolver 127.0.0.11 valid=10s;
        least_conn;
        server nexo1:9000 resolve max_fails=3 fail_timeout=10s;
        server nexo2:9000 resolve max_fails=3 fail_timeout=10s;
        server nexo3:9000 resolve max_fails=3 fail_timeout=10s;
        server nexo4:9000 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream nexo_console {
        zone nexo_console 64k;
        resolver 127.0.0.11 valid=10s;
        least_conn;
        server nexo1:9001 resolve max_fails=3 fail_timeout=10s;
        server nexo2:9001 resolve max_fails=3 fail_timeout=10s;
        server nexo3:9001 resolve max_fails=3 fail_timeout=10s;
        server nexo4:9001 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # S3 API
    server {
        listen      9000;
        listen      [::]:9000;
        server_name _;

        # The internode RPC shares the S3 port of the nodes but must only
        # travel on the internal network between them: never expose it
        # through the public load balancer.
        location ^~ /nexo/rpc/ {
            return 404;
        }

        location / {
            proxy_pass http://nexo_s3;
        }
    }

    # Console + Admin API (SSE/WebSocket for live logs and traces).
    server {
        listen      9001;
        listen      [::]:9001;
        server_name _;

        location / {
            proxy_pass         http://nexo_console;
            proxy_read_timeout 3600s;
        }
    }
}
