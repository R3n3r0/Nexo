# Prometheus + Grafana for Nexo, provisioned with a datasource and a base
# dashboard. Use it as an overlay on top of a Nexo compose file so that the
# scrapers share the network with the nodes:
#
#   # single node (compose.single.yml / compose.snmd.yml: service "nexo")
#   docker compose -f compose.single.yml -f compose.observability.yml up -d
#
#   # cluster (nexo1..nexo4)
#   PROMETHEUS_CONFIG=prometheus.cluster.yml \
#     docker compose -f compose.cluster.yml -f compose.observability.yml up -d
#
#   open http://localhost:3000   # Grafana (admin / admin by default, see GRAFANA_*)
#   open http://localhost:9090   # Prometheus
#
# Nexo exposes metrics on :9000 under /nexo/metrics/v1/{cluster,node,bucket};
# set NEXO_PROMETHEUS_AUTH_TYPE=public in nexo.env or configure a bearer
# token in observability/prometheus.*.yml.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./observability/${PROMETHEUS_CONFIG:-prometheus.single.yml}:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data: {}
  grafana-data: {}
